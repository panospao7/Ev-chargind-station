openapi: 3.0.3
info:
  title: Driver BFF API
  version: 1.0.0
  description: BFF for the driver mobile/web application
servers:
  - url: https://api.example.com
    description: Production server
paths:
  /api/v1/session:
    get:
      operationId: getSession
      summary: Get current session state
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Current session state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionState'
              example:
                authenticated: true
                acr: "loa2"
                authenticationTime: "2026-09-14T08:30:00Z"
                idleExpiresAt: "2026-09-14T09:00:00Z"
                absoluteExpiresAt: "2026-09-14T20:30:00Z"
        '401':
          description: >
            No valid session (AUTHENTICATION_REQUIRED) or the session has
            expired or been revoked (SESSION_EXPIRED).
          content:
            application/json:
              schema:
                $ref: ../schemas/common/problem-details.json
              examples:
                authenticationRequired:
                  summary: AUTHENTICATION_REQUIRED
                  value:
                    type: "https://api.evplatform.example/problems/authentication_required"
                    title: "AUTHENTICATION_REQUIRED"
                    status: 401
                    detail: "A valid authenticated session is required to access this resource."
                sessionExpired:
                  summary: SESSION_EXPIRED
                  value:
                    type: "https://api.evplatform.example/problems/session_expired"
                    title: "SESSION_EXPIRED"
                    status: 401
                    detail: "The session has expired or was revoked. Sign in again."
  /api/v1/session/csrf:
    get:
      operationId: getSessionCsrf
      summary: Get the session-bound CSRF token
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Session-bound CSRF token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionCsrfToken'
              example:
                token: "b6f3e2c4-9d1a-4a5e-8f3c-2b7d6a1e5f90"
                headerName: "X-CSRF-TOKEN"
        '401':
          description: >
            No valid session (AUTHENTICATION_REQUIRED) or the session has
            expired or been revoked (SESSION_EXPIRED).
          content:
            application/json:
              schema:
                $ref: ../schemas/common/problem-details.json
  /api/v1/session/logout:
    post:
      operationId: logout
      summary: Log out of the current BFF session
      security:
        - sessionCookie: []
      parameters:
        - name: X-CSRF-TOKEN
          in: header
          required: true
          description: Session-bound CSRF token obtained from GET /api/v1/session/csrf
          schema:
            type: string
      responses:
        '204':
          description: Session revoked and session cookie cleared
        '401':
          description: >
            No valid session (AUTHENTICATION_REQUIRED) or the session has
            expired or been revoked (SESSION_EXPIRED).
          content:
            application/json:
              schema:
                $ref: ../schemas/common/problem-details.json
        '403':
          description: >
            CSRF validation failed (CSRF_VALIDATION_FAILED) or the request
            origin is not allowed (ORIGIN_NOT_ALLOWED).
          content:
            application/json:
              schema:
                $ref: ../schemas/common/problem-details.json
              examples:
                csrfValidationFailed:
                  summary: CSRF_VALIDATION_FAILED
                  value:
                    type: "https://api.evplatform.example/problems/csrf_validation_failed"
                    title: "CSRF_VALIDATION_FAILED"
                    status: 403
                    detail: "The request failed CSRF validation."
                originNotAllowed:
                  summary: ORIGIN_NOT_ALLOWED
                  value:
                    type: "https://api.evplatform.example/problems/origin_not_allowed"
                    title: "ORIGIN_NOT_ALLOWED"
                    status: 403
                    detail: "The request origin is not allowed."
  /api/v1/stations/{stationRef}:
    get:
      operationId: getStation
      summary: Get station details
      parameters:
        - name: stationRef
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Station details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Station'
        '404':
          description: Station not found
          content:
            application/json:
              schema:
                $ref: ../schemas/common/problem-details.json
  /api/v1/bookings/{bookingRef}/check-in:
    post:
      operationId: checkIn
      summary: Check in to a booking
      parameters:
        - name: bookingRef
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Check-in successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckInResponse'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: ../schemas/common/problem-details.json
  /api/v1/bookings/{bookingRef}/charging-session/start:
    post:
      operationId: startChargingSession
      summary: Start a charging session
      parameters:
        - name: bookingRef
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartChargingRequest'
      responses:
        '200':
          description: Charging session started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChargingSession'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: ../schemas/common/problem-details.json
  /api/v1/bookings/{bookingRef}/charging-session/stop:
    post:
      operationId: stopChargingSession
      summary: Stop a charging session
      parameters:
        - name: bookingRef
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Charging session stopped
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChargingSession'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: ../schemas/common/problem-details.json
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-evsession
  schemas:
    Station:
      type: object
      properties:
        ref:
          type: string
        name:
          type: string
        address:
          type: string
        latitude:
          type: number
        longitude:
          type: number
      required:
        - ref
        - name
    CheckInResponse:
      type: object
      properties:
        bookingRef:
          type: string
        status:
          type: string
          enum:
            - checked_in
            - already_checked_in
      required:
        - bookingRef
        - status
    StartChargingRequest:
      type: object
      properties:
        evseRef:
          type: string
      required:
        - evseRef
    ChargingSession:
      type: object
      properties:
        sessionRef:
          type: string
        bookingRef:
          type: string
        status:
          type: string
          enum:
            - active
            - stopped
        startedAt:
          type: string
          format: date-time
      required:
        - sessionRef
        - bookingRef
        - status
    SessionState:
      type: object
      properties:
        authenticated:
          type: boolean
        acr:
          type: string
          nullable: true
          description: >
            Authentication Context Class Reference from the IdP
            authentication; null when unavailable.
        authenticationTime:
          type: string
          format: date-time
          nullable: true
        idleExpiresAt:
          type: string
          format: date-time
          nullable: true
        absoluteExpiresAt:
          type: string
          format: date-time
          nullable: true
      required:
        - authenticated
    SessionCsrfToken:
      type: object
      properties:
        token:
          type: string
        headerName:
          type: string
          description: Header that carries the token on mutations (X-CSRF-TOKEN)
      required:
        - token
        - headerName
security:
  - sessionCookie: []
