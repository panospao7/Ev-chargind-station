openapi: 3.0.3
info:
  title: Public Discovery & Insights API
  version: 1.0.0
  description: Public API for Discovery & Insights
servers:
  - url: https://api.example.com
    description: Production server
paths:
  /api/v1/stations:
    get:
      operationId: listStations
      summary: List charging stations
      parameters:
        - name: latitude
          in: query
          schema:
            type: number
        - name: longitude
          in: query
          schema:
            type: number
        - name: radius
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: connectorType
          in: query
          description: >
            Depth filter: only stations with at least one ACTIVE EVSE having
            an ACTIVE connector of exactly this type (e.g. CCS, TYPE2).
          schema:
            type: string
        - name: minPowerW
          in: query
          description: >
            Depth filter: only stations with at least one ACTIVE EVSE having
            an ACTIVE connector with maxPowerW greater than or equal to this
            value in watts. Combinable with connectorType.
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: List of stations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StationSummary'
  /api/v1/stations/{stationRef}:
    get:
      operationId: getStationDetails
      summary: Get public station details
      parameters:
        - name: stationRef
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Station details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StationDetails'
              example:
                ref: "SEEDSTA0001"
                name: "Seed Fixture — Athens Center"
                address: "Fixture Street 1"
                latitude: 37.983810
                longitude: 23.727540
                city: "Athens"
                postalCode: "10431"
                countryCode: "GR"
                updatedAt: "2026-09-12T00:00:00Z"
                sourceVersion: 0
                totalEvses: 2
                evses:
                  - uid: "GR*SEED*A1"
                    connectors:
                      - type: "CCS"
                        maxPowerW: 150000
                      - type: "TYPE2"
                        maxPowerW: 22000
                  - uid: "GR*SEED*A2"
                    connectors:
                      - type: "CCS"
                        maxPowerW: 150000
                      - type: "TYPE2"
                        maxPowerW: 22000
                tariff:
                  currency: "EUR"
                  components:
                    - kind: "ENERGY_PER_KWH"
                      unit: "KWH"
                      amountMinor: 480
                    - kind: "OCCUPANCY_PER_MINUTE"
                      unit: "MINUTE"
                      amountMinor: 10
        '404':
          description: Station not found
          content:
            application/json:
              schema:
                $ref: ../schemas/common/problem-details.json
  /api/v1/stations/{stationRef}/availability:
    get:
      operationId: getStationAvailability
      summary: Get station availability
      parameters:
        - name: stationRef
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Station availability
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StationAvailability'
        '404':
          description: Station not found
          content:
            application/json:
              schema:
                $ref: ../schemas/common/problem-details.json
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
    anonymous:
      type: http
      scheme: bearer
      description: Anonymous access with rate limiting
  schemas:
    StationSummary:
      type: object
      properties:
        ref:
          type: string
        name:
          type: string
        address:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        availableEvses:
          type: integer
        totalEvses:
          type: integer
      required:
        - ref
        - name
        - latitude
        - longitude
    StationDetails:
      type: object
      properties:
        ref:
          type: string
          description: Public station reference
        name:
          type: string
          description: Station display name
        address:
          type: string
          description: Street address
        latitude:
          type: number
          description: Latitude in decimal degrees
        longitude:
          type: number
          description: Longitude in decimal degrees
        city:
          type: string
          description: City
        postalCode:
          type: string
          description: Postal code
        countryCode:
          type: string
          description: ISO 3166 alpha-2 country code
        updatedAt:
          type: string
          format: date-time
          description: Projection update timestamp (operational freshness)
        sourceVersion:
          type: integer
          description: Source aggregate version of the last applied event
        totalEvses:
          type: integer
          description: Number of ACTIVE EVSEs projected for this station
        evses:
          type: array
          description: >
            The station's ACTIVE EVSEs with their ACTIVE connectors (public
            provider-side identities only).
          items:
            $ref: '#/components/schemas/EvseView'
        tariff:
          description: >
            The highest-version ACTIVE published tariff version (nullable —
            absent when no tariff is projected). Organization-scoped in the
            source domain: the platform-published version, not a per-station
            price.
          nullable: true
          allOf:
            - $ref: '#/components/schemas/TariffView'
      required:
        - ref
        - name
        - latitude
        - longitude
        - updatedAt
    EvseView:
      type: object
      properties:
        uid:
          type: string
          description: Provider-side EVSE UID (public identity)
        connectors:
          type: array
          description: The EVSE's ACTIVE connectors ordered by type
          items:
            $ref: '#/components/schemas/ConnectorView'
      required:
        - uid
        - connectors
    ConnectorView:
      type: object
      properties:
        type:
          type: string
          description: Connector type (e.g. CCS, TYPE2)
        maxPowerW:
          type: integer
          description: Maximum power in watts (positive)
      required:
        - type
        - maxPowerW
    TariffView:
      type: object
      properties:
        currency:
          type: string
          minLength: 3
          maxLength: 3
          description: ISO 4217 currency code
        components:
          type: array
          description: Price components of this tariff version
          items:
            $ref: '#/components/schemas/ComponentView'
      required:
        - currency
        - components
    ComponentView:
      type: object
      properties:
        kind:
          type: string
          description: Component kind (e.g. ENERGY_PER_KWH, OCCUPANCY_PER_MINUTE)
        unit:
          type: string
          description: Unit the amount applies to (e.g. KWH, MINUTE)
        amountMinor:
          type: integer
          description: Amount in minor currency units
      required:
        - kind
        - unit
        - amountMinor
    StationAvailability:
      type: object
      properties:
        stationRef:
          type: string
        status:
          type: string
          enum:
            - available
            - busy
            - offline
            - limited
        availableEvses:
          type: integer
        totalEvses:
          type: integer
        nextAvailableSlot:
          type: string
          format: date-time
      required:
        - stationRef
        - status
        - availableEvses
        - totalEvses
security:
  - apiKey: []
  - anonymous: []
