# =============================================================================
# Traceability Registry v1
# =============================================================================
# Maps every W1 requirement from REQ-001 (Functional Requirements and
# Traceability v1.1, APPROVED) to its provisional owner, logical interface,
# security rules and implementation epic.
#
# Scope: all REQ-001 requirements whose target wave is W1-S1 or W1-S2
# (both sub-waves form release wave W1).  W2 and W3 requirements are
# intentionally absent until their waves are baselined.
#
# Field rules:
# - requirementId uses REQ-001's exact stable IDs.
# - applicability preserves REQ-001's per-requirement wave tag (W1-S1/W1-S2).
# - owningService maps REQ-001's provisional logical owner onto the seven
#   canonical services (ARC-BND-01..15); logical ownership remains
#   provisional until final boundaries are approved.
# - apis carry the logical interface operations from the REQ-001 forward
#   traceability matrix; they are NOT final REST endpoints.
# - messages reference only W1-set messages that are clearly the
#   requirement's own events (see registries/messages-v1.yaml).
# - tests/dbTables stay empty: REQ-001 defers exact test IDs and table
#   ownership to later planning phases (REQ-001 section 9 and 11).
# - status is PLANNED for every row: implementation has not started and no
#   requirement may be VERIFIED without CI verification evidence (CON-176).
# =============================================================================

schemaVersion: "1.0"

release_waves:
  W1: "W1 — Foundation (W1-S1 + W1-S2)"
  W2: "W2 — Operations"
  W3: "W3 — Optimisation"

