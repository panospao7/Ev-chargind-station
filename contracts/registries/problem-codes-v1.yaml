# =============================================================================
# Problem Codes Registry v1
# =============================================================================
# Canonical RFC 9457 problem-code registry for the EV charging platform.
#
# Sources (authoritative precedence):
#   - ARC-022 §16  (docs/05_architecture/16_w1_persistence_and_contract_finalization_v1.0.md)
#     — canonical 22 problem codes and their HTTP statuses (one HTTP meaning each).
#   - ARC-018 §7   (docs/05_architecture/12_contract_governance_and_decisions_v1.0.md)
#     — shared problem-code registry (Release applicability: W1 | Cross-cutting);
#       supplies additional shared codes and the retryable column.
#   - ARC-003 §14  (docs/05_architecture/03_rest_api_contract_catalogue_v1.0.md)
#     — stable shared problem codes (basis for the two booking-window codes kept
#       from the previous registry).
#   - Existing registry detailTemplate / applicableOperations text is reused
#     where the same code already existed.
# =============================================================================

schemaVersion: "1.0"

release_waves:
  W1: "W1 — Foundation (MVP)"
  W2: "W2 — Operations & Observability"

problemCodes:

  # ──────────────────────────────────────────────────────────────────────────
  # Concurrency / Precondition Errors (ARC-022 §16; ARC-018 §7)
  # ──────────────────────────────────────────────────────────────────────────

  - code: VERSION_CONFLICT
    httpStatus: 412
    retryable: true
    title: Version conflict
    detailTemplate: "The resource has been modified by another request. Expected version {expectedVersion}, actual version {actualVersion}."
    parameters: [expectedVersion, actualVersion]
    applicableOperations:
      - POST /bookings/{bookingId}/confirm
      - POST /bookings/{bookingId}/cancel
      - POST /capacity-restrictions/{id}/freeze
      - PATCH /charging-sessions/{sessionId}
    releaseWave: W1

  - code: PRECONDITION_REQUIRED
    httpStatus: 428
    retryable: false
    title: Precondition required
    detailTemplate: "This operation requires a precondition header. Provide If-Match with the current version of {entityType} {entityId}."
    parameters: [entityType, entityId]
    applicableOperations: []
    releaseWave: W1

  # ──────────────────────────────────────────────────────────────────────────
  # Idempotency Errors
  # ──────────────────────────────────────────────────────────────────────────

  - code: IDEMPOTENCY_KEY_REUSED
    httpStatus: 409
    retryable: false
    title: Idempotency key reused with different request
    detailTemplate: "Idempotency key {idempotencyKey} was already used for a different request payload on {originalTimestamp}."
    parameters: [idempotencyKey, originalTimestamp]
    applicableOperations:
      - POST /bookings
      - POST /bookings/{bookingId}/confirm
      - POST /charging-sessions
      - POST /capacity-restrictions
    releaseWave: W1

  # ──────────────────────────────────────────────────────────────────────────
  # Allocation / Capacity Errors
  # ──────────────────────────────────────────────────────────────────────────

  - code: EVSE_ALLOCATION_CONFLICT
    httpStatus: 409
    retryable: false
    title: EVSE allocation conflict
    detailTemplate: "EVSE {evseId} is already allocated to another booking or session. Current status: {evseStatus}."
    parameters: [evseId, evseStatus]
    applicableOperations:
      - POST /bookings
      - POST /bookings/{bookingId}/check-in
    releaseWave: W1

  - code: ALLOCATION_BUSY
    httpStatus: 409
    retryable: true
    title: Allocation system busy
    detailTemplate: "The allocation system is temporarily unavailable. Please retry."
    parameters: []
    applicableOperations:
      - POST /bookings
    releaseWave: W1

  - code: NO_COMPATIBLE_EVSE
    httpStatus: 422
    retryable: false
    title: No compatible EVSE available
    detailTemplate: "No EVSE at station {stationId} is compatible with connector type {connectorType} in the requested time window."
    parameters: [stationId, connectorType]
    applicableOperations:
      - POST /bookings
    releaseWave: W1

  - code: INVALID_INTERVAL
    httpStatus: 422
    retryable: false
    title: Invalid interval
    detailTemplate: "The provided interval {start}–{end} is invalid. Duration must be between {minDuration} and {maxDuration}."
    parameters: [start, end, minDuration, maxDuration]
    applicableOperations:
      - POST /bookings
      - POST /bookings/{bookingId}/reschedule
    releaseWave: W1

  # ──────────────────────────────────────────────────────────────────────────
  # Booking / Hold / Check-in Errors
  # ──────────────────────────────────────────────────────────────────────────

  - code: BOOKING_HOLD_EXPIRED
    httpStatus: 409
    retryable: false
    title: Booking hold expired
    detailTemplate: "The temporary hold on booking {bookingId} has expired. A new booking must be created."
    parameters: [bookingId]
    applicableOperations:
      - POST /bookings/{bookingId}/confirm
    releaseWave: W1

  - code: BOOKING_STATE_CONFLICT
    httpStatus: 409
    retryable: false
    title: Booking state conflict
    detailTemplate: "Booking {bookingId} is in state {currentState} and cannot perform operation {operation}."
    parameters: [bookingId, currentState, operation]
    applicableOperations:
      - POST /bookings/{bookingId}/confirm
      - POST /bookings/{bookingId}/cancel
      - POST /bookings/{bookingId}/check-in
      - POST /bookings/{bookingId}/reschedule
    releaseWave: W1

  - code: CHECK_IN_WINDOW_CLOSED
    httpStatus: 409
    retryable: false
    title: Check-in window closed
    detailTemplate: "The check-in window for booking {bookingId} closed at {windowEnd}. It is now {currentTime}."
    parameters: [bookingId, windowEnd, currentTime]
    applicableOperations:
      - POST /bookings/{bookingId}/check-in
    releaseWave: W1

  - code: WRONG_EVSE
    httpStatus: 409
    retryable: false
    title: Wrong EVSE
    detailTemplate: "Driver is at EVSE {reportedEvseId}, but booking {bookingId} is assigned to EVSE {assignedEvseId}."
    parameters: [reportedEvseId, assignedEvseId, bookingId]
    applicableOperations:
      - POST /bookings/{bookingId}/check-in
    releaseWave: W1

  - code: OUTSIDE_ADVANCE_WINDOW
    httpStatus: 422
    retryable: false
    title: Outside advance booking window
    detailTemplate: "The requested start time {requestedStart} is outside the booking window. Bookings open {windowOpens} before the slot."
    parameters: [requestedStart, windowOpens]
    applicableOperations:
      - POST /bookings
    releaseWave: W1

  - code: OUTSIDE_OPENING_HOURS
    httpStatus: 422
    retryable: false
    title: Outside station opening hours
    detailTemplate: "Station {stationId} is closed at {requestedTime}. Opening hours: {openingHours}."
    parameters: [stationId, requestedTime, openingHours]
    applicableOperations:
      - POST /bookings
    releaseWave: W1

  # ──────────────────────────────────────────────────────────────────────────
  # Device / Telemetry Availability Errors
  # ──────────────────────────────────────────────────────────────────────────

  - code: EVSE_STALE_TELEMETRY
    httpStatus: 503
    retryable: true
    title: EVSE telemetry is stale
    detailTemplate: "EVSE {evseId} last reported {duration} ago. Current capacity cannot be determined."
    parameters: [evseId, duration]
    applicableOperations:
      - POST /bookings
      - GET /stations/{stationId}/availability
    releaseWave: W1

  - code: EVSE_OFFLINE
    httpStatus: 503
    retryable: false
    title: EVSE is offline
    detailTemplate: "EVSE {evseId} is currently offline. Last seen {lastSeen}."
    parameters: [evseId, lastSeen]
    applicableOperations:
      - POST /bookings
      - POST /charging-sessions/{sessionId}/start
    releaseWave: W1

  - code: STATUS_UNKNOWN
    httpStatus: 503
    retryable: true
    title: EVSE status unknown
    detailTemplate: "The operational status of EVSE {evseId} cannot be determined at this time."
    parameters: [evseId]
    applicableOperations:
      - POST /bookings/{bookingId}/check-in
      - POST /charging-sessions/{sessionId}/start
    releaseWave: W1

  # ──────────────────────────────────────────────────────────────────────────
  # Maintenance / Capacity Restriction Errors
  # ──────────────────────────────────────────────────────────────────────────

  - code: MAINTENANCE_CONFLICT
    httpStatus: 409
    retryable: false
    title: Maintenance window conflict
    detailTemplate: "The requested time window overlaps with scheduled maintenance for EVSE(s): {evseIds}."
    parameters: [evseIds]
    applicableOperations:
      - POST /bookings
      - POST /maintenance
    releaseWave: W1

  - code: MAINTENANCE_STATE_CONFLICT
    httpStatus: 409
    retryable: false
    title: Maintenance state conflict
    detailTemplate: "Maintenance record {maintenanceId} is in state {currentState} and cannot be {operation}."
    parameters: [maintenanceId, currentState, operation]
    applicableOperations:
      - POST /maintenance/{id}/complete
      - POST /maintenance/{id}/cancel
    releaseWave: W1

  - code: MAINTENANCE_IMPACT_UNRESOLVED
    httpStatus: 409
    retryable: false
    title: Maintenance impact unresolved
    detailTemplate: "Maintenance {maintenanceId} has active bookings that must be handled before proceeding. Count: {activeBookingCount}."
    parameters: [maintenanceId, activeBookingCount]
    applicableOperations:
      - POST /maintenance/{id}/schedule
      - POST /maintenance/{id}/complete
    releaseWave: W1

  - code: CAPACITY_RESTRICTION_STATE_CONFLICT
    httpStatus: 409
    retryable: false
    title: Capacity restriction state conflict
    detailTemplate: "Capacity restriction {restrictionId} is in state {currentState} and cannot be {operation}."
    parameters: [restrictionId, currentState, operation]
    applicableOperations:
      - POST /capacity-restrictions/{id}/freeze
      - POST /capacity-restrictions/{id}/block
      - POST /capacity-restrictions/{id}/release
    releaseWave: W1

  - code: SAFETY_EVIDENCE_REQUIRED
    httpStatus: 422
    retryable: false
    title: Safety evidence required
    detailTemplate: "Operation {operation} requires safety evidence. Provide {missingEvidence}."
    parameters: [operation, missingEvidence]
    applicableOperations:
      - POST /capacity-restrictions/{id}/release
      - POST /charging-sessions/{sessionId}/emergency-stop
    releaseWave: W1

  # ──────────────────────────────────────────────────────────────────────────
  # Charging Session / Start Authorization Errors
  # ──────────────────────────────────────────────────────────────────────────

  - code: SESSION_STATE_CONFLICT
    httpStatus: 409
    retryable: false
    title: Charging session state conflict
    detailTemplate: "Charging session {sessionRef} is in state {currentState} and cannot perform operation {operation}."
    parameters: [sessionRef, currentState, operation]
    applicableOperations: []
    releaseWave: W1

  - code: SESSION_OUTCOME_UNRESOLVED
    httpStatus: 409
    retryable: false
    title: Session outcome unresolved
    detailTemplate: "Charging session {sessionId} has no confirmed outcome. Retry after reconciling with the EVSE."
    parameters: [sessionId]
    applicableOperations:
      - POST /charging-sessions/{sessionId}/stop
      - POST /charging-sessions/{sessionId}/reconcile
    releaseWave: W1

  - code: START_AUTHORIZATION_EXPIRED
    httpStatus: 409
    retryable: false
    title: Start authorization expired
    detailTemplate: "Start authorization {authorizationId} expired at {expiredAt}. A new authorization must be obtained."
    parameters: [authorizationId, expiredAt]
    applicableOperations:
      - POST /charging-sessions/{sessionId}/start
    releaseWave: W1

  - code: START_AUTHORIZATION_INVALID
    httpStatus: 403
    retryable: false
    title: Start authorization invalid
    detailTemplate: "Start authorization {authorizationId} is not valid for EVSE {evseId}."
    parameters: [authorizationId, evseId]
    applicableOperations:
      - POST /charging-sessions/{sessionId}/start
    releaseWave: W1

  - code: START_AUTHORIZATION_CONSUMED
    httpStatus: 409
    retryable: false
    title: Start authorization already consumed
    detailTemplate: "Start authorization {authorizationId} was already consumed at {consumedAt}."
    parameters: [authorizationId, consumedAt]
    applicableOperations:
      - POST /charging-sessions/{sessionId}/start
    releaseWave: W1

  - code: START_ATTEMPT_LIMIT_REACHED
    httpStatus: 409
    retryable: false
    title: Start attempt limit reached
    detailTemplate: "Maximum start attempts ({maxAttempts}) reached for this authorization. Obtain a new authorization."
    parameters: [maxAttempts]
    applicableOperations:
      - POST /charging-sessions/{sessionId}/start
    releaseWave: W1

  - code: START_RETRY_NOT_ELIGIBLE
    httpStatus: 409
    retryable: false
    title: Start retry not eligible
    detailTemplate: "Authorization {authorizationId} is not eligible for retry. Reason: {reason}."
    parameters: [authorizationId, reason]
    applicableOperations:
      - POST /charging-sessions/{sessionId}/start/retry
    releaseWave: W1

  # ──────────────────────────────────────────────────────────────────────────
  # Authentication / Dependency Errors (ARC-018 §7 additional shared codes)
  # ──────────────────────────────────────────────────────────────────────────

  - code: INVALID_CREDENTIALS
    httpStatus: 401
    retryable: false
    title: Invalid credentials
    detailTemplate: "The provided credentials are invalid or expired."
    parameters: []
    applicableOperations:
      - POST /auth/login
      - POST /auth/refresh
    releaseWave: W1

  - code: DEPENDENCY_UNAVAILABLE
    httpStatus: 503
    retryable: true
    title: Downstream dependency unavailable
    detailTemplate: "The operation cannot be completed because {dependency} is unreachable."
    parameters: [dependency]
    applicableOperations:
      - POST /bookings
      - POST /charging-sessions
      - POST /capacity-restrictions
    releaseWave: W1

  # ──────────────────────────────────────────────────────────────────────────
  # General Errors (ARC-003 §14)
  # ──────────────────────────────────────────────────────────────────────────

  # ARC-003 §14 initial shared General code; registry was incomplete relative
  # to its source (owner-approved scope extension, I1-DSC-001, 2026-09-12).
  - code: RESOURCE_NOT_FOUND
    httpStatus: 404
    retryable: false
    title: Resource not found
    detailTemplate: "The requested {resource} does not exist."
    parameters: [resource]
    applicableOperations:
      - GET /api/v1/stations/{stationRef}
    releaseWave: W1

# =============================================================================
# End of Problem Codes Registry
# =============================================================================
