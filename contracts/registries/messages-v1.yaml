# =============================================================================
# Message Registry v1 — com.evplatform W1 message catalogue
# =============================================================================
# Authoritative scope: ARC-016 §15 (W1 message set) and ARC-020 §6/§7/§8/§9
# (event catalogue, command metadata, subscription matrix, payload rules).
# Every schema target lives under contracts/schemas/ as standalone
# JSON Schema 2020-12 documents (compatibility-safe subset).
# =============================================================================

schemaVersion: "1.0"

release_waves:
  W1: "W1 — Foundation (MVP)"
  W2: "W2 — Operations & Observability"
  W3: "W3 — Ecosystem & Optimisation"

x-data-classification: public

# ── Exchange aliases (ARC-020 §3 durable exchanges) ────────────────────────
ex:
  domain:         &ex-domain         "ev.domain.v1"
  device-command: &ex-device-command "ev.device.command.v1"
  device-result:  &ex-device-result  "ev.device.result.v1"
  device-telemetry: &ex-device-telemetry "ev.device.telemetry.v1"
  command:        &ex-command        "com.evplatform.command"

messages:

  # ────────────────────────────────────────────────────────────────────────
  # Booking events (Booking and Session Service)
  # ────────────────────────────────────────────────────────────────────────

  - name: BookingHeld
    kind: EVENT
    versionedType: com.evplatform.booking.held.v1
    producer: booking-session-service
    consumers: [notification-service]
    releaseWave: W1
    exchange: *ex-domain
    routingKey: booking.held
    schemaPath: events/booking-held-event.json
    classification: BUSINESS
    aggregateType: Booking
    description: "Hold placed. Carries a pseudonymous driver reference and is not routed to Discovery."

  - name: BookingConfirmed
    kind: EVENT
    versionedType: com.evplatform.booking.confirmed.v1
    producer: booking-session-service
    consumers: [notification-service]
    releaseWave: W1
    exchange: *ex-domain
    routingKey: booking.confirmed
    schemaPath: events/booking-confirmed-event.json
    classification: BUSINESS
    aggregateType: Booking
    description: "Booking confirmed with assignment and snapshots. Not routed to Discovery."

  - name: BookingHoldExpired
    kind: EVENT
    versionedType: com.evplatform.booking.hold-expired.v1
    producer: booking-session-service
    consumers: [notification-service]
    releaseWave: W1
    exchange: *ex-domain
    routingKey: booking.hold-expired
    schemaPath: events/booking-hold-expired-event.json
    classification: BUSINESS
    aggregateType: Booking
    description: "Hold expired and capacity released. Not routed to Discovery."

  - name: BookingCancelled
    kind: EVENT
    versionedType: com.evplatform.booking.cancelled.v1
    producer: booking-session-service
    consumers: [notification-service]
    releaseWave: W1
    exchange: *ex-domain
    routingKey: booking.cancelled
    schemaPath: events/booking-cancelled-event.json
    classification: BUSINESS
    aggregateType: Booking

  - name: BookingCheckedIn
    kind: EVENT
    versionedType: com.evplatform.booking.checked-in.v1
    producer: booking-session-service
    consumers: [notification-service]
    releaseWave: W1
    exchange: *ex-domain
    routingKey: booking.checked-in
    schemaPath: events/booking-checked-in-event.json
    classification: BUSINESS
    aggregateType: Booking

  - name: BookingCheckInAbandoned
    kind: EVENT
    versionedType: com.evplatform.booking.check-in-abandoned.v1
    producer: booking-session-service
    consumers: [notification-service]
    releaseWave: W1
    exchange: *ex-domain
    routingKey: booking.check-in-abandoned
    schemaPath: events/booking-check-in-abandoned-event.json
    classification: BUSINESS
    aggregateType: Booking

  - name: BookingActivated
    kind: EVENT
    versionedType: com.evplatform.booking.activated.v1
    producer: booking-session-service
    consumers: [notification-service]
    releaseWave: W1
    exchange: *ex-domain
    routingKey: booking.activated
    schemaPath: events/booking-activated-event.json
    classification: BUSINESS
    aggregateType: Booking

  - name: BookingCompleted
    kind: EVENT
    versionedType: com.evplatform.booking.completed.v1
    producer: booking-session-service
    consumers: [notification-service]
    releaseWave: W1
    exchange: *ex-domain
    routingKey: booking.completed
    schemaPath: events/booking-completed-event.json
    classification: BUSINESS
    aggregateType: Booking

  - name: BookingNoShow
    kind: EVENT
    versionedType: com.evplatform.booking.no-show.v1
    producer: booking-session-service
    consumers: [notification-service]
    releaseWave: W1
    exchange: *ex-domain
    routingKey: booking.no-show
    schemaPath: events/booking-no-show-event.json
    classification: BUSINESS
    aggregateType: Booking

  - name: BookingFulfilmentFailed
    kind: EVENT
    versionedType: com.evplatform.booking.fulfilment-failed.v1
    producer: booking-session-service
    consumers: [notification-service]
    releaseWave: W1
    exchange: *ex-domain
    routingKey: booking.fulfilment-failed
    schemaPath: events/booking-fulfilment-failed-event.json
    classification: BUSINESS
    aggregateType: Booking

  # ────────────────────────────────────────────────────────────────────────
  # Charging session events (Booking and Session Service, charging module)
  # ────────────────────────────────────────────────────────────────────────

  - name: ChargingSessionStarted
    kind: EVENT
    versionedType: com.evplatform.charging.session-started.v1
    producer: booking-session-service
    consumers: [notification-service]
    releaseWave: W1
    exchange: *ex-domain
    routingKey: charging.session-started
    schemaPath: events/charging-session-started-event.json
    classification: BUSINESS
    aggregateType: ChargingSession
    description: "Charging session started. Device command acceptance does not prove physical charging."

  - name: ChargingSessionProgressed
    kind: EVENT
    versionedType: com.evplatform.charging.session-progressed.v1
    producer: booking-session-service
    consumers: [notification-service, discovery-insights-service]
    releaseWave: W1
    exchange: *ex-domain
    routingKey: charging.session-progressed
    schemaPath: events/charging-session-progressed-event.json
    classification: BUSINESS
    aggregateType: ChargingSession
    description: "Throttled progress for UI and analytics. Raw meter readings remain in Charging storage and the telemetry stream."

  - name: ChargingSessionCompleted
    kind: EVENT
    versionedType: com.evplatform.charging.session-completed.v1
    producer: booking-session-service
    consumers: [notification-service]
    releaseWave: W1
    exchange: *ex-domain
    routingKey: charging.session-completed
    schemaPath: events/charging-session-completed-event.json
    classification: BUSINESS
    aggregateType: ChargingSession

  - name: ChargingSessionInterrupted
    kind: EVENT
    versionedType: com.evplatform.charging.session-interrupted.v1
    producer: booking-session-service
    consumers: [notification-service]
    releaseWave: W1
    exchange: *ex-domain
    routingKey: charging.session-interrupted
    schemaPath: events/charging-session-interrupted-event.json
    classification: BUSINESS
    aggregateType: ChargingSession

  - name: ChargingStartRejected
    kind: EVENT
    versionedType: com.evplatform.charging.start-rejected.v1
    producer: booking-session-service
    consumers: [notification-service]
    releaseWave: W1
    exchange: *ex-domain
    routingKey: charging.start-rejected
    schemaPath: events/charging-start-rejected-event.json
    classification: BUSINESS
    aggregateType: ChargingSession
    description: "Final start exhaustion. Booking moves to FULFILMENT_FAILED."

  - name: ChargingOutcomeUnresolved
    kind: EVENT
    versionedType: com.evplatform.charging.outcome-unresolved.v1
    producer: booking-session-service
    consumers: [notification-service, governance-support-service]
    releaseWave: W1
    exchange: *ex-domain
    routingKey: charging.outcome-unresolved
    schemaPath: events/charging-outcome-unresolved-event.json
    classification: BUSINESS
    aggregateType: ChargingSession
    description: "Ambiguous physical outcome. Remains uncertain until reconciled."

  # ────────────────────────────────────────────────────────────────────────
  # Capacity projection events (Booking and Session Service, Discovery only)
  # ────────────────────────────────────────────────────────────────────────

  - name: EVSECapacityChanged
    kind: EVENT
    versionedType: com.evplatform.capacity.evse-capacity-changed.v1
    producer: booking-session-service
    consumers: [discovery-insights-service]
    releaseWave: W1
    exchange: *ex-domain
    routingKey: capacity.evse-capacity-changed
    schemaPath: events/evse-capacity-changed-event.json
    classification: BUSINESS
    aggregateType: EVSE
    description: "Booking-owned capacity projection. Contains no account, driver, or vehicle identifiers. Consumer is discovery-insights-service only."

  - name: StationBookableCountChanged
    kind: EVENT
    versionedType: com.evplatform.capacity.station-bookable-count-changed.v1
    producer: booking-session-service
    consumers: [discovery-insights-service]
    releaseWave: W1
    exchange: *ex-domain
    routingKey: capacity.station-bookable-count-changed
    schemaPath: events/station-bookable-count-changed-event.json
    classification: BUSINESS
    aggregateType: Station
    description: "Booking-owned capacity projection. Contains no account, driver, or vehicle identifiers. Consumer is discovery-insights-service only."

  - name: AvailabilityProjectionInvalidated
    kind: EVENT
    versionedType: com.evplatform.capacity.availability-projection-invalidated.v1
    producer: booking-session-service
    consumers: [discovery-insights-service]
    releaseWave: W1
    exchange: *ex-domain
    routingKey: capacity.availability-projection-invalidated
    schemaPath: events/availability-projection-invalidated-event.json
    classification: BUSINESS
    aggregateType: Station
    description: "Booking-owned capacity projection invalidation. Contains no account, driver, or vehicle identifiers. Consumer is discovery-insights-service only."

  # ────────────────────────────────────────────────────────────────────────
  # Restriction outcome events (Booking and Session Service)
  # ────────────────────────────────────────────────────────────────────────

  - name: CapacityFreezeCommitted
    kind: EVENT
    versionedType: com.evplatform.capacity.freeze-committed.v1
    producer: booking-session-service
    consumers: [station-operations-service]
    releaseWave: W1
    exchange: *ex-domain
    routingKey: capacity.freeze-committed
    schemaPath: events/capacity-freeze-committed-event.json
    classification: BUSINESS
    aggregateType: CapacityRestriction

  - name: CapacityFreezeRejected
    kind: EVENT
    versionedType: com.evplatform.capacity.freeze-rejected.v1
    producer: booking-session-service
    consumers: [station-operations-service]
    releaseWave: W1
    exchange: *ex-domain
    routingKey: capacity.freeze-rejected
    schemaPath: events/capacity-freeze-rejected-event.json
    classification: BUSINESS
    aggregateType: CapacityRestriction

  - name: CapacityBlockCommitted
    kind: EVENT
    versionedType: com.evplatform.capacity.block-committed.v1
    producer: booking-session-service
    consumers: [station-operations-service]
    releaseWave: W1
    exchange: *ex-domain
    routingKey: capacity.block-committed
    schemaPath: events/capacity-block-committed-event.json
    classification: BUSINESS
    aggregateType: CapacityRestriction

  - name: CapacityBlockRejected
    kind: EVENT
    versionedType: com.evplatform.capacity.block-rejected.v1
    producer: booking-session-service
    consumers: [station-operations-service]
    releaseWave: W1
    exchange: *ex-domain
    routingKey: capacity.block-rejected
    schemaPath: events/capacity-block-rejected-event.json
    classification: BUSINESS
    aggregateType: CapacityRestriction

  - name: CapacityRestrictionReleased
    kind: EVENT
    versionedType: com.evplatform.capacity.restriction-released.v1
    producer: booking-session-service
    consumers: [station-operations-service]
    releaseWave: W1
    exchange: *ex-domain
    routingKey: capacity.restriction-released
    schemaPath: events/capacity-restriction-released-event.json
    classification: BUSINESS
    aggregateType: CapacityRestriction

  - name: CapacityRestrictionReleaseRejected
    kind: EVENT
    versionedType: com.evplatform.capacity.restriction-release-rejected.v1
    producer: booking-session-service
    consumers: [station-operations-service]
    releaseWave: W1
    exchange: *ex-domain
    routingKey: capacity.restriction-release-rejected
    schemaPath: events/capacity-restriction-release-rejected-event.json
    classification: BUSINESS
    aggregateType: CapacityRestriction

  # ────────────────────────────────────────────────────────────────────────
  # Device facts (Device Integration Service)
  # ────────────────────────────────────────────────────────────────────────

  - name: DeviceCommandResult
    kind: EVENT
    versionedType: com.evplatform.device.command-result.v1
    producer: device-integration-service
    consumers: [booking-session-service, station-operations-service]
    releaseWave: W1
    exchange: *ex-device-result
    routingKey: device.command-result
    schemaPath: events/device-command-result-event.json
    classification: TECHNICAL
    aggregateType: DeviceCommand
    description: "Normalized device command result. Command acceptance does not prove physical charging."

  - name: DeviceTransactionStarted
    kind: EVENT
    versionedType: com.evplatform.device.transaction-started.v1
    producer: device-integration-service
    consumers: [booking-session-service, discovery-insights-service]
    releaseWave: W1
    exchange: *ex-device-result
    routingKey: device.transaction-started
    schemaPath: events/device-transaction-started-event.json
    classification: TECHNICAL
    aggregateType: DeviceTransaction

  - name: DeviceTransactionProgressed
    kind: EVENT
    versionedType: com.evplatform.device.transaction-progressed.v1
    producer: device-integration-service
    consumers: [booking-session-service, discovery-insights-service]
    releaseWave: W1
    exchange: *ex-device-result
    routingKey: device.transaction-progressed
    schemaPath: events/device-transaction-progressed-event.json
    classification: TECHNICAL
    aggregateType: DeviceTransaction

  - name: DeviceTransactionEnded
    kind: EVENT
    versionedType: com.evplatform.device.transaction-ended.v1
    producer: device-integration-service
    consumers: [booking-session-service, discovery-insights-service]
    releaseWave: W1
    exchange: *ex-device-result
    routingKey: device.transaction-ended
    schemaPath: events/device-transaction-ended-event.json
    classification: TECHNICAL
    aggregateType: DeviceTransaction

  - name: DeviceHeartbeatReceived
    kind: EVENT
    versionedType: com.evplatform.device.heartbeat-received.v1
    producer: device-integration-service
    consumers: [station-operations-service]
    releaseWave: W1
    exchange: *ex-device-telemetry
    routingKey: device.heartbeat-received
    schemaPath: events/device-heartbeat-received-event.json
    classification: TECHNICAL
    aggregateType: Device

  - name: DeviceHeartbeatStale
    kind: EVENT
    versionedType: com.evplatform.device.heartbeat-stale.v1
    producer: device-integration-service
    consumers: [station-operations-service, booking-session-service]
    releaseWave: W1
    exchange: *ex-device-telemetry
    routingKey: device.heartbeat-stale
    schemaPath: events/device-heartbeat-stale-event.json
    classification: TECHNICAL
    aggregateType: Device

  - name: DeviceFaultRaised
    kind: EVENT
    versionedType: com.evplatform.device.fault-raised.v1
    producer: device-integration-service
    consumers: [station-operations-service, booking-session-service]
    releaseWave: W1
    exchange: *ex-device-telemetry
    routingKey: device.fault-raised
    schemaPath: events/device-fault-raised-event.json
    classification: TECHNICAL
    aggregateType: Device
    description: "Normalized device fault. Contains no device credentials or internal diagnostics."

  # ────────────────────────────────────────────────────────────────────────
  # Commands
  # ────────────────────────────────────────────────────────────────────────

  - name: StartChargingAtEVSE
    kind: COMMAND
    command: true
    handler: device-integration-service
    versionedType: com.evplatform.device.start-charging-at-evse.v1
    producer: booking-session-service
    consumers: [device-integration-service]
    releaseWave: W1
    exchange: *ex-device-command
    routingKey: device.command.start-charging
    schemaPath: commands/start-charging-command.json
    classification: BUSINESS
    aggregateType: ChargingSession
    timeoutMs: 30000
    outcomeMessages: [DeviceCommandResult, ChargingSessionStarted, ChargingStartRejected, ChargingOutcomeUnresolved]
    description: "Idempotent by command ID. Accepted, rejected, timed-out, and unresolved outcomes are defined. Acceptance does not prove physical charging."

  - name: StopChargingAtEVSE
    kind: COMMAND
    command: true
    handler: device-integration-service
    versionedType: com.evplatform.device.stop-charging-at-evse.v1
    producer: booking-session-service
    consumers: [device-integration-service]
    releaseWave: W1
    exchange: *ex-device-command
    routingKey: device.command.stop-charging
    schemaPath: commands/stop-charging-command.json
    classification: BUSINESS
    aggregateType: ChargingSession
    timeoutMs: 30000
    outcomeMessages: [DeviceCommandResult, ChargingSessionCompleted, ChargingSessionInterrupted, ChargingOutcomeUnresolved]
    description: "Idempotent by command ID. Accepted, rejected, timed-out, and unresolved outcomes are defined."

  - name: RequestDeviceSnapshot
    kind: COMMAND
    command: true
    handler: device-integration-service
    versionedType: com.evplatform.device.request-device-snapshot.v1
    producer: station-operations-service
    consumers: [device-integration-service]
    releaseWave: W1
    exchange: *ex-device-command
    routingKey: device.command.request-snapshot
    schemaPath: commands/request-device-snapshot-command.json
    classification: BUSINESS
    aggregateType: Device
    timeoutMs: 15000
    outcomeMessages: [DeviceCommandResult]
    description: "Idempotent by command ID. Snapshot results arrive as normalized device facts."

  - name: CreateCapacityFreeze
    kind: COMMAND
    command: true
    handler: booking-session-service
    versionedType: com.evplatform.capacity.create-capacity-freeze.v1
    producer: station-operations-service
    consumers: [booking-session-service]
    releaseWave: W1
    exchange: *ex-command
    routingKey: command.capacity.create-freeze
    schemaPath: commands/create-capacity-freeze-command.json
    classification: BUSINESS
    aggregateType: CapacityRestriction
    timeoutMs: 30000
    outcomeMessages: [CapacityFreezeCommitted, CapacityFreezeRejected]
    description: "Idempotency key required. Booking allocation is authoritative for freeze commitment."

  - name: FinalizeCapacityBlock
    kind: COMMAND
    command: true
    handler: booking-session-service
    versionedType: com.evplatform.capacity.finalize-capacity-block.v1
    producer: station-operations-service
    consumers: [booking-session-service]
    releaseWave: W1
    exchange: *ex-command
    routingKey: command.capacity.finalize-block
    schemaPath: commands/finalize-capacity-block-command.json
    classification: BUSINESS
    aggregateType: CapacityRestriction
    timeoutMs: 30000
    outcomeMessages: [CapacityBlockCommitted, CapacityBlockRejected]
    description: "Idempotency key required. Booking allocation is authoritative for block commitment."

  - name: ReleaseCapacityRestriction
    kind: COMMAND
    command: true
    handler: booking-session-service
    versionedType: com.evplatform.capacity.release-capacity-restriction.v1
    producer: station-operations-service
    consumers: [booking-session-service]
    releaseWave: W1
    exchange: *ex-command
    routingKey: command.capacity.release-restriction
    schemaPath: commands/release-capacity-restriction-command.json
    classification: BUSINESS
    aggregateType: CapacityRestriction
    timeoutMs: 30000
    outcomeMessages: [CapacityRestrictionReleased, CapacityRestrictionReleaseRejected]
    description: "Idempotency key required. Booking allocation is authoritative for restriction release."

# =============================================================================
# End of Message Registry
# =============================================================================
