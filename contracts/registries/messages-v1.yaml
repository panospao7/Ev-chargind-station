# =============================================================================
# Message Registry v1 — com.evplatform message catalogue
# =============================================================================
# This file defines every event and command flowing through the EV charging
# platform.  It is the single source of truth for message metadata.
# =============================================================================

release_waves:
  W1: &w1 "W1 — Foundation (MVP)"
  W2: &w2 "W2 — Operations & Observability"
  W3: &w3 "W3 — Ecosystem & Optimisation"

# ── Reusable anchors borrowed from YAML aliases ──────────────────────────
x-defaults:
  correlation: &corr-required
    correlationRequired: true
    correlationIdField: correlationId
  idempotent: &idempotent
    idempotencyRequired: true
    idempotencyKeyField: idempotencyKey
  non-idempotent: &non-idempotent
    idempotencyRequired: false
  retry-default: &retry-default
    retryable: false
    maxRetries: 0
  retry-3: &retry-3
    retryable: true
    maxRetries: 3
    backoff: exponential
  status-active: &active ACTIVE
  status-deprecated: &deprecated DEPRECATED
  status-retired: &retired RETIRED

# ── Exchange aliases ─────────────────────────────────────────────────────
ex:
  domain:  &ex-domain  com.evplatform.domain
  ops:     &ex-ops     com.evplatform.ops
  telemetry: &ex-telemetry com.evplatform.telemetry
  command: &ex-command com.evplatform.command
  notification: &ex-notification com.evplatform.notification

