        quasiTerminal: false
      - name: SUBMITTED
        persistent: true
        terminal: false
        quasiTerminal: false
      - name: UNDER_REVIEW
        persistent: true
        terminal: false
        quasiTerminal: false
      - name: CLARIFICATION_REQUESTED
        persistent: true
        terminal: false
        quasiTerminal: false
      - name: WITHDRAWN
        persistent: true
        terminal: true
        quasiTerminal: false
      - name: APPROVED
        persistent: true
        terminal: true
        quasiTerminal: false
        description: Atomically creates active operator organization and owner membership.
      - name: REJECTED
        persistent: true
        terminal: true
        quasiTerminal: false
    processingPhases: []
    permittedTransitions:
      - from: DRAFT
        to: SUBMITTED
      - from: DRAFT
        to: WITHDRAWN
      - from: SUBMITTED
        to: UNDER_REVIEW
      - from: SUBMITTED
        to: WITHDRAWN
      - from: UNDER_REVIEW
        to: CLARIFICATION_REQUESTED
      - from: CLARIFICATION_REQUESTED
        to: UNDER_REVIEW
      - from: UNDER_REVIEW
        to: APPROVED
      - from: UNDER_REVIEW
        to: REJECTED
      - from: UNDER_REVIEW
        to: WITHDRAWN
      - from: CLARIFICATION_REQUESTED
        to: WITHDRAWN
    guards: []
    integrationFacts: []

  # ── DOM-002 §1.16 ──────────────────────────────────────────────────────────
  - name: OPERATOR_ORGANIZATION
    owningService: station-operations-service
    releaseWave: "W1"
    states:
      - name: ACTIVE
        persistent: true
        terminal: false
        quasiTerminal: false
      - name: SUSPENDED
        persistent: true
        terminal: false
        quasiTerminal: false
        description: Cannot manage stations or take bookings.
      - name: CLOSED
        persistent: true
        terminal: true
        quasiTerminal: false
        description: Permanent retirement; all bookings resolved.
    processingPhases: []
    permittedTransitions:
      - from: ACTIVE
        to: SUSPENDED
      - from: SUSPENDED
        to: ACTIVE
      - from: ACTIVE
        to: CLOSED
      - from: SUSPENDED
        to: CLOSED
    guards: []
    integrationFacts: []

  # ── DOM-002 §1.17 ──────────────────────────────────────────────────────────
  - name: DRIVER_ACCOUNT
    owningService: account-service
    releaseWave: "W1"
    states:
      - name: PENDING_VERIFICATION
        persistent: true
        terminal: false
        quasiTerminal: false
      - name: ACTIVE
        persistent: true
        terminal: false
        quasiTerminal: false
      - name: SUSPENDED
        persistent: true
        terminal: false
        quasiTerminal: false
      - name: DELETION_PENDING
        persistent: true
        terminal: false
        quasiTerminal: false
        description: Cancellation back to ACTIVE is permitted during the 7-day cooling off period.
      - name: DELETED
        persistent: true
        terminal: true
        quasiTerminal: false
    processingPhases: []
    permittedTransitions:
      - from: PENDING_VERIFICATION
        to: ACTIVE
      - from: PENDING_VERIFICATION
        to: DELETED
      - from: ACTIVE
        to: SUSPENDED
      - from: ACTIVE
        to: DELETION_PENDING
      - from: SUSPENDED
        to: ACTIVE
      - from: SUSPENDED
        to: DELETION_PENDING
      - from: DELETION_PENDING
        to: DELETED
      - from: DELETION_PENDING
        to: ACTIVE
    guards: []
    integrationFacts: []

  # ── DOM-002 §1.18 (planning record; Booking-owned FREEZE/BLOCKED/RELEASED
  #    capacity restriction handshake is §2.7, deliberately not a state here) ──
  - name: MAINTENANCE_PLANNING_RECORD
    owningService: station-operations-service
    releaseWave: "W1"
    states:
      - name: DRAFT
        persistent: true
        terminal: false
        quasiTerminal: false
        description: Emergency activation to ACTIVE requires an authorized audit record and immediate EMERGENCY_BLOCK commitment before the state change.
      - name: PROPOSED
        persistent: true
        terminal: false
        quasiTerminal: false
      - name: ENFORCEMENT_PENDING
        persistent: true
        terminal: false
        quasiTerminal: false
        description: Capacity restriction request (FREEZE) submitted to Booking.
      - name: IMPACT_RESOLUTION
        persistent: true
        terminal: false
        quasiTerminal: false
        description: Handling affected overlapping bookings via reassignment/alerts.
      - name: SCHEDULED
        persistent: true
        terminal: false
        quasiTerminal: false
      - name: ACTIVE
        persistent: true
        terminal: false
        quasiTerminal: false
        description: Task in progress; EVSE operational status marked MAINTENANCE.
      - name: COMPLETED
        persistent: true
        terminal: true
        quasiTerminal: false
      - name: CANCELLED
        persistent: true
        terminal: true
        quasiTerminal: false
      - name: FAILED
        persistent: true
        terminal: true
        quasiTerminal: false
    processingPhases: []
    permittedTransitions:
      - from: DRAFT
        to: PROPOSED
      - from: DRAFT
        to: CANCELLED
      - from: DRAFT
        to: ACTIVE
      - from: PROPOSED
        to: ENFORCEMENT_PENDING
      - from: PROPOSED
        to: CANCELLED
      - from: ENFORCEMENT_PENDING
        to: IMPACT_RESOLUTION
      - from: ENFORCEMENT_PENDING
        to: FAILED
      - from: IMPACT_RESOLUTION
        to: SCHEDULED
      - from: IMPACT_RESOLUTION
        to: FAILED
      - from: SCHEDULED
        to: ACTIVE
      - from: SCHEDULED
        to: CANCELLED
      - from: ACTIVE
        to: COMPLETED
      - from: ACTIVE
        to: FAILED
    guards: []
    integrationFacts:
      - MaintenanceProposed
      - MaintenanceScheduled
      - MaintenanceActivated
      - MaintenanceCompleted
      - MaintenanceCancelled
      - MaintenanceFailed

  # ── DOM-002 §1.19 ──────────────────────────────────────────────────────────
  - name: FAULT_INCIDENT
    owningService: station-operations-service
    releaseWave: "W1"
    states:
      - name: OPEN
        persistent: true
        terminal: false
        quasiTerminal: false
        description: Fault detected via simulator telemetry or driver report.
      - name: ACKNOWLEDGED
        persistent: true
        terminal: false
        quasiTerminal: false
      - name: IN_PROGRESS
        persistent: true
        terminal: false
        quasiTerminal: false
      - name: RESOLVED
        persistent: true
        terminal: false
        quasiTerminal: false
        description: Equipment repaired; equipment state returns to UNKNOWN; reopens if the issue reoccurs.
    processingPhases: []
    permittedTransitions:
      - from: OPEN
        to: ACKNOWLEDGED
      - from: ACKNOWLEDGED
        to: IN_PROGRESS
      - from: IN_PROGRESS
        to: ACKNOWLEDGED
      - from: IN_PROGRESS
        to: RESOLVED
      - from: RESOLVED
        to: OPEN
    guards: []
    integrationFacts: []
