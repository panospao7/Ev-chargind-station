# =============================================================================
# Lifecycle State Machine Registry v1
# =============================================================================
# Executable registry of all lifecycle state machines defined in DOM-002
# (docs/03_domain/02_lifecycle_and_invariant_catalogue_v1.0.md), sections
# 1.1-1.19 incl. 1.3a.  Supersedes the prior registry content, which violated
# ARC-022 s16 (legacy combined-service naming, legacy hold states, and a
# forbidden cancellation transition from the in-progress booking state).
# None of those patterns appear in this file.
# =============================================================================

schemaVersion: "1.0"
release_waves:
  W1: "W1 — Foundation (MVP)"
  W2: "W2 — Operations & Observability"
  W3: "W3 — Ecosystem & Optimisation"

lifecycles:

  # ── DOM-002 §1.1 ───────────────────────────────────────────────────────────
  - name: BOOKING
    owningService: booking-session-service
    owningModule: booking
    releaseWave: "W1"
    states:
      - name: HELD
        persistent: true
        terminal: false
        quasiTerminal: false
        description: Temporary exclusive capacity claim; hold times out after 5 minutes.
      - name: CONFIRMED
        persistent: true
        terminal: false
        quasiTerminal: false
      - name: CHECKED_IN
        persistent: true
        terminal: false
        quasiTerminal: false
        description: Persists across start attempts; each retry creates a new SessionAttempt record.
      - name: ACTIVE
        persistent: true
        terminal: false
        quasiTerminal: false
        description: Failures during energy transfer end in COMPLETED with interrupted outcome, never FULFILMENT_FAILED.
      - name: EXPIRED
        persistent: true
        terminal: true
        quasiTerminal: false
      - name: CANCELLED
        persistent: true
        terminal: true
        quasiTerminal: false
      - name: NO_SHOW
        persistent: true
        terminal: true
        quasiTerminal: false
      - name: DRIVER_ABANDONED
        persistent: true
        terminal: true
        quasiTerminal: false
        description: Driver checked in but decided not to charge; cannot be reopened.
      - name: COMPLETED
        persistent: true
        terminal: true
        quasiTerminal: false
      - name: FULFILMENT_FAILED
        persistent: true
        terminal: true
        quasiTerminal: false
    processingPhases: []
    permittedTransitions:
      - from: HELD
        to: CONFIRMED
      - from: HELD
        to: EXPIRED
      - from: HELD
        to: CANCELLED
      - from: CONFIRMED
        to: CHECKED_IN
      - from: CONFIRMED
        to: CANCELLED
      - from: CONFIRMED
        to: NO_SHOW
      - from: CONFIRMED
        to: FULFILMENT_FAILED
      - from: CHECKED_IN
        to: ACTIVE
      - from: CHECKED_IN
        to: CONFIRMED
      - from: CHECKED_IN
        to: CANCELLED
      - from: CHECKED_IN
        to: DRIVER_ABANDONED
      - from: CHECKED_IN
        to: FULFILMENT_FAILED
      - from: ACTIVE
        to: COMPLETED
    guards: []
    integrationFacts: []

  # ── DOM-002 §1.2 ───────────────────────────────────────────────────────────
  - name: SESSION_ATTEMPT
    owningService: booking-session-service
    owningModule: charging
    releaseWave: "W1"
    states:
      - name: AUTHORIZING
        persistent: false
        terminal: false
        quasiTerminal: false
      - name: STARTING
        persistent: true
        terminal: false
        quasiTerminal: false
      - name: DEVICE_ACCEPTED
        persistent: true
        terminal: false
        quasiTerminal: false
        description: Charger acknowledged the command; not proof of energy transfer.
      - name: ATTEMPT_REJECTED
        persistent: true
        terminal: true
        quasiTerminal: false
        description: Charger explicitly rejected the command or authorization was invalid.
      - name: TIMED_OUT
        persistent: true
        terminal: false
        quasiTerminal: false
        description: No response received from device within the timeout period.
      - name: RECONCILING
        persistent: false
        terminal: false
        quasiTerminal: false
      - name: TRANSACTION_STARTED
        persistent: true
        terminal: true
        quasiTerminal: false
        description: Charging physically began (DeviceTransactionStarted received).
      - name: UNRESOLVED_REQUIRES_ACTION
        persistent: true
        terminal: false
        quasiTerminal: true
        description: Quasi-terminal; operational_occupation stays blocking; 24h escalation; authorized manual resolution required.
    processingPhases:
      - AUTHORIZING
      - RECONCILING
    permittedTransitions:
      - from: AUTHORIZING
        to: STARTING
      - from: AUTHORIZING
        to: ATTEMPT_REJECTED
      - from: STARTING
        to: DEVICE_ACCEPTED
      - from: STARTING
        to: ATTEMPT_REJECTED
      - from: STARTING
        to: TIMED_OUT
      - from: DEVICE_ACCEPTED
        to: TRANSACTION_STARTED
      - from: DEVICE_ACCEPTED
        to: TIMED_OUT
      - from: TIMED_OUT
        to: RECONCILING
      - from: RECONCILING
        to: TRANSACTION_STARTED
      - from: RECONCILING
        to: ATTEMPT_REJECTED
      - from: RECONCILING
        to: UNRESOLVED_REQUIRES_ACTION
      - from: UNRESOLVED_REQUIRES_ACTION
        to: TRANSACTION_STARTED
      - from: UNRESOLVED_REQUIRES_ACTION
        to: ATTEMPT_REJECTED
    guards: []
    integrationFacts: []

  # ── DOM-002 §1.3 ───────────────────────────────────────────────────────────
  - name: CHARGING_SESSION
    owningService: booking-session-service
    owningModule: charging
    releaseWave: "W1"
    states:
      - name: STARTING
        persistent: true
        terminal: false
        quasiTerminal: false
        description: Persists across multiple SessionAttempts; may carry uncertain=true until resolved.
      - name: CHARGING
        persistent: true
        terminal: false
        quasiTerminal: false
      - name: SUSPENDED
        persistent: true
        terminal: false
        quasiTerminal: false
      - name: STOPPING
        persistent: true
        terminal: false
        quasiTerminal: false
      - name: FINALIZING
        persistent: false
        terminal: false
        quasiTerminal: false
        description: Internal processing substep recorded for observability; not a persistent blocking state.
      - name: COMPLETED
        persistent: true
        terminal: true
        quasiTerminal: false
      - name: INTERRUPTED
        persistent: true
        terminal: true
        quasiTerminal: false
      - name: START_REJECTED
        persistent: true
        terminal: true
        quasiTerminal: false
        description: All retry attempts exhausted; charging never started.
    processingPhases:
      - FINALIZING
    permittedTransitions:
      - from: STARTING
        to: CHARGING
      - from: STARTING
        to: SUSPENDED
      - from: STARTING
        to: INTERRUPTED
      - from: STARTING
        to: START_REJECTED
      - from: CHARGING
        to: SUSPENDED
      - from: CHARGING
        to: STOPPING
      - from: CHARGING
        to: INTERRUPTED
      - from: SUSPENDED
        to: CHARGING
      - from: SUSPENDED
        to: STOPPING
      - from: SUSPENDED
        to: INTERRUPTED
      - from: STOPPING
        to: FINALIZING
      - from: STOPPING
        to: COMPLETED
      - from: STOPPING
        to: INTERRUPTED
      - from: STOPPING
        to: CHARGING
      - from: STOPPING
        to: SUSPENDED
      - from: FINALIZING
        to: COMPLETED
      - from: FINALIZING
        to: INTERRUPTED
    guards: []
    integrationFacts: []

  # ── DOM-002 §1.3a ──────────────────────────────────────────────────────────
  - name: START_AUTHORIZATION
    owningService: booking-session-service
    owningModule: charging
    releaseWave: "W1"
    states:
      - name: ISSUED
        persistent: true
        terminal: false
        quasiTerminal: false
        description: Token generated upon successful check-in.
      - name: CONSUMED
        persistent: true
        terminal: true
        quasiTerminal: false
        description: Start-intent transaction committed (DOM-002 §1.2a); unrelated to device acceptance.
      - name: EXPIRED
        persistent: true
        terminal: true
        quasiTerminal: false
        description: Check-in grace period ended without session starting.
      - name: REVOKED
        persistent: true
        terminal: true
        quasiTerminal: false
        description: Booking cancelled or check-in abandoned before start.
    processingPhases: []
    permittedTransitions:
      - from: ISSUED
        to: CONSUMED
      - from: ISSUED
        to: EXPIRED
      - from: ISSUED
        to: REVOKED
    guards: []
    integrationFacts: []

  # ── DOM-002 §1.4 ───────────────────────────────────────────────────────────
  - name: STATION
    owningService: station-operations-service
    releaseWave: "W1"
    states:
      - name: DRAFT
        persistent: true
        terminal: false
        quasiTerminal: false
      - name: PUBLISHED
        persistent: true
        terminal: false
        quasiTerminal: false
        description: Visible to drivers, accepting bookings.
      - name: TEMPORARILY_CLOSED
        persistent: true
        terminal: false
        quasiTerminal: false
      - name: DEACTIVATED
        persistent: true
        terminal: false
        quasiTerminal: false
        description: Retired station kept for historical records; reactivation to DRAFT requires full verification.
    processingPhases: []
    permittedTransitions:
      - from: DRAFT
        to: PUBLISHED
      - from: PUBLISHED
        to: TEMPORARILY_CLOSED
      - from: TEMPORARILY_CLOSED
        to: PUBLISHED
      - from: PUBLISHED
        to: DEACTIVATED
      - from: TEMPORARILY_CLOSED
        to: DEACTIVATED
      - from: DEACTIVATED
        to: DRAFT
    guards: []
    integrationFacts: []

  # ── DOM-002 §1.5 ───────────────────────────────────────────────────────────
  - name: EVSE_ADMINISTRATION
    owningService: station-operations-service
    releaseWave: "W1"
    states:
      - name: ACTIVE
        persistent: true
        terminal: false
        quasiTerminal: false
      - name: DISABLED
        persistent: true
        terminal: false
        quasiTerminal: false
      - name: DEACTIVATED
        persistent: true
        terminal: true
        quasiTerminal: false
        description: Retired equipment (replaced or removed).
    processingPhases: []
    permittedTransitions:
      - from: ACTIVE
        to: DISABLED
      - from: DISABLED
        to: ACTIVE
      - from: ACTIVE
        to: DEACTIVATED
      - from: DISABLED
        to: DEACTIVATED
    guards: []
    integrationFacts: []

  # ── DOM-002 §1.6 ───────────────────────────────────────────────────────────
  - name: EVSE_OPERATIONAL_STATUS_OVERRIDE
    owningService: station-operations-service
    releaseWave: "W1"
    states:
      - name: SCHEDULED
        persistent: true
        terminal: false
        quasiTerminal: false
        description: Override created to start at a future date/time.
      - name: ACTIVE
        persistent: true
        terminal: false
        quasiTerminal: false
        description: Override currently active, masking standard telemetry.
      - name: EXPIRED
        persistent: true
        terminal: true
        quasiTerminal: false
        description: Override duration elapsed (automatic cleanup); terminal record.
      - name: REVOKED
        persistent: true
        terminal: true
        quasiTerminal: false
        description: Override manually cancelled or cleared; terminal record.
    processingPhases: []
    permittedTransitions:
      - from: "[*]"
        to: SCHEDULED
      - from: "[*]"
        to: ACTIVE
      - from: SCHEDULED
        to: ACTIVE
      - from: SCHEDULED
        to: REVOKED
      - from: ACTIVE
        to: EXPIRED
      - from: ACTIVE
        to: REVOKED
    guards: []
    integrationFacts: []

  # ── DOM-002 §1.7 ───────────────────────────────────────────────────────────
  - name: MACHINE_IDENTITY
    owningService: device-integration-service
    releaseWave: "W1"
    states:
      - name: PENDING_ENROLLMENT
        persistent: true
        terminal: false
        quasiTerminal: false
      - name: ACTIVE
        persistent: true
        terminal: false
        quasiTerminal: false
      - name: SUSPENDED
        persistent: true
        terminal: false
        quasiTerminal: false
        description: Temporarily blocked due to security or firmware mismatch.
      - name: REVOKED
        persistent: true
        terminal: true
        quasiTerminal: false
        description: Permanently disabled, credentials invalidated.
    processingPhases: []
    permittedTransitions:
      - from: PENDING_ENROLLMENT
        to: ACTIVE
      - from: ACTIVE
        to: SUSPENDED
      - from: SUSPENDED
        to: ACTIVE
      - from: ACTIVE
        to: REVOKED
      - from: SUSPENDED
        to: REVOKED
    guards: []
    integrationFacts: []

  # ── DOM-002 §1.8 (ownership per CON-071) ───────────────────────────────────
  - name: DEVICE_COMMAND
    owningService: device-integration-service
    releaseWave: "W1"
    states:
      - name: RECEIVED
        persistent: true
        terminal: false
        quasiTerminal: false
      - name: DISPATCH_PENDING
        persistent: true
        terminal: false
        quasiTerminal: false
      - name: SENT_TO_DEVICE
        persistent: true
        terminal: false
        quasiTerminal: false
      - name: DEVICE_ACCEPTED
        persistent: true
        terminal: true
        quasiTerminal: false
        description: Charger acknowledged the command; does not prove physical energy transfer.
      - name: DEVICE_REJECTED
        persistent: true
        terminal: true
        quasiTerminal: false
      - name: CANCELLED_BEFORE_DISPATCH
        persistent: true
        terminal: false
        quasiTerminal: false
      - name: TIMED_OUT
        persistent: true
        terminal: false
        quasiTerminal: false
        description: Non-terminal; no response within the timeout window; transitions to RECONCILING.
      - name: RECONCILING
        persistent: false
        terminal: false
        quasiTerminal: false
        description: Non-terminal; waiting for telemetry validation.
    processingPhases:
      - RECONCILING
    permittedTransitions:
      - from: RECEIVED
        to: DISPATCH_PENDING
      - from: RECEIVED
        to: CANCELLED_BEFORE_DISPATCH
      - from: DISPATCH_PENDING
        to: SENT_TO_DEVICE
      - from: DISPATCH_PENDING
        to: CANCELLED_BEFORE_DISPATCH
      - from: SENT_TO_DEVICE
        to: DEVICE_ACCEPTED
      - from: SENT_TO_DEVICE
        to: DEVICE_REJECTED
      - from: SENT_TO_DEVICE
        to: TIMED_OUT
      - from: TIMED_OUT
        to: RECONCILING
      - from: RECONCILING
        to: DEVICE_ACCEPTED
      - from: RECONCILING
        to: DEVICE_REJECTED
    guards: []
    integrationFacts: []

  # ── DOM-002 §1.9 ───────────────────────────────────────────────────────────
  - name: NOTIFICATION_DELIVERY
    owningService: notification-service
    releaseWave: "W1"
    states:
      - name: REQUESTED
        persistent: true
        terminal: false
        quasiTerminal: false
        description: Notification-owned record created after the triggering business transaction commits; separate from the outbox integration event.
      - name: QUEUED
        persistent: true
        terminal: false
        quasiTerminal: false
      - name: DISPATCHING
        persistent: true
        terminal: false
        quasiTerminal: false
      - name: PROVIDER_ACCEPTED
        persistent: true
        terminal: false
        quasiTerminal: false
      - name: CANCELLED_BEFORE_SEND
        persistent: true
        terminal: true
        quasiTerminal: false
      - name: OBSOLETE
        persistent: true
        terminal: true
        quasiTerminal: false
        description: Superseded by a newer notification before dispatch.
      - name: PRE_DISPATCH_SUPPRESSED
        persistent: true
        terminal: true
        quasiTerminal: false
        description: Recipient address is on the local suppression list; dispatch prevented.
      - name: DISPATCH_FAILED
        persistent: true
        terminal: false
        quasiTerminal: false
      - name: INBOX_DELIVERED
        persistent: true
        terminal: true
        quasiTerminal: false
      - name: BOUNCED
        persistent: true
        terminal: true
        quasiTerminal: false
      - name: COMPLAINT
        persistent: true
        terminal: true
        quasiTerminal: false
      - name: PERMANENTLY_FAILED
        persistent: true
        terminal: true
        quasiTerminal: false
        description: Terminal state after retry exhaustion.
    processingPhases: []
    permittedTransitions:
      - from: REQUESTED
        to: QUEUED
      - from: REQUESTED
        to: CANCELLED_BEFORE_SEND
      - from: REQUESTED
        to: PRE_DISPATCH_SUPPRESSED
      - from: QUEUED
        to: DISPATCHING
      - from: QUEUED
        to: OBSOLETE
      - from: DISPATCHING
        to: PROVIDER_ACCEPTED
      - from: DISPATCHING
        to: DISPATCH_FAILED
      - from: PROVIDER_ACCEPTED
        to: INBOX_DELIVERED
      - from: PROVIDER_ACCEPTED
        to: BOUNCED
      - from: PROVIDER_ACCEPTED
        to: COMPLAINT
      - from: DISPATCH_FAILED
        to: DISPATCHING
      - from: DISPATCH_FAILED
        to: PERMANENTLY_FAILED
    guards: []
    integrationFacts: []

  # ── DOM-002 §1.10 ──────────────────────────────────────────────────────────
  - name: SUPPORT_CASE
    owningService: governance-support-service
    releaseWave: "W1"
    states:
      - name: OPEN
        persistent: true
        terminal: false
        quasiTerminal: false
      - name: IN_PROGRESS
        persistent: true
        terminal: false
        quasiTerminal: false
      - name: WAITING_FOR_USER
        persistent: true
        terminal: false
        quasiTerminal: false
      - name: WAITING_FOR_OPERATOR
        persistent: true
        terminal: false
        quasiTerminal: false
      - name: RESOLVED
        persistent: true
        terminal: false
        quasiTerminal: false
      - name: CLOSED
        persistent: true
        terminal: true
        quasiTerminal: false
    processingPhases: []
    permittedTransitions:
      - from: OPEN
        to: IN_PROGRESS
      - from: IN_PROGRESS
        to: WAITING_FOR_USER
      - from: WAITING_FOR_USER
        to: IN_PROGRESS
      - from: IN_PROGRESS
        to: WAITING_FOR_OPERATOR
      - from: WAITING_FOR_OPERATOR
        to: IN_PROGRESS
      - from: IN_PROGRESS
        to: RESOLVED
      - from: RESOLVED
        to: CLOSED
      - from: RESOLVED
        to: IN_PROGRESS
    guards: []
    integrationFacts: []

  # ── DOM-002 §1.11 (summary only; PRV-001 is authoritative for all privacy
  #    workflow lifecycles — PRV-001 §9/§11/§12/§14/§15. States and the chain
  #    below reproduce the DOM-002 deletion summary; alternative-state
  #    transitions are defined in PRV-001, not DOM-002.) ──────────────────────
  - name: PRIVACY_WORKFLOW
    owningService: account-service
    releaseWave: "W1"
    states:
      - name: REQUESTED
        persistent: true
        terminal: false
        quasiTerminal: false
      - name: VALIDATING
        persistent: true
        terminal: false
        quasiTerminal: false
      - name: COOLING_OFF
        persistent: true
        terminal: false
        quasiTerminal: false
      - name: APPROVED
        persistent: true
        terminal: false
        quasiTerminal: false
      - name: PROCESSING
        persistent: true
        terminal: false
        quasiTerminal: false
      - name: COMPLETED
        persistent: true
        terminal: true
        quasiTerminal: false
        description: Successful terminal state of the deletion flow; ANONYMIZED is an action/result, not a terminal state.
      - name: BLOCKED
        persistent: true
        terminal: false
        quasiTerminal: false
      - name: PARTIALLY_COMPLETED
        persistent: true
        terminal: false
        quasiTerminal: false
      - name: REQUIRES_REVIEW
        persistent: true
        terminal: false
        quasiTerminal: false
      - name: CANCELLED
        persistent: true
        terminal: false
        quasiTerminal: false
    processingPhases: []
    permittedTransitions:
      - from: REQUESTED
        to: VALIDATING
      - from: VALIDATING
        to: COOLING_OFF
      - from: COOLING_OFF
        to: APPROVED
      - from: APPROVED
        to: PROCESSING
      - from: PROCESSING
        to: COMPLETED
    guards: []
    integrationFacts: []

  # ── DOM-002 §1.12 ──────────────────────────────────────────────────────────
  - name: INVITATION
    owningService: station-operations-service
    releaseWave: "W1"
    states:
      - name: SENT
        persistent: true
        terminal: false
        quasiTerminal: false
      - name: ACCEPTED
        persistent: true
        terminal: true
        quasiTerminal: false
      - name: EXPIRED
        persistent: true
        terminal: true
        quasiTerminal: false
      - name: REVOKED
        persistent: true
        terminal: true
        quasiTerminal: false
    processingPhases: []
    permittedTransitions:
      - from: SENT
        to: ACCEPTED
      - from: SENT
        to: EXPIRED
      - from: SENT
        to: REVOKED
    guards: []
    integrationFacts: []

  # ── DOM-002 §1.13 ──────────────────────────────────────────────────────────
  - name: OWNERSHIP_TRANSFER
    owningService: station-operations-service
    releaseWave: "W1"
    states:
      - name: INITIATED
        persistent: true
        terminal: false
        quasiTerminal: false
      - name: ACCEPTED
        persistent: true
        terminal: true
        quasiTerminal: false
      - name: EXPIRED
        persistent: true
        terminal: true
        quasiTerminal: false
      - name: REJECTED
        persistent: true
        terminal: true
        quasiTerminal: false
      - name: CANCELLED
        persistent: true
        terminal: true
        quasiTerminal: false
    processingPhases: []
