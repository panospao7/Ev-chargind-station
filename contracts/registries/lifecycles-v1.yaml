  # ── DOM-002 §1.14 ──────────────────────────────────────────────────────────
  - name: DRIVER_FAULT_REPORT
    owningService: station-operations-service
    releaseWave: "W1"
    states:
      - name: SUBMITTED
        persistent: true
        terminal: false
        quasiTerminal: false
      - name: REVIEWED
        persistent: true
        terminal: false
        quasiTerminal: false
      - name: LINKED_TO_FAULT
        persistent: true
        terminal: true
        quasiTerminal: false
