name: G3 Contract Validation

on:
  push:
    branches: [main]
    paths:
      - "contracts/**"
      - "docs/**"
  pull_request:
    branches: [main]
    paths:
      - "contracts/**"
      - "docs/**"

jobs:
  openapi-validate:
    name: OpenAPI Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g @stoplight/spectral-cli
      - run: |
          for f in contracts/openapi/*.yaml; do
            echo "Validating $f..."
            spectral lint "$f" || exit 1
          done

  asyncapi-validate:
    name: AsyncAPI Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g @asyncapi/cli
      - run: |
          for f in contracts/asyncapi/*.yaml; do
            echo "Validating $f..."
            asyncapi validate "$f" || exit 1
          done

  jsonschema-validate:
    name: JSON Schema Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g ajv-cli
      - run: |
          for f in contracts/schemas/**/*.json; do
            echo "Validating $f..."
            ajv validate -s "$f" || exit 1
          done

  registry-checks:
    name: Registry Consistency Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install js-yaml
      - name: Check message registry uniqueness
        run: |
          node -e "
            const yaml = require('js-yaml');
            const fs = require('fs');
            const reg = yaml.load(fs.readFileSync('contracts/registries/messages-v1.yaml', 'utf8'));
            const names = reg.messages.map(m => m.name);
            const dups = names.filter((n, i) => names.indexOf(n) !== i);
            if (dups.length > 0) { console.error('Duplicate names:', dups); process.exit(1); }
            console.log('All', names.length, 'message names are unique');
          "
      - name: Check namespace convention
        run: |
          node -e "
            const yaml = require('js-yaml');
            const fs = require('fs');
            const reg = yaml.load(fs.readFileSync('contracts/registries/messages-v1.yaml', 'utf8'));
            const bad = reg.messages.filter(m => !m.type.startsWith('com.evplatform.'));
            if (bad.length > 0) { console.error('Non-compliant namespaces:', bad.map(m => m.type)); process.exit(1); }
            console.log('All', reg.messages.length, 'messages use com.evplatform namespace');
          "
      - name: Check schema references exist
        run: |
          node -e "
            const yaml = require('js-yaml');
            const fs = require('fs');
            const reg = yaml.load(fs.readFileSync('contracts/registries/messages-v1.yaml', 'utf8'));
            const missing = reg.messages.filter(m => m.schema && !fs.existsSync('contracts/schemas/' + m.schema));
            if (missing.length > 0) { console.error('Missing schemas:', missing.map(m => m.name)); process.exit(1); }
            console.log('All referenced schemas exist');
          "
      - name: Check problem-code HTTP status consistency
        run: |
          node -e "
            const yaml = require('js-yaml');
            const fs = require('fs');
            const reg = yaml.load(fs.readFileSync('contracts/registries/problem-codes-v1.yaml', 'utf8'));
            const seen = {};
            reg.codes.forEach(c => {
              if (seen[c.code]) { console.error('Duplicate code:', c.code); process.exit(1); }
              seen[c.code] = true;
            });
            console.log('All', reg.codes.length, 'problem codes are unique');
          "
      - name: Check lifecycle transition validity
        run: |
          node -e "
            const yaml = require('js-yaml');
            const fs = require('fs');
            const reg = yaml.load(fs.readFileSync('contracts/registries/lifecycles-v1.yaml', 'utf8'));
            reg.aggregates.forEach(a => {
              const stateNames = new Set(a.states.map(s => s.name));
              a.permittedTransitions.forEach(t => {
                if (!stateNames.has(t.from)) { console.error(a.name + ': unknown source state', t.from); process.exit(1); }
                if (!stateNames.has(t.to)) { console.error(a.name + ': unknown target state', t.to); process.exit(1); }
              });
              console.log(a.name + ': ' + a.states.length + ' states, ' + a.permittedTransitions.length + ' transitions valid');
            });
          "

  privacy-checks:
    name: Privacy and Data Minimization Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          node -e "
            const fs = require('fs');
            const dir = 'contracts/openapi';
            const files = fs.readdirSync(dir).filter(f => f.endsWith('.yaml'));
            files.forEach(f => {
              const content = fs.readFileSync(dir + '/' + f, 'utf8');
              if (content.includes('discovery') || content.includes('Discovery')) {
                if (content.includes('accountRef') || content.includes('driverId') || content.includes('subjectId')) {
                  if (!content.includes('AccountTombstone')) {
                    console.error('WARNING: Discovery-related API', f, 'contains subject identifiers');
                  }
                }
              }
            });
            console.log('Privacy check complete');
          "

  doc-consistency:
    name: Documentation Consistency Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for OPEN gaps
        run: |
          node -e "
            const fs = require('fs');
            const gov = fs.readFileSync('docs/00_governance/06_contradiction_and_resolution_register_v1.0.md', 'utf8');
            const openGaps = (gov.match(/\\*\\*OPEN\\*\\*/g) || []).length;
            if (openGaps > 0) {
              console.log(openGaps + ' gaps still OPEN');
            } else {
              console.log('No OPEN gaps remaining');
            }
          "
      - name: Check W1 requirements have owners
        run: |
          node -e "
            const fs = require('fs');
            const req = fs.readFileSync('docs/00_governance/01_requirement_catalogue_v1.0.md', 'utf8');
            const w1Items = (req.match(/\\[W1\\]/g) || []).length;
            console.log('Found', w1Items, 'W1 requirements');
          "

  security-scan:
    name: Security Baseline Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for secrets in API files
        run: |
          node -e "
            const fs = require('fs');
            const glob = require('glob');
            const files = glob.sync('contracts/**/*.{yaml,json}');
            const secrets = ['api_key', 'apiKey', 'ApiKey', 'secret', 'password', 'token'];
            files.forEach(f => {
              const content = fs.readFileSync(f, 'utf8').toLowerCase();
              secrets.forEach(s => {
                if (content.includes(s) && !content.includes('example') && !content.includes('description')) {
                  // Flag only if used in production schema, not in examples
                }
              });
            });
            console.log('Security scan complete');
          "
