name: G3 Contract Validation

on:
  push:
    branches: [main]
    paths:
      - "contracts/**"
      - "docs/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".nvmrc"
      - ".spectral.yaml"
      - ".github/workflows/g3-contract-validation.yml"
  pull_request:
    branches: [main]
    paths:
      - "contracts/**"
      - "docs/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".nvmrc"
      - ".spectral.yaml"
      - ".github/workflows/g3-contract-validation.yml"

# Least privilege: the gate only reads the repository. It publishes no
# check runs, releases, or packages.
permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  openapi-validate:
    name: OpenAPI Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Node
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate OpenAPI specs
        run: npm run contracts:openapi

  asyncapi-validate:
    name: AsyncAPI Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Node
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate AsyncAPI spec
        run: npm run contracts:asyncapi

  jsonschema-validate:
    name: JSON Schema Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Node
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate JSON Schemas
        run: npm run contracts:schemas

  registry-checks:
    name: Registry Consistency Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Node
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run registry checks
        run: npm run contracts:registries

  privacy-checks:
    name: Privacy and Data Minimization Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Node
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run security and privacy scan
        run: npm run contracts:privacy

  doc-consistency:
    name: Documentation Consistency Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Node
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run documentation consistency checks
        run: npm run contracts:docs

  security-scan:
    name: Secret Scanning (fail closed)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Node
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run secret scanning
        run: npm run contracts:secrets

  self-test:
    name: Validator Self-Test (failure injection)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Node
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Prove every validator category fails closed on invalid fixtures
        run: npm run contracts:self-test

  required:
    name: Required Aggregation
    if: always()
    needs:
      - openapi-validate
      - asyncapi-validate
      - jsonschema-validate
      - registry-checks
      - privacy-checks
      - doc-consistency
      - security-scan
      - self-test
    runs-on: ubuntu-latest
    steps:
      - name: Check for failures
        run: |
          echo "openapi-validate: ${{ needs.openapi-validate.result }}"
          echo "asyncapi-validate: ${{ needs.asyncapi-validate.result }}"
          echo "jsonschema-validate: ${{ needs.jsonschema-validate.result }}"
          echo "registry-checks: ${{ needs.registry-checks.result }}"
          echo "privacy-checks: ${{ needs.privacy-checks.result }}"
          echo "doc-consistency: ${{ needs.doc-consistency.result }}"
          echo "security-scan: ${{ needs.security-scan.result }}"
          echo "self-test: ${{ needs.self-test.result }}"
          if [ "${{ needs.openapi-validate.result }}" != "success" ] || \
             [ "${{ needs.asyncapi-validate.result }}" != "success" ] || \
             [ "${{ needs.jsonschema-validate.result }}" != "success" ] || \
             [ "${{ needs.registry-checks.result }}" != "success" ] || \
             [ "${{ needs.privacy-checks.result }}" != "success" ] || \
             [ "${{ needs.doc-consistency.result }}" != "success" ] || \
             [ "${{ needs.security-scan.result }}" != "success" ] || \
             [ "${{ needs.self-test.result }}" != "success" ]; then
            echo "FAIL: One or more required checks failed"
            exit 1
          fi
          echo "All required checks passed"
