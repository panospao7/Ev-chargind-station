name: G3 Contract Validation

on:
  push:
    branches: [main]
    paths:
      - "contracts/**"
      - "docs/**"
      - "scripts/**"
      - "package.json"
  pull_request:
    branches: [main]
    paths:
      - "contracts/**"
      - "docs/**"
      - "scripts/**"
      - "package.json"

permissions:
  contents: read
  checks: write

env:
  NODE_VERSION: "24"

defaults:
  run:
    shell: bash

jobs:
  openapi-validate:
    name: OpenAPI Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Node
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Validate OpenAPI specs
        run: npx --yes @stoplight/spectral-cli@6.14.3 lint contracts/openapi/*.yaml
      - name: Check operationId uniqueness
        run: |
          node -e "
            const fs = require('fs'), yaml = require('js-yaml');
            const files = fs.readdirSync('contracts/openapi').filter(f => f.endsWith('.yaml'));
            let exitCode = 0;
            for (const f of files) {
              const doc = yaml.load(fs.readFileSync('contracts/openapi/' + f, 'utf8'));
              const ops = new Set();
              for (const [path, methods] of Object.entries(doc.paths || {})) {
                for (const [method, op] of Object.entries(methods)) {
                  if (op.operationId) {
                    if (ops.has(op.operationId)) {
                      console.error('FAIL: Duplicate operationId ' + op.operationId + ' in ' + f);
                      exitCode = 1;
                    }
                    ops.add(op.operationId);
                  }
                }
              }
              console.log('  ' + f + ': ' + ops.size + ' unique operationIds');
            }
            process.exit(exitCode);
          "

  asyncapi-validate:
    name: AsyncAPI Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Node
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Validate AsyncAPI spec
        run: npx --yes @asyncapi/cli@2.13.0 validate contracts/asyncapi/platform-messaging-v1.yaml

  jsonschema-validate:
    name: JSON Schema Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Node
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Validate JSON Schemas
        run: node scripts/contracts/validate-schemas.js
      - name: Validate with ajv
        run: |
          find contracts/schemas -name '*.json' -exec npx --yes ajv-cli@5.0.0 validate -s {} \;

  registry-checks:
    name: Registry Consistency Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Node
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Run registry checks
        run: node scripts/contracts/check-registries.js

  privacy-checks:
    name: Privacy and Data Minimization Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Node
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Run security and privacy scan
        run: node scripts/contracts/security-scan.js

  doc-consistency:
    name: Documentation Consistency Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Node
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Run documentation consistency checks
        run: node scripts/contracts/check-docs.js

  security-scan:
    name: Security Baseline Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Node
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Run secret scanning
        run: |
          npx --yes secretlint@8.5.0 "contracts/**/*.{yaml,json}" 2>/dev/null || true
          echo "Secretlint check complete (non-blocking)"

  required:
    name: Required Aggregation
    if: always()
    needs:
      - openapi-validate
      - asyncapi-validate
      - jsonschema-validate
      - registry-checks
      - privacy-checks
      - doc-consistency
      - security-scan
    runs-on: ubuntu-latest
    steps:
      - name: Check for failures
        run: |
          echo "openapi-validate: ${{ needs.openapi-validate.result }}"
          echo "asyncapi-validate: ${{ needs.asyncapi-validate.result }}"
          echo "jsonschema-validate: ${{ needs.jsonschema-validate.result }}"
          echo "registry-checks: ${{ needs.registry-checks.result }}"
          echo "privacy-checks: ${{ needs.privacy-checks.result }}"
          echo "doc-consistency: ${{ needs.doc-consistency.result }}"
          echo "security-scan: ${{ needs.security-scan.result }}"
          if [ "${{ needs.openapi-validate.result }}" = "failure" ] || \
             [ "${{ needs.asyncapi-validate.result }}" = "failure" ] || \
             [ "${{ needs.jsonschema-validate.result }}" = "failure" ] || \
             [ "${{ needs.registry-checks.result }}" = "failure" ] || \
             [ "${{ needs.privacy-checks.result }}" = "failure" ] || \
             [ "${{ needs.doc-consistency.result }}" = "failure" ] || \
             [ "${{ needs.security-scan.result }}" = "failure" ]; then
            echo "FAIL: One or more required checks failed"
            exit 1
          fi
          echo "All required checks passed"
