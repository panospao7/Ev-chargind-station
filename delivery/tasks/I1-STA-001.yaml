  maximumExpectedDiff: >
    Moderate-large and vertical: 13 tables of forward SQL migrations, a
    profile-gated seed/reset runner (JdbcClient, no ORM), and an integration
    suite. Any REST controller, business workflow, event/outbox code, or
    table outside the ARC-022 §9 W1-S1 list is out of scope and must be
    refused.

  generatedFilesPolicy: >
    All SQL and Java hand-authored. No generated clients exist at this layer.

acceptanceCriteria:
  - id: "AC-01"
    statement: >
      All thirteen ARC-022 §9 W1-S1 Station Operations tables exist in
      station_operations_db via forward Flyway migrations (V2+) run by the
      STA migrator role; fresh install and upgrade path pass; numbering is
      unique and checksums verify; no table outside the list is created.
    authorityReferences:
      - "ARC-022 §9, §12–13; AGENTS.md §10"
    evidenceRequired:
      - "integration suite output; psql catalogue listing"
    testTypes: ["migration", "integration"]

  - id: "AC-02"
    statement: >
      The seed produces the exact S1-01 dataset deterministically: one ACTIVE
      operator organization; ≥2 stations in PUBLISHED state with Greek
      coordinates/metadata; ≥2 EVSEs per station in EVSE lifecycle states per
      DOM-002; ≥2 connector/power combinations (e.g. CCS 150 kW DC + Type 2
      22 kW AC); opening hours per station; exactly one ACTIVE tariff version
      with components; exactly one ACTIVE booking-policy version carrying the
      S1-03 constants (15-minute increments, 5-minute hold, 15-minute
      minimum, 4-hour maximum, 14-day advance, 60-minute near-term horizon,
      300-second freshness); simulator assignments for every seeded EVSE.
    authorityReferences:
      - "GOV-007 §3 S1-01, S1-03; DOM-002 lifecycles"
    evidenceRequired:
      - "seed output + dataset assertion suite"
    testTypes: ["integration"]

  - id: "AC-03"
    statement: >
      Seed is idempotent (re-run changes nothing, proven by row-count and
      content equality) and reset restores the canonical seeded state; both
      operate only within station_operations_db — the suite proves the
      seeder's credentials cannot write elsewhere (role separation from
      I1-DAT-001).
    authorityReferences:
      - "GOV-007 §3 S1-01 (repeatable reset); AGENTS.md §4"
    evidenceRequired:
      - "idempotency and reset test output"
    testTypes: ["integration", "negative"]

  - id: "AC-04"
    statement: >
      ACTIVE tariff/policy versions are immutability-protected at the
      database level (trigger or constraint rejecting UPDATE/DELETE on active
      versions), mirroring ARC-022 §5.7 snapshot semantics; lifecycle states
      in seed rows match DOM-002 and the executable lifecycles registry.
    authorityReferences:
      - "ARC-022 §5.7; DOM-002; contracts/registries/lifecycles-v1.yaml"
    evidenceRequired:
      - "negative-fixture test output (mutation rejected)"
    testTypes: ["migration", "negative"]

  - id: "AC-05"
    statement: >
      The new service-tests workflow runs the station-operations suite
      authoritatively on JDK 25 and is green on the PR; existing G3 and
      db-migrations workflows remain green.
    authorityReferences:
      - "ARC-015 EPIC-07 acceptance (executable evidence); I1-DAT-001 CI precedent"
    evidenceRequired:
      - "GitHub Actions run references"
    testTypes: ["ci"]

tests:
  focusedCommands:
    - "./mvnw -pl services/station-operations-service -am test"
  requiredSuites:
    - "./mvnw test"
    - "npm run contracts:verify"
    - "node scripts/delivery/validate.mjs"
    - "npm run contracts:secrets"
    - "git diff --check"
  positiveCases:
    - "Fresh container → provision → migrate → seed → dataset invariants hold; reset → identical canonical state."
  negativeCases:
    - "Seed credentials cannot write outside station_operations_db."
    - "UPDATE/DELETE on an ACTIVE tariff or policy version is rejected."
    - "Duplicate migration version rejected (existing suite)."
  boundaryCases: []
  concurrencyCases: []
  securityCases:
    - "No credentials beyond documented dev-only values; secret scan green."
  contractCases: []
  migrationCases:
