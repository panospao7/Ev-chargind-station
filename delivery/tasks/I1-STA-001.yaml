schemaVersion: "1.0"

task:
  id: "I1-STA-001"
  title: "S1-01 infrastructure seed — Station Operations W1-S1 tables and deterministic seed/reset"
  initialState: "READY"
  iteration: "I1"
  epic: "EPIC-07"
  releaseWave: "W1"
  sliceApplicability: "W1-S1"
  impactLevel: "L3"
  owner: "Backend/Data Architect and Project Owner"
  createdAt: "2026-09-11"
  baselineCommit: null

objective: >
  Deliver GOV-007 §3 S1-01 (repeatable infrastructure seed) for the Station
  Operations Service: the W1-S1 physical tables exactly as listed in ARC-022
  §9 (operator_organization, organization_member, station,
  station_opening_period, station_schedule_exception, evse, connector,
  tariff, tariff_version, tariff_component, booking_policy,
  booking_policy_version, simulator_assignment), plus a deterministic,
  idempotent, service-owned seed and reset mechanism that produces the
  canonical S1 dataset — one active operator organization, at least two
  published Greek stations with two EVSEs each, at least two connector/power
  combinations, opening hours, one active tariff version, one active
  booking-policy version carrying the S1-03 constants, and simulator
  assignments — entirely within station_operations_db. No REST APIs, no
  business workflows: this is the data foundation the discovery, booking and
  simulator tasks consume.

origin: >
  Owner direction 2026-09-11 ("let's do the recommendation") selecting the
  orchestrator-recommended next W1-S1 packet after the wave-1 foundation
  completed (I1-DAT-001 VERIFIED).

requirements:
  - "FR-OPS-02 (W1-S2) — this task delivers the authoritative DATA MODEL its
    management APIs will later operate on; no APIs are built here."
  - "FR-SIM-01 (W1-S1, enabling) — simulator_assignment rows provide the
    station-scoped assignment Device Integration projects; machine identities
    themselves are the device-integration task's."
  - "GOV-007 §3 S1-01 — the S1 dataset definition itself."

useCases:
  - "None directly; the seeded dataset is the fixture for UC-DR-001..008
    downstream and for operator workflows (UC-OP-001/002) in W1-S2."

authority:
  governance:
    - path: "docs/00_governance/07_w1_baseline_and_first_vertical_slice_v1.0.md"
      section: "§3 S1-01 (dataset bullets), §3 S1-03 (interval constants: 15-minute increments, 5-minute hold, 15-minute minimum, 4-hour maximum, 14-day advance limit, 60-minute near-term horizon, 300-second freshness), §7 (W1 blocking rule)"
  requirements:
    - path: "docs/01_scope_and_requirements/04_functional_requirements_and_traceability_v1.1.md"
      section: "FR-OPS-02, FR-SIM-01 (enabling context)"
  domain:
    - path: "docs/03_domain/02_lifecycle_and_invariant_catalogue_v1.0.md"
      section: "Station, EVSE, connector, tariff-version and booking-policy-version lifecycles (states used by seed rows; contract-lifecycles registry is the executable mirror)"
  architecture:
    - path: "docs/05_architecture/16_w1_persistence_and_contract_finalization_v1.0.md"
      section: "§9 Station Operations Service W1-S1 table list (EXACT table set — no additions), §12–13 migration rules, §18 DATA-006 (seed/reset manifest), §19 (definition-of-done items 2–6, 14)"
    - path: "docs/08_delivery_and_ai_agents/04_local_engineering_foundation_v1.0.md"
      section: "§3 baselines, §4.1 ownership rules, §6.3 topology, §8.2 database commands"
    - path: "docs/08_delivery_and_ai_agents/02_implementation_epics_dependency_roadmap_v1.0.md"
      section: "EPIC-07 scope boundary (this task precedes its APIs), §4 M3"

invariants:
  - "Station Operations owns station_operations_db alone; the seed and reset
    never write outside it (AGENTS.md §4)."
  - "Applied migrations are immutable; new tables arrive as new forward
    migrations V2+ with unique numbering (AGENTS.md §10)."
  - "Activation implies immutability: an ACTIVE tariff/booking-policy version
    must be constraint-protected against mutation (ARC-022 §5.7 snapshot
    semantics)."
  - "No account, driver, vehicle or discovery-side identifiers in Station
    Operations seed data beyond organization-owned references; test
    identities belong to the identity task (explicit non-goal here)."
  - "Column-level designs not fixed by ARC-022 §9 are derived strictly from
    DOM-002 lifecycles and GOV-007 S1-03 constants; ambiguity stops with
    CLARIFICATION_REQUIRED, never invention."

