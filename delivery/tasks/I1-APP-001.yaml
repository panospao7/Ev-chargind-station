invariants:
  - "Browser authentication uses an opaque BFF session; browser JavaScript
    receives no OAuth token (AGENTS.md §4) — public reads carry no session
    requirement but must still go through the BFF origin (ARC-FE-10)."
  - "Discovery projections contain no account/driver/vehicle identifiers —
    the UI renders public fields only."
  - "Components do not construct REST URLs manually (ARC-008 §6.8) — all
    calls go through adapters using relative /api paths."
  - "No OAuth tokens, session identifiers, or restricted data in browser
    storage (ARC-008 §9 prohibited list)."
  - "Search state lives in URL query parameters (ARC-FE-08)."
  - "The map and list derive from the same result collection (ARC-023 §9.5)."
  - "Map failure never blocks the list (ARC-023 §9.5)."

