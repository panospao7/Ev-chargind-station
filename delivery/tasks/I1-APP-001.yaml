acceptanceCriteria:
  - id: "AC-01"
    statement: >
      PUB-01 and PUB-02 render the station list from listStations (via the
      BFF proxy) with the ARC-023 §9.2 URL query contract (geo bounds,
      connector, minimumPowerKw→minPowerW mapping, view=list|map) preserved
      in the URL; filters restore on reload; invalid values are removed.
    authorityReferences:
      - "ARC-023 §6.2, §9.1, §9.2; ARC-FE-08"
    evidenceRequired:
      - "component tests; E2E-style navigation test"
    testTypes: ["component", "integration"]

  - id: "AC-02"
    statement: >
      PUB-02 provides explicit map/list mode; the map (MapLibre via the
      adapter) and the list derive from the same result collection; map
      initialization failure or tile-provider unavailability shows the
      fallback panel while the list remains fully operational.
    authorityReferences:
      - "ARC-023 §9.3-9.5; ARC-FE-17"
    evidenceRequired:
      - "component tests incl. map-failure fallback"
    testTypes: ["component", "negative"]

  - id: "AC-03"
    statement: >
      PUB-03 renders station details from getStationDetails: name, address,
      coordinates, EVSEs with connectors (type + power), tariff components
      (display-ready from minor units), totalEvses, freshness timestamp;
      unknown station → the not-found state (localized); loading skeleton;
      error state with retry.
    authorityReferences:
      - "ARC-023 §6.2, §10; ARC-023 §9.5 states"
    evidenceRequired:
      - "component tests (loaded/empty/error paths)"
    testTypes: ["component", "negative"]

  - id: "AC-04"
    statement: >
      Locale routing: /el (default) and /en prefixes work; all rendered
      strings are localized in Greek and English; page titles localized;
      locale switch preserves the current route and query state.
    authorityReferences:
      - "ARC-008 §9; ARC-FE-15; ARC-023 §2"
    evidenceRequired:
      - "routing tests; i18n resource completeness check"
    testTypes: ["component"]

  - id: "AC-05"
    statement: >
      The BFF exposes same-origin public proxy routes for the two Discovery
      operations (no auth required, no session changes, no token handling);
      the browser never calls Discovery directly; the BFF adds correlation
      headers and forwards Problem Details responses unchanged.
    authorityReferences:
      - "ARC-FE-10; ARC-008 §7; owner decision"
    evidenceRequired:
      - "BFF integration test (proxy + problem passthrough)"
    testTypes: ["integration"]

  - id: "AC-06"
    statement: >
      Accessibility baseline: the three screens pass automated axe checks
      with zero critical violations; keyboard-only navigation reaches all
      interactive elements in correct focus order; list/map equivalence
      holds (every map result is reachable via the list).
    authorityReferences:
      - "ARC-023 §26; ARC-008 §12 (accessibility)"
    evidenceRequired:
      - "axe test output; keyboard test notes"
    testTypes: ["accessibility", "component"]

  - id: "AC-07"
    statement: >
      Browser storage invariants: no OAuth tokens, session identifiers, or
      restricted data in any browser storage; search state only in the URL;
      components never construct REST URLs manually (adapters only).
    authorityReferences:
      - "ARC-008 §9-10; ARC-FE-10/11"
    evidenceRequired:
      - "code review; grep evidence in the handoff"
    testTypes: ["review"]

