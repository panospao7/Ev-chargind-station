schemaVersion: "1.0"

task:
  id: "I1-APP-001"
  title: "Angular public discovery — PUB-01..03, locale routing, BFF public proxy, map/list with adapter (first UI slice)"
  initialState: "READY"
  iteration: "I1"
  epic: "EPIC-19"
  releaseWave: "W1"
  sliceApplicability: "W1-S1"
  impactLevel: "L2"
  owner: "Frontend/UX Architect and Project Owner"
  createdAt: "2026-09-13"
  baselineCommit: null

objective: >
  Deliver the first user-visible UI: the public discovery screens of the
  Angular SPA per ARC-023 (W1-S1 scope) — PUB-01 (/{locale} discovery entry),
  PUB-02 (/{locale}/stations map/list search with URL-contract filters and
  map/list mode), PUB-03 (/{locale}/stations/{stationRef} station details
  with EVSEs/connectors/tariff/freshness) — against the live Discovery API
  through the same-origin BFF public proxy (owner decision: ARC-FE-10
  honored uniformly). Locale-prefixed routing /el (default) and /en with
  Greek/English labels for all rendered strings. MapLibre GL JS rendering
  behind the replaceable tile adapter (owner-approved dependency; provider
  selection stays deferred per OQ-UI-03 — a free OSM tile source is
  configured for local dev with attribution). Hand-written type-safe
  adapters mirroring the public-discovery OpenAPI schemas (owner decision;
  openapi-generator setup remains an EPIC-06 follow-up). Screen states per
  ARC-023 §9.5 (loading skeletons, empty, map-failure fallback with list
  retained, tile-provider unavailable panel, search unavailable + retry).
  Accessibility baseline per ARC-023 §26/ARC-008: keyboard navigation,
  focus order, axe checks on the three screens, list/map equivalence.

origin: >
  Owner decision 2026-09-13 (interactive session): Angular app selected as
  the next slice after I1-DSC-002 (15 tasks verified); four implementation
  decisions approved (maplibre-gl, BFF proxy, hand-written adapters,
  PUB-01..03 scope).

