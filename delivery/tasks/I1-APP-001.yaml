  - "FR-DIS-01 — public discovery browse/search through accessible map and
    list views (this slice delivers the UI surface)."
  - "FR-DIS-02 — station/EVSE/connector/tariff/freshness details display
    (UI rendering of the I1-DSC-002 data)."

