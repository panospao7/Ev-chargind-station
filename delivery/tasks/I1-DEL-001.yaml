acceptanceCriteria:
  - id: "AC-01"
    statement: >
      For every project agent plus the build, plan, general and explore
      built-ins, OpenCode's resolved rules deny the recorded forms of direct
      pushes to main, force pushes, branch deletion, sweep staging, amend,
      destructive checkout and switch, merge, rebase, reset, restore, clean,
      tag, gh pr merge and review, and destructive infrastructure, database and
      file commands. Staging and committing prompt a human; the orchestrator
      can push only a single task branch without a prompt.
    authorityReferences:
      - "AGENTS.md §12; DEC-AGENT-01"
    evidenceRequired:
      - "scripts/delivery/check-agent-permissions.mjs result"
    testTypes: ["configuration", "security"]

  - id: "AC-02"
    statement: >
      Only project agents and OpenCode built-ins can be selected, and the
      result holds with and without the owner's global OpenCode config.
    authorityReferences:
      - "ARC-016 §2 (least privilege); AGENTS.md §8"
    evidenceRequired:
      - "permission check result in both configurations"
    testTypes: ["configuration"]

  - id: "AC-03"
    statement: >
      Coder and debugger need a human prompt to edit normative documents,
      dependency manifests and validators, and cannot edit secret-pattern
      files anywhere in the repository; the documentation agent needs a prompt
      for docs/**.
    authorityReferences:
      - "AGENTS.md §10-§11; ARC-016 §8, §13"
    evidenceRequired:
      - "permission check result"
    testTypes: ["configuration", "security"]

  - id: "AC-04"
    statement: >
      Packet-specified Windows Maven test commands and read-only CI inspection
      no longer prompt for the agents that need them, and the orchestrator can
      push only task branches.
    authorityReferences:
      - "AGENTS.md §11; DEC-AGENT-01"
    evidenceRequired:
      - "permission check result"
    testTypes: ["configuration"]

  - id: "AC-05"
    statement: >
      A command commits reviewed work under the DEC-AGENT-01 pre-commit gate,
      pushes the task branch and opens a pull request for human merge; no
      command contradicts it; review results are saved unedited as handoffs.
    authorityReferences:
      - "DEC-AGENT-01; ARC-016 §19; delivery/README.md handoff naming"
    evidenceRequired:
      - "diff review; secret-scan command executed"
    testTypes: ["review"]

  - id: "AC-06"
    statement: >
      No command assigns a workflow state outside the AGENTS.md §7 state
      machine.
    authorityReferences:
      - "AGENTS.md §7; scripts/delivery/validate.mjs validStates"
    evidenceRequired:
      - "grep of command state lists; validator result"
    testTypes: ["review"]

  - id: "AC-07"
    statement: >
      The I1-IAM-002 status entry matches repository facts: both unmerged
      branches, the open deviation, the out-of-scope file and the owner
      decision are recorded without changing either implementation line.
    authorityReferences:
      - "delivery/README.md source-of-truth ownership and deviation rules"
    evidenceRequired:
      - "status, deviation and handoff diff; validator result"
    testTypes: ["review"]

tests:
  focusedCommands:
    - "node scripts/delivery/check-agent-permissions.mjs"
    - "node scripts/delivery/validate.mjs"
    - "node scripts/delivery/self-test.mjs"
  requiredSuites:
    - "Permission check with the owner's global config and with an empty config directory"
  positiveCases:
    - "Orchestrator pushes task/* branches and reads CI status; coder runs .\\mvnw.cmd test commands."
  negativeCases:
    - "The FORBIDDEN_COMMANDS list is denied for all checked agents."
  boundaryCases:
    - "A branch named task/main-fix stays pushable while pushes targeting main are denied."
  concurrencyCases: []
  securityCases:
    - "Secret-pattern files are denied even under paths with a broader ask rule."
