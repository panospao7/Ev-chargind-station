schemaVersion: "1.0"

task:
  id: "I1-DEL-001"
  title: "Make the OpenCode control plane enforceable before first live use — agent permissions, ship step, valid states, I1-IAM-002 record correction"
  initialState: "READY"
  iteration: "I1"
  epic: "EPIC-00"
  releaseWave: "W1"
  sliceApplicability: "cross-cutting"
  impactLevel: "L3"
  owner: "Project Owner"
  createdAt: "2026-11-04"
  baselineCommit: "811b81ed39ca954217cf785f5f9c3135f14b2263"

objective: >
  Delivery moved from ZCode to OpenCode on 2026-11-04, so the .opencode rules
  now govern live work. Close the gaps between the written agent rules and the
  permissions OpenCode actually resolves; add the missing step that commits
  reviewed work and opens a pull request; replace command states the delivery
  validator rejects; and correct the I1-IAM-002 record, including its diverged
  unmerged branches. A repeatable check proves the resolved permissions.

nonGoals:
  - "Choosing per-agent models (owner decision: which providers may receive repository content, ARC-016 §26)."
  - "Reconciling AGENTS.md and ARC-016 impact levels, or changing the always-loaded instructions (owner decision)."
  - "Choosing Makefile or npm scripts for ENG-001 §8, or removing the unresolved make rules (owner decision)."
  - "Choosing, merging or changing either I1-IAM-002 implementation line; splitting its packet."
  - "Changing GitHub branch protection or files under ~/.config/opencode (owner actions)."
  - "Repairing review matrices of VERIFIED tasks, adding the validator to CI, or moving checklists into skills."
  - "New specialist agents or skills for EPIC-10 and later epics."
  - "A validating wrapper script for git add, commit and push (owner decision; staging and committing prompt a human until then)."
  - "Deciding how delivery/status.yaml relates to packet allowedFiles under DEC-AGENT-01 (owner decision; /ship-task stops on the conflict)."
  - "Whether opencode --auto is banned for this repository (owner decision)."

useCases:
  - "None; delivery control plane only."

authority:
  governance:
    - path: "AGENTS.md"
      section: "§6 impact levels; §7 state machine; §10 implementation rules; §11 validators; §12 git safety and DEC-AGENT-01"
    - path: "docs/00_governance/01_decision_and_open_question_register_v1.0.md"
      section: "DEC-AGENT-01 (GOV-001 §16e)"
    - path: "docs/08_delivery_and_ai_agents/03_ai_agent_rules_review_gates_v1.0.md"
      section: "§7-§9 permitted and prohibited actions; §19 pull-request handoff; §32 permission profiles"
    - path: "delivery/README.md"
      section: "Workflow; handoff naming; deviation rules; human authority"
  requirements: []
  domain: []
  architecture: []
  contracts: []

invariants:
  - "Secrets, credentials and private keys never appear in source, logs or evidence (AGENTS.md §4)."
  - "Merge to main, rebase, reset, restore, clean, tag, deploy and force-push remain human-only (DEC-AGENT-01)."
  - "No validator is weakened or disabled (AGENTS.md §11)."
  - "Workflow state stays limited to the AGENTS.md §7 state machine."

