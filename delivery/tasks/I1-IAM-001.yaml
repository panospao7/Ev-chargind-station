securityPrivacy:
  affected: true
  threatChanges:
    - "Introduces the browser identity trust boundary (TB-02/TB-03):
      mitigated by the confidential BFF profile, opaque cookie, PKCE,
      private_key_jwt, encrypted server-side token storage, rotation,
      CSRF, Origin allowlist, no browser tokens."
    - "New personal-ish data in bff_session_db: keycloak subject + session
      metadata (no profile data); encrypted token material; retention
      follows session expiry — no unbounded retention."
    - "Anti-enumeration rules apply to login error responses (generic
      errors)."
  dataClassifications:
