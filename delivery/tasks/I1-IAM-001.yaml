acceptanceCriteria:
  - id: "AC-01"
    statement: >
      A version-controlled `ev-local` realm import exists under
      infra/local/keycloak/realms/ and a fresh `docker compose up` (core
      profile) imports it deterministically: realm ev-local; ev-bff client
      (Authorization Code + PKCE S256, private_key_jwt client auth,
      exact redirect URIs for the local BFF callback, implicit/ROPC
      disabled); svc-* clients declared per SEC-001 §4.2; test users per
      SEC-001 §3 (driver verified-active; suspended account; privileged
      user marked MFA-capable); no secret material in the file.
    authorityReferences:
      - "SEC-001 §3, §4.1, §4.2; foundation doc §6.5; ADR-009"
    evidenceRequired:
      - "realm import file + fresh-bootstrap demonstration output"
    testTypes: ["integration", "configuration"]

  - id: "AC-02"
    statement: >
      BFF login works end-to-end locally: browser redirect to Keycloak
      (Code + PKCE S256, state+nonce), callback validation, private_key_jwt
      code exchange, tokens encrypted in the server-side session store
      (bff_session_db), browser receives ONLY the __Host-evsession opaque
      cookie (Secure, HttpOnly, Path=/, no Domain, SameSite=Lax), session
      ID rotates after authentication.
    authorityReferences:
      - "SEC-001 §5.1 flow steps 1-7; §5.2 cookie contract; §5.3 persistence"
    evidenceRequired:
      - "integration test evidence + cookie attribute assertions"
    testTypes: ["integration", "security"]

  - id: "AC-03"
    statement: >
      SEC-P01 §5.4 required tests pass to the extent reachable without a
      real browser harness: browser storage contains no OAuth token;
      session ID changes after login; idle expiry works; absolute expiry
      works; logout invalidates the BFF session; refresh after logout
      fails; stolen old session ID fails after rotation; malformed
      back-channel logout token is rejected; authenticated responses use
      Cache-Control: no-store. Back-channel logout (valid token)
      invalidates the mapped local session.
    authorityReferences:
      - "SEC-001 §5.4 required tests"
    evidenceRequired:
      - "test suite output mapping each required test to a result"
    testTypes: ["integration", "security"]

  - id: "AC-04"
    statement: >
      SEC-P02 CSRF protection: GET /api/v1/session/csrf issues a
      session-bound synchronizer token; browser mutations without
      X-CSRF-TOKEN fail 403 CSRF_VALIDATION_FAILED; token from another
      session fails; stale token after rotation fails; hostile Origin
      fails 403 ORIGIN_NOT_ALLOWED; safe methods exempt; login callback
      relies on state/nonce/PKCE not CSRF.
    authorityReferences:
      - "SEC-001 §6.1-§6.4"
    evidenceRequired:
      - "test suite output mapping each §6.4 required test to a result"
    testTypes: ["integration", "security"]

  - id: "AC-05"
    statement: >
      driver-bff contract extended with GET /api/v1/session,
      GET /api/v1/session/csrf, POST /api/v1/session/logout (session-cookie
      security, x-release-wave W1, x-slice-applicability W1-S1, unique
      operationIds), problem-code registry updated with the SEC-001 §17
      codes this slice emits (AUTHENTICATION_REQUIRED, SESSION_EXPIRED,
      CSRF_VALIDATION_FAILED, ORIGIN_NOT_ALLOWED, TOKEN_INVALID,
      ACCESS_DENIED, ACCOUNT_SUSPENDED), examples validate, G3 contract
      validation passes, compatibility checks pass.
    authorityReferences:
      - "SEC-001 §6.3; ARC-022 Driver BFF API; ARC-013 API-first; AGENTS.md
        §10 contract synchronization rules"
    evidenceRequired:
      - "contract diff + G3 green + registry check output"
    testTypes: ["contract"]

  - id: "AC-06"
    statement: >
      bff_session_db V1 Flyway migration creates the session store per
      SEC-001 §5.3 fields (no arbitrary Java serialization; encrypted
      token material via authenticated encryption with a versioned key
      ring; key material supplied via environment placeholder, never
      committed); migration tested against real PostgreSQL via
      Testcontainers; runtime role cannot DDL.
    authorityReferences:
      - "SEC-001 §5.3; ARC-022 §4; AGENTS.md §10 migration rules"
    evidenceRequired:
      - "migration file + Testcontainers test output"
    testTypes: ["migration", "integration"]

  - id: "AC-07"
    statement: >
      All new/changed BFF code passes the Frontend Tests CI workflow
      (bff job) green on the PR; the web job remains green; secret scans
      pass; no browser-storage OAuth token in any test fixture.
    authorityReferences:
      - "I1-ENG-004 workflow; AGENTS.md §11"
    evidenceRequired:
      - "workflow run reference (green) on the PR"
    testTypes: ["ci"]

tests:
  focusedCommands:
    - ".\\mvnw.cmd -pl apps/bff -am test \"-Dmaven.compiler.release=21\""
    - "docker compose up keycloak (fresh volume) + realm import verification"
    - "Push-Location apps/web; $env:CI='true'; npx ng test; Pop-Location (if web touched)"
  requiredSuites:
    - "BFF integration suite: SEC-P01 §5.4 + SEC-P02 §6.4 test mappings"
    - "CI: Frontend Tests workflow green on the PR (web + bff jobs)"
    - "G3 contract validation green"
  positiveCases:
    - "Full local login flow yields opaque cookie + server-side encrypted
      session + rotated session ID."
    - "CSRF-protected mutation with valid token succeeds."
    - "Back-channel logout with valid token invalidates the local session."
  negativeCases:
    - "Mutation without/with-stale/with-foreign CSRF token fails 403."
    - "Hostile Origin fails 403 ORIGIN_NOT_ALLOWED."
    - "Malformed back-channel logout token rejected."
    - "Refresh after logout fails; stolen pre-rotation session ID fails."
    - "Implicit/ROPC grants disabled at the realm (negative client config)."
  boundaryCases:
    - "Idle expiry boundary (30 min) and absolute expiry boundary (8 h)
      via clock control in tests."
  concurrencyCases: []
  securityCases:
    - "All SEC-P01 §5.4 and SEC-P02 §6.4 test items executed and mapped."
    - "Secret scan: no client secrets, private keys, or token material in
      source, config, fixtures, logs, or evidence."
  contractCases:
    - "G3 validates the extended driver-bff contract + examples + registries."
  migrationCases:
    - "bff_session_db V1 on real PostgreSQL (Testcontainers), fresh +
      repeatable; role separation preserved."
  accessibilityCases: []

