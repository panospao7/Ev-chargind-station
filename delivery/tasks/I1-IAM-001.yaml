schemaVersion: "1.0"

task:
  id: "I1-IAM-001"
  title: "S1-04 slice 1 — Keycloak realm/client bootstrap, BFF opaque session (login/logout), CSRF, and session contract operations (SEC-P01/SEC-P02)"
  initialState: "READY"
  iteration: "I1"
  epic: "EPIC-04"
  releaseWave: "W1"
  sliceApplicability: "W1-S1"
  impactLevel: "L3"
  owner: "Identity/BFF Engineering, Security Review, Project Owner"
  createdAt: "2026-09-13"
  baselineCommit: null

objective: >
  Deliver the first slice of S1-04 driver authentication (GOV-007 §3):
  (1) deterministic Keycloak `ev-local` realm/client bootstrap as a
  version-controlled realm import consumed by the existing compose
  `--import-realm` wiring (SEC-IMP-01: ev-bff confidential client with
  Authorization Code + PKCE and private_key_jwt client authentication;
  svc-* service clients declared; test users per SEC-001 §3; no shared
  secrets in source); (2) BFF login/logout with opaque `__Host-evsession`
  cookie, server-side session store in bff_session_db (encrypted OAuth
  token material, session rotation, idle/absolute expiry, back-channel
  logout handling) per SEC-P01; (3) server-side synchronizer CSRF
  protection per SEC-P02 (GET /api/v1/session/csrf, X-CSRF-TOKEN on
  mutations, Origin validation); (4) driver-bff contract extension for
  session operations (GET /api/v1/session, GET /api/v1/session/csrf,
  POST /api/v1/session/logout) with the SEC-001 §17 security problem
  codes; (5) executable proof evidence for SEC-P01 and SEC-P02 required
  tests. Token exchange (SEC-P03), service identity (SEC-P04) and the
  Account Service profile/registration APIs are explicitly out of scope
  (follow-up tasks I1-IAM-002/I1-IAM-003).

nonGoals:
  - "SEC-P03 target-audience token exchange and SEC-P04 service
    private_key_jwt identity proofs (I1-IAM-002)."
  - "Account Service registration, verification, recovery, profile/vehicle
    APIs and account_db migrations (I1-IAM-003); the session store's
    account binding this slice is the Keycloak subject only."
  - "Angular login screen implementation (follow-up; this slice proves the
    BFF endpoints with integration tests and a minimal browser-level test
    client; web app changes limited to what SEC-P01 browser-storage tests
    require)."
  - "MFA/step-up proof (SEC-P07) and membership revocation (SEC-P06) —
    privileged test users are created per SEC-001 §3 but MFA policy
    enforcement is a later proof."
  - "Rate limiting (SEC-P10), audit sealing (SEC-P11), secret rotation
    proof (SEC-P09 beyond key-ring versioning design)."
  - "GOV-001 register patches (DEC-SEC-26..33) and SEC-001 §20 document
    updates — docs/** is prohibited here; recorded as a required owner
    decision (see humanDecisions)."
  - "keycloak_db wiring for Keycloak's own storage (compose comment defers
    production-like KC_DB; dev-file H2 remains the local profile)."
  - "Operator BFF / platform BFF session flows (driver BFF only)."
  - "Production deployment, TLS termination, real email."

useCases:
  - "DR-07 (sign-in/sign-out/recovery — login/logout and session parts)"
  - "DR-10 (session management — server-side session store and revocation
    foundations)"

