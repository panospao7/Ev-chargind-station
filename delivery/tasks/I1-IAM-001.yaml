invariants:
  - "Browser JavaScript never receives OAuth tokens (AGENTS.md §4; ARC-007 §6.1)."
  - "Current membership and resource ownership are not inferred solely from
    token claims (session store binds Keycloak subject; eligibility
    enforcement arrives with I1-IAM-003)."
  - "Implicit flow and ROPC are prohibited (SEC-001 §5.1)."
  - "No shared client secrets; private_key_jwt for the BFF client (SEC-001
    §4.2); no secret material committed."
  - "Arbitrary Java serialization of sessions is prohibited (SEC-001 §5.3)."
  - "Every behavior change requires appropriate tests (AGENTS.md §10)."
  - "Errors use approved Problem Details and the problem-code registry
    (AGENTS.md §10)."

