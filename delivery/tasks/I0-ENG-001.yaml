schemaVersion: "1.0"

task:
  id: "I0-ENG-001"
  title: "Restore reproducible and enforceable G3 contract validation"
  initialState: "READY"
  iteration: "I0"
  epic: "EPIC-01"
  releaseWave: "W1"
  sliceApplicability: "W1-CROSS-CUTTING"
  impactLevel: "L2"
  owner: "Delivery / Contract Owner"
  createdAt: "2026-07-12"
  baselineCommit: null

objective: >
  Replace mutable and globally installed contract-validation tooling with a
  Node 24 lockfile-backed toolchain, make local and CI validation use the same
  commands, and correct executable-contract defects until the complete G3
  contract gate passes without suppressing approved validation rules.

nonGoals:
  - "Change approved product or domain semantics."
  - "Introduce new service boundaries, lifecycle states or data owners."
  - "Implement application business code."
  - "Create database migrations."
  - "Approve governance status changes."
  - "Generate frontend or Java business implementations."
  - "Deploy any artifact."

