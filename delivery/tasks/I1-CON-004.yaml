schemaVersion: "1.0"

task:
  id: "I1-CON-004"
  title: "AsyncAPI alignment — exchange bindings and channel definitions vs executable registry (close I1-CON-003 drift)"
  initialState: "READY"
  iteration: "I1"
  epic: "EPIC-06"
  releaseWave: "W1"
  sliceApplicability: "W1-S1"
  impactLevel: "L2"
  owner: "Contract Architecture and Project Owner"
  createdAt: "2026-09-12"
  baselineCommit: null

objective: >
  Align contracts/asyncapi/platform-messaging-v1.yaml with the executable
  message registry (contracts/registries/messages-v1.yaml) as the canonical
  authority: fix the exchange bindings (the AsyncAPI currently binds
  station.* channels to exchange "station" while the registry and the
  implemented topology use "ev.domain.v1" and the other registry anchors),
  align channel keys/routing keys with the registry routingKey values, and
  ensure message references resolve to the registered schemaPath targets.
  This closes the drift flagged since I1-CON-003 ("pre-existing asyncapi
  exchange drift") BEFORE Discovery's consumer is built — the consumer will
  bind queues against the real topology, and the AsyncAPI must describe the
  same reality. No business semantics change: event names, payload schemas,
  and producer/consumer assignments are already aligned; this is a
  bindings/channels document correction.

origin: >
  I1-CON-003 flagged the drift (evidence: registry-alignment.md §drift;
  status unresolvedFindings); I1-MSG-001's contract review confirmed the
  code correctly follows the registry and the AsyncAPI is the stale side
  ("MINOR — must be closed before any consumer is built against the AsyncAPI
  bindings"). Owner approved closing it before I1-DSC-001 (interactive
  session decision 2026-09-12).

