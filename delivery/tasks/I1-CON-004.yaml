acceptanceCriteria:
  - id: "AC-01"
    statement: >
      Every channel in platform-messaging-v1.yaml binds to the exchange named
      by the registry for that message (ev.domain.v1 for the Station
      Operations domain events; the other registry anchors for their
      families); no channel binds to an exchange name absent from the
      registry.
    authorityReferences:
      - "messages-v1.yaml (authority); I1-CON-003 drift record"
    evidenceRequired:
      - "G3 AsyncAPI + registry consistency validation output"
    testTypes: ["contract"]

  - id: "AC-02"
    statement: >
      Channel routing keys / operation ids match the registry routingKey
      values (e.g. station.published, station.updated, station.status-changed,
      station.evse-configuration-changed, station.tariff-published); message
      $refs resolve to the registered schemaPath targets.
    authorityReferences:
      - "messages-v1.yaml (authority)"
    evidenceRequired:
      - "validation output; cross-check listing"
    testTypes: ["contract"]

  - id: "AC-03"
    statement: >
      npm run contracts:verify passes fully (AsyncAPI validation, registry
      consistency, schemas, privacy/secret scans, docs consistency) — the
      previously-flagged drift finding is no longer reported.
    authorityReferences:
      - "ARC-022 §19; G3 definition"
    evidenceRequired:
      - "full G3 output with exit 0"
    testTypes: ["contract", "ci"]

