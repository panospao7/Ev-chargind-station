    - "apps/web/package.json"
    - "apps/web/package-lock.json"
    - "apps/web/src/app/features/discovery/map/maplibre.adapter.ts"
    - "delivery/handoffs/I1-ENG-004/**"
    - "delivery/evidence/I1-ENG-004/**"
    - "delivery/deviations/I1-ENG-004/**"

  prohibitedFiles:
