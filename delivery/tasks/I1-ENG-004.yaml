  requiredCommitSha: true
  requiredRunReference: true

assumptions:
  - "ng test under @angular/build:unit-test uses vitest+jsdom and requires
    no browser in CI (proven locally; axe color-contrast already disabled
    for jsdom)."
  - "The maplibre adapter's dynamic import + structural typing insulates
    compile-time compatibility; v6 API surface used (Map, Marker,
    fitBounds, jumpTo, getBounds, on, raster style, attributionControl) is
    expected stable across the major bump — verified by suite+build."
  - "If a CI-only BFF failure appears that requires a BFF source change,
    the task enters FIX_REQUIRED with a scope amendment rather than
    expanding allowedFiles silently."
  - "Dev-only dependency advisories are recorded if present but do not
    block the gate this slice (non-goal)."

openQuestions: []

recordedDecisions:
  - "Dependency audit during ENG-004 planning (2026-09-13) found CRITICAL
    GHSA-jrc7-96c5-q579 in maplibre-gl 5.24.0 (CVSS 10.0, XSS sanitizer
    bypass, affects <=6.4.0). Owner chose option (a): fold the upgrade to
    ^6.9.0 into I1-ENG-004 so the new audit gate lands green in the same
    change (interactive session, 2026-09-13)."
  - "Owner approval of the maplibre-gl 6.x upgrade supersedes the ADR-016
    5.24.x pin (its rationale — v6 pre-release status — is obsolete; v6 GA
