securityPrivacy:
  affected: true
  threatChanges:
    - "Remediates a CRITICAL known XSS advisory (GHSA-jrc7-96c5-q579,
      CVSS 10.0) in a production browser dependency. Our code does not use
      the vulnerable DOM.sanitize() path (grep: no popup/setHTML/innerHTML/
      DomSanitizer usage in apps/web/src/app), but the dependency upgrade
      eliminates the exposure class. Adds a CI gate preventing
      high/critical production-dependency advisories from merging."
  dataClassifications: []
  authorizationPolicies: []
  rateLimitPolicies: []
  auditRequirements: []
  prohibitedData: []

