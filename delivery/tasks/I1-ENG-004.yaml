    - "docs/**"
    - "services/**"
    - "simulator/**"
    - "infra/**"
    - "scripts/**"
    - "libraries/**"
    - "AGENTS.md"
    - "package.json"
    - "package-lock.json"
    - "apps/bff/**"
    - "apps/web/src/** (except the single adapter file listed in allowedFiles)"
    - "delivery/status.yaml"
    - "delivery/tasks/**"
    - "delivery/backlog.yaml"
    - "delivery/iterations/**"
    - ".github/workflows/service-tests.yml"
    - ".github/workflows/db-migrations.yml"
    - ".github/workflows/g3-contract-validation.yml"

  maximumExpectedDiff: >
    Bounded: one new workflow (~80 lines, read-only permissions, pinned
    SHAs), a maplibre-gl version bump in package.json + regenerated
    package-lock.json, and at most small compatibility adjustments in the
    single maplibre adapter file. No product logic changes, no contract
    changes, no new dependencies beyond the maplibre-gl upgrade itself.

  generatedFilesPolicy: >
    package-lock.json is regenerated by npm install (lockfile-backed,
    reproducible); the workflow is hand-edited.

acceptanceCriteria:
  - id: "AC-01"
    statement: >
      A new frontend-tests workflow triggers on changes to apps/web/** and
      apps/bff/** and executes the web unit suite green
      (CI=true npx ng test, Node 24 from .nvmrc, npm ci from
      apps/web/package-lock.json) on this PR.
    authorityReferences:
      - "CI/CD doc Stage 5; local/CI parity (foundation doc 10.3)"
    evidenceRequired:
      - "workflow run reference (green web job) on this PR"
    testTypes: ["ci"]

  - id: "AC-02"
    statement: >
      The same workflow executes the web production build green
      (npx ng build) with the configured bundle budgets enforced
      (initial 500kB warning / 1MB error; anyComponentStyle 4kB/8kB).
    authorityReferences:
      - "CI/CD doc Stage 5 (bundle-budget checks)"
    evidenceRequired:
      - "workflow run reference (green build step)"
    testTypes: ["ci"]

  - id: "AC-03"
    statement: >
      The same workflow executes the BFF Maven test suite green on JDK 25
      (./mvnw -pl apps/bff -am test) with no BFF source changes.
    authorityReferences:
      - "Foundation doc 10.1 stage 4 (Java compilation and tests)"
    evidenceRequired:
      - "workflow run reference (green bff job)"
    testTypes: ["ci"]

  - id: "AC-04"
    statement: >
      A production-dependency audit gate runs in the same workflow
      (npm audit --omit=dev --audit-level=high in apps/web) and is green
      after the maplibre-gl upgrade. The pre-upgrade finding (CRITICAL
      GHSA-jrc7-96c5-q579 on maplibre-gl 5.24.0, CVSS 10.0) is recorded in
      the evidence file with the audit output summary.
    authorityReferences:
      - "CI/CD doc Stage 7 (dependency vulnerability scan); AGENTS.md §11"
    evidenceRequired:
      - "workflow run reference (green audit step) + pre-upgrade finding
        record in the evidence file"
    testTypes: ["ci", "security"]

  - id: "AC-05"
    statement: >
      maplibre-gl is upgraded to ^6.9.0 in apps/web (owner-approved
      supersession of the ADR-016 5.24.x pin, whose v6-pre-release
      rationale is obsolete); the web suite (44/44) and production build
      remain green locally, and the map adapter requires at most minimal
      adjustments within its allowed file. Any adapter API change is
      documented in the evidence file.
    authorityReferences:
      - "ADR-016 (superseded pin); ARC-016 §8 (dependency change requires
        human confirmation — granted via planning-PR merge)"
    evidenceRequired:
      - "local suite + build output; lockfile diff; adapter diff (or
        no-change note)"
    testTypes: ["unit", "build"]

  - id: "AC-06"
    statement: >
      No existing workflow, workflow permission, secret, or runner surface
      is changed; the new workflow grants contents: read only, pins all
      external Actions to full commit SHAs (reusing the SHAs already
      pinned in this repository's workflows), and configures no secrets.
    authorityReferences:
      - "CI/CD doc 10.2 CI security rules; ARC-016 §8"
    evidenceRequired:
      - "diff review in the evidence file"
    testTypes: ["review", "security"]

tests:
  focusedCommands:
    - "Push-Location apps/web; $env:CI='true'; npx ng test; Pop-Location"
    - "Push-Location apps/web; npx ng build; Pop-Location"
    - "Push-Location apps/web; npm audit --omit=dev --audit-level=high; Pop-Location"
    - ".\\mvnw.cmd -pl apps/bff -am test \"-Dmaven.compiler.release=21\""
  requiredSuites:
    - "CI: frontend-tests workflow green on this PR (web + bff jobs, audit step)"
  positiveCases:
    - "Web unit suite green in CI on Node 24 (44/44 baseline)."
    - "BFF suite green in CI on JDK 25 (9/9 baseline)."
    - "Audit gate green after maplibre-gl ^6.9.0 upgrade."
  negativeCases:
    - "Audit gate demonstrably fails on the pre-upgrade lockfile
      (recorded evidence of the critical finding blocking the gate)."
  boundaryCases: []
  concurrencyCases: []
  securityCases:
    - "GHSA-jrc7-96c5-q579 remediation verified: lockfile resolves
      maplibre-gl >= 6.4.1; no sanitizer/popup APIs introduced."
    - "No workflow permission/secret changes; secret scan green."
  contractCases: []
  migrationCases: []
  accessibilityCases: []

