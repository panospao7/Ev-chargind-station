schemaVersion: "1.0"

task:
  id: "I1-ENG-004"
  title: "Frontend CI — apps/** workflow (web vitest+build, BFF tests), dependency-audit gate, and maplibre-gl critical-vulnerability upgrade"
  initialState: "READY"
  iteration: "I1"
  epic: "EPIC-01"
  releaseWave: "W1"
  sliceApplicability: "W1-S1"
  impactLevel: "L2"
  owner: "Delivery Engineering and Project Owner"
  createdAt: "2026-09-13"
  baselineCommit: null

objective: >
  Close the last CI coverage gap disclosed at I1-APP-001 closeout: no
  workflow covers apps/**, so web and BFF changes ship on local evidence
  only. Add a frontend-tests GitHub Actions workflow that (1) runs the web
  unit suite (CI=true npx ng test, vitest/jsdom, Node 24) and the web
  production build (bundle budgets enforced), (2) runs the BFF Maven test
  suite on JDK 25, and (3) runs a production-dependency audit gate
  (npm audit --omit=dev, fail on high/critical). The audit gate currently
  fails: apps/web depends on maplibre-gl 5.24.0 with CRITICAL
  GHSA-jrc7-96c5-q579 (XSS sanitizer bypass in DOM.sanitize(), CWE-79,
  CVSS 10.0, affects <=6.4.0, fixed in 6.4.1). Upgrade maplibre-gl to
  ^6.9.0 (latest stable; 6.x reached GA 2026-07-22, superseding ADR-016's
  5.24.x pin which existed because v6 was pre-release at approval time),
  so the new gate lands green in the same change and every future UI
  change is machine-verified.

nonGoals:
  - "Full EPIC-02 pipeline: CodeQL, SBOM, container scanning, image
    signing/provenance, GHCR publication, promotion mechanism."
  - "Root ci/required aggregation job (EPIC-02)."
  - "Lint/format stage for apps/web (no eslint/prettier config exists yet;
    introducing linters is separate scope)."
  - "ADR-016 document text update (docs/** prohibited here) — recorded as a
    follow-up backlog item."
  - "API-client generation (POC-02 / EPIC-06 scope)."
  - "Playwright/E2E harness and visual-contrast automation (UI-foundation
    follow-up)."
  - "Dev-dependency audit enforcement (gate scope is production deps via
    --omit=dev; dev-only advisories are tracked, not gated, this slice)."
  - "Any BFF or web product-code change beyond the maplibre adapter
    compatibility surface."

useCases:
  - "Enabling infrastructure for all frontend tasks; no direct use-case
    behavior."

authority:
  governance:
    - path: "docs/08_delivery_and_ai_agents/01_cicd_repository_organization_v1.0.md"
      section: "Stage 5 - Frontend (npm ci, Angular compile, unit/component tests, bundle-budget checks); Stage 7 - Security (dependency review/vulnerability scan); 10.2 CI security rules"
    - path: "docs/08_delivery_and_ai_agents/04_local_engineering_foundation_v1.0.md"
      section: "10.1 required pull-request stages (5 frontend compilation/tests, 10 secret and dependency scanning); 10.3 local/CI parity"
  requirements: []
  domain: []
  architecture:
    - path: "docs/05_architecture/08_technology_selection_adr_set_v1.0.md"
      section: "ADR-016 Mapping (MapLibre GL JS 5.24.x pin; v6 deferral rationale now obsolete — supersession approved via this packet's planning PR)"
    - path: "docs/05_architecture/17_w1_frontend_ux_implementation_contract_v1.0.md"
      section: "frontend verification expectations (unit/component tests, accessibility checks)"
  contracts: []

invariants:
  - "CI gates cannot be weakened to obtain green runs (AGENTS.md §11)."
  - "Every behavior change requires appropriate tests (AGENTS.md §10)."
  - "Workflow permissions default to none; jobs grant only required
    permissions; external Actions pinned to full commit SHAs (CI/CD doc
    10.2)."

