  modules:
    - "root build files (pom.xml, mvnw, .mvn/, .editorconfig, .gitattributes)"
    - "services/<seven canonical services> — skeleton modules only"
    - "apps/web, apps/bff — skeleton workspaces only"
    - "libraries/correlation, libraries/secure-logging, libraries/event-envelope, libraries/test-support — module skeletons only"
    - "simulator/charger-simulator — skeleton only"
    - "infra/local (compose files, service config dirs, .env.example)"
    - "scripts/dev, scripts/db (skeleton)"
    - "tests/ directory skeleton"
    - "release-manifests/ (image digest record)"
  tables: []
  projections: []
  migrations: []
  apiOperations: []
  commands: []
  events: []
  schemas: []
  registries: []
  screens: []
  infrastructure:
    - "infra/local/compose.yaml — core profile: PostgreSQL 18, RabbitMQ 4.3, Keycloak 26.6, Mailpit-compatible catcher; loopback-only host bindings per ENG-001 §6.2"
    - "infra/local/compose.observability.yaml — stub only (PROVISIONAL profile, not required for acceptance)"

dependencies:
  tasks:
    - "I0-DEL-001, I0-ENG-001, I0-CON-002 (all VERIFIED on main 32cac0d0)"
  contracts: []
  infrastructure:
    - "Docker engine available locally"
    - "Node 24 LTS (existing .nvmrc/engines)"
    - "JDK 25 and Maven via wrapper (no global install)"
  humanDecisions: []

blockers: []

scope:
  allowedFiles:
    - "pom.xml"
    - "mvnw"
    - "mvnw.cmd"
    - ".mvn/**"
    - ".editorconfig"
    - ".gitattributes"
    - "README.md"
    - "package.json"
    - "package-lock.json"
    - "services/**"
    - "apps/**"
    - "libraries/**"
    - "simulator/**"
    - "infra/local/**"
    - "scripts/dev/**"
    - "scripts/db/**"
    - "tests/**"
    - "release-manifests/**"
    - "delivery/handoffs/I1-ENG-001/**"
    - "delivery/evidence/I1-ENG-001/**"
    - "delivery/deviations/I1-ENG-001/**"

  prohibitedFiles:
    - "contracts/**"
    - "docs/**"
    - "scripts/contracts/**"
    - "scripts/delivery/**"
    - ".github/**"
    - "AGENTS.md"
    - ".nvmrc"
    - "delivery/status.yaml"
    - "delivery/tasks/**"
    - "delivery/backlog.yaml"
    - "delivery/iterations/**"

  maximumExpectedDiff: >
    Large in file count (module skeletons across seven services, two apps,
    four libraries, simulator, infra) but shallow per file: build files,
    health/readiness endpoint stubs where compose checks require them,
    configuration, compose definitions, one Testcontainers smoke test class,
    documentation. No business logic, no contract edits, no migrations.
    Skeleton service modules must not contain domain code.

  generatedFilesPolicy: >
    Maven wrapper binaries are generated tooling committed per convention;
    everything else is hand-authored. Generated contract clients do not yet
    exist and must not be introduced here.

acceptanceCriteria:
  - id: "AC-01"
    statement: >
      The canonical repository structure exists exactly as ENG-001 §4 defines
      it (directory names and ownership rules §4.1); a fresh clone builds the
      Java modules with ./mvnw and installs workspace npm dependencies with
      npm ci, without global packages or absolute paths.
    authorityReferences:
      - "ENG-001 doc §2, §4"
    evidenceRequired:
      - "clean-clone build transcript"
    testTypes: ["build"]

  - id: "AC-02"
    statement: >
      The compose core profile starts PostgreSQL 18, RabbitMQ 4.3, Keycloak
      26.6 and a Mailpit-compatible catcher on loopback-only bindings, with
      every image pinned by digest (no mutable latest tags) and healthchecks
      green; recorded image versions/digests appear in the implementation
      commit (release-manifests).
    authorityReferences:
      - "ENG-001 doc §3, §6.1–6.6"
    evidenceRequired:
      - "docker compose ps and healthcheck output"
      - "release-manifests digest record"
    testTypes: ["integration"]

  - id: "AC-03"
    statement: >
      A Testcontainers smoke test in libraries/test-support starts real
      PostgreSQL 18 and RabbitMQ 4.3 containers and passes locally,
      demonstrating the M1 Testcontainers criterion.
    authorityReferences:
      - "ARC-015 §4 M1 exit criteria"
    evidenceRequired:
      - "test run output"
    testTypes: ["integration"]

  - id: "AC-04"
    statement: >
      The existing G3 gate and delivery control plane are unaffected:
      npm run contracts:verify fully green, delivery validators green, from
      the candidate commit.
    authorityReferences:
      - "ARC-022 §13 CI is green from a clean checkout"
    evidenceRequired:
      - "npm run contracts:verify output"
      - "node scripts/delivery/validate.mjs output"
    testTypes: ["contract", "ci"]

  - id: "AC-05"
    statement: >
      No secrets: infra/local/.env.example contains placeholders only; local
      Keycloak realm/dev credentials are documented dev-only values, not
      production secrets; secret and privacy scans green.
    authorityReferences:
      - "AGENTS.md §4 (secrets invariant); ENG-001 doc §6"
    evidenceRequired:
      - "npm run contracts:secrets output"
    testTypes: ["security"]

tests:
  focusedCommands:
    - "./mvnw -q -DskipTests package"
    - "docker compose -f infra/local/compose.yaml up -d && docker compose -f infra/local/compose.yaml ps"
  requiredSuites:
    - "./mvnw test (skeleton + smoke)"
    - "npm run contracts:verify"
    - "node scripts/delivery/self-test.mjs"
    - "npm run contracts:secrets"
    - "git diff --check"
  positiveCases:
    - "Fresh clone → build → compose up → smoke test passes."
  negativeCases:
    - "compose up on a machine without Docker fails with an actionable message (documented, not silently swallowed)."
  boundaryCases: []
  concurrencyCases: []
  securityCases:
    - "Secret scan green; no credential material in compose/env/realm files beyond documented dev-only values."
  contractCases: []
  migrationCases: []
  accessibilityCases: []

persistence:
  affected: false

contracts:
