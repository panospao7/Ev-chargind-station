schemaVersion: "1.0"

task:
  id: "I1-ENG-001"
  title: "Repository and developer runway — canonical monorepo structure and local environment"
  initialState: "READY"
  iteration: "I1"
  epic: "EPIC-01"
  releaseWave: "W1"
  sliceApplicability: "W1-S1"
  impactLevel: "L1"
  owner: "Delivery Lead / Project Owner"
  createdAt: "2026-09-10"
  baselineCommit: null

objective: >
  Create the canonical monorepo implementation structure (ENG-001 §4) with the
  approved technology baselines (ENG-001 §3), the local Docker Compose core
  profile (ENG-001 §6), a Testcontainers smoke proof for PostgreSQL 18 and
  RabbitMQ 4.3, and the developer-facing commands and troubleshooting
  documentation — so that a fresh clone can run checks, start local
  dependencies, validate contracts, and run tests without global packages,
  absolute paths, shared databases, or secrets. No business behavior, no
  contracts, no migrations.

origin: >
  Owner direction 2026-09-10 ("let's begin w1-s1") following the orchestrator
  proposal to start the W1-S1 planning pass. This packet completes the
  ARC-015 M1 milestone remainder left open by iteration I0.

requirements:
  - "None implemented directly — this task is enabling infrastructure. It
    unblocks every FR-PLT-* platform requirement and all W1-S1 functional
    requirements; no functional behavior changes."

useCases:
  - "None directly; enables UC-DR-001..008 downstream."

authority:
  governance:
    - path: "docs/00_governance/07_w1_baseline_and_first_vertical_slice_v1.0.md"
      section: "§3 S1-11 operational foundation; §7 W1 blocking rule"
  requirements:
    - path: "docs/01_scope_and_requirements/04_functional_requirements_and_traceability_v1.1.md"
      section: "W1 platform requirements (enabling context)"
  domain: []
  architecture:
    - path: "docs/08_delivery_and_ai_agents/04_local_engineering_foundation_v1.0.md"
      section: "§2 completion target, §3 baseline decisions, §4 canonical structure and ownership rules, §5 coding standards, §6 local Docker Compose environment, §7 profiles, §8 canonical developer commands, §9 logging and telemetry policy"
    - path: "docs/08_delivery_and_ai_agents/02_implementation_epics_dependency_roadmap_v1.0.md"
      section: "§4 M1 exit criteria, EPIC-01 deliverables and acceptance"
  contracts:
    - path: "contracts/"
      identifiers:
        - "read-only: existing G3 gate must remain green"

