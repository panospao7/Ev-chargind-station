invariants:
  - "Internal APIs reject public/user tokens lacking the service audience
    (ARC-003)."
  - "No shared service credentials; unique asymmetric key pair per service
    (SEC-001 §8.1)."
  - "Exchanged tokens are audience-limited; a broad multi-audience token is
    never issued (SEC-001 §7.3)."
  - "Exchanged tokens are cached only within the originating BFF session
    and only until shortly before expiry (SEC-001 §7.2)."
  - "A revoked BFF session cannot refresh or exchange (SEC-001 §7.3)."
  - "Browser JavaScript never receives downstream service tokens (AGENTS.md
    §4)."
  - "No secret material committed; dev keys generated per documented
    procedure (I1-IAM-001 convention)."

