acceptanceCriteria:
  - id: "AC-01"
    statement: >
      The BFF exchanges a user session token for an audience-limited
      downstream token via Keycloak Standard Token Exchange V2: exchange
      per target service, response token carries the human subject, acr,
      authentication time, exactly the intended target audience, BFF as
      authorized party, approved scopes only, short expiry, token type;
      no refresh material.
    authorityReferences:
      - "SEC-001 §7.1-§7.2"
    evidenceRequired:
      - "integration test evidence (Testcontainers Keycloak) with token
        claim assertions (redacted)"
    testTypes: ["integration", "security"]

  - id: "AC-02"
    statement: >
      All SEC-001 §7.3 negative proofs pass: Account token rejected by
      Booking-equivalent (audience isolation between the two existing
      services), unsupported audience exchange fails, scope escalation
      fails, exchange by an unauthorized client fails, expired subject
      token fails, revoked BFF session cannot exchange, no broad
      multi-audience token issued, ID Token rejected as API token.
    authorityReferences:
      - "SEC-001 §7.3"
    evidenceRequired:
      - "negative test matrix mapped to §7.3 items"
    testTypes: ["integration", "security"]

  - id: "AC-03"
    statement: >
      Exchanged tokens are cached only within the originating BFF session
      (session-scoped, encrypted at rest with the session key ring, bound
      to the session row) and only until shortly before expiry; a revoked
      session's cache is unusable; the cache never persists beyond the
      session row.
    authorityReferences:
      - "SEC-001 §7.2; AGENTS.md §4"
    evidenceRequired:
      - "cache lifecycle test evidence"
    testTypes: ["integration"]

  - id: "AC-04"
    statement: >
      Each existing service (Discovery & Insights, Station Operations)
      validates internal-API bearer tokens per SEC-001 §8.3: signature,
      allowlisted algorithm, issuer, audience (its own svc-* audience
      only), expiry, nbf, token type, calling client, required scope;
      public/user tokens lacking the service audience are rejected 401;
      wrong-audience tokens from the other service are rejected 401.
    authorityReferences:
      - "SEC-001 §8.3; ARC-003 (internal APIs reject tokens lacking service
        audience)"
    evidenceRequired:
      - "resource-server test evidence per service (positive + negative)"
    testTypes: ["integration", "security"]

  - id: "AC-05"
    statement: >
      Service identities: each service client uses Client Credentials with
      private_key_jwt, unique key pair, ≤60s assertion, unique jti,
      5-minute access tokens; realm config enforces the assertion
      constraints of SEC-001 §8.2 (wrong audience/client, expired,
      excessive lifetime, duplicate jti, unapproved algorithm, unknown
      kid, invalid signature → rejection); no shared credentials.
    authorityReferences:
      - "SEC-001 §8.1-§8.2"
    evidenceRequired:
      - "client-credentials test evidence + realm config assertions"
    testTypes: ["integration", "security"]

  - id: "AC-06"
    statement: >
      The realm import finalizes svc-* clients: real JWKS references or
      documented dev-key procedure, service-account roles, audience
      mappers, token-exchange permissions (BFF may exchange for each svc-*
      audience; other clients may not), consistent with SEC-001 §4.2.
    authorityReferences:
      - "SEC-001 §4.2, §7.1"
    evidenceRequired:
      - "realm config assertions via Admin REST (fresh import demo)"
    testTypes: ["configuration", "integration"]

  - id: "AC-07"
    statement: >
      Problem codes TOKEN_AUDIENCE_INVALID (401) and INSUFFICIENT_SCOPE
      (403) are registered and emitted by the resource-server validation;
      TOKEN_INVALID registry comment updated to reflect actual emission;
      contracts:verify green; full CI green on the PR.
    authorityReferences:
      - "SEC-001 §17; AGENTS.md §10"
    evidenceRequired:
      - "registry diff + G3 green + CI run reference"
    testTypes: ["contract", "ci"]

