schemaVersion: "1.0"

task:
  id: "I1-IAM-002"
  title: "S1-04 slice 2 — Standard Token Exchange (SEC-P03) and service private_key_jwt identity with resource-server validation (SEC-P04)"
  initialState: "READY"
  iteration: "I1"
  epic: "EPIC-04"
  releaseWave: "W1"
  sliceApplicability: "W1-S1"
  impactLevel: "L3"
  owner: "Identity/BFF Engineering, Service Owners, Security Review, Project Owner"
  createdAt: "2026-09-14"
  baselineCommit: null

objective: >
  Deliver the second slice of S1-04: the BFF-to-service and
  service-to-service identity layer. (1) SEC-P03 (SEC-IMP-04): the BFF
  exchanges a user session token for an audience-limited downstream token
  via Keycloak Standard Token Exchange V2 — one exchange per target
  service, exchanged tokens cached only within the originating BFF session
  until shortly before expiry, subject/acr/auth-time preserved, no
  multi-audience or over-scoped tokens; all §7.3 negative proofs executed
  (cross-service rejection, unsupported audience, scope escalation,
  unauthorized client, expired subject token, revoked-session exchange
  failure, no broad tokens, ID-token-as-API-token rejection). (2) SEC-P04
  (SEC-IMP-05): each service gets a unique private_key_jwt client-credentials
  identity (unique key pair, ≤60s assertion, unique jti, 5-minute access
  tokens) and implements resource-server validation per §8.3 (signature,
  algorithm allowlist, issuer, audience, expiry, nbf, token type, calling
  client, required scope) in the two existing services' internal APIs
  (Discovery & Insights internal API, Station Operations internal API).
  Realm config for svc-* clients is finalized (real JWKS, service-account
  roles/scopes, audience mappers, exchange permissions). This closes the
  identity prerequisites for the S2 booking spine.

nonGoals:
  - "Delegated Action JWS profile (SEC-IMP-06) and authorization registry
    (SEC-IMP-07) — later slices."
  - "Account Service implementation (does not exist yet; its resource-server
    validation lands with I1-IAM-003/S2 account work)."
  - "Membership-revocation proof (SEC-IMP-08) and MFA/step-up (SEC-IMP-09)."
  - "Key rotation proof (SEC-IMP-10) beyond the versioned key-ring design
    already in place."
  - "Rate limiting (SEC-IMP-11), audit sealing (SEC-IMP-12), security CI
    gates (SEC-IMP-13) — separate work packages."
  - "mTLS between services (transport layer is deployment-stage; message-
    level bearer validation is in scope per the internal contracts)."
  - "Frontend UI changes (no login screen yet — I1-IAM-003)."
  - "GOV-001 register patches (DEC-SEC-26..33) — the owner-approved docs
    task remains separate."
  - "Booking/Session service (does not exist yet)."

useCases:
  - "Enabling infrastructure for S1-04/S2 authorization; no direct
    use-case behavior."

