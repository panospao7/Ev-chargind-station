assumptions:
  - "Keycloak 26.6 supports Standard Token Exchange V2 with realm-level
    exchange policies configurable via realm import (admin console
    policy objects); if import cannot express the required exchange
    permission model deterministically, STOP and report (same rule as
    I1-IAM-001)."
  - "Spring Security OAuth2 Resource Server supports the §8.3 validation
    set with NimbusJwtDecoder + issuer/audience/scope validators."
  - "The exchanged-token cache rides the existing session row
    (security_event_metadata jsonb or a new encrypted column via a NEW
    migration if the packet's no-migration constraint conflicts with a
    clean design — prefer jsonb metadata reuse; if a migration is truly
    required, STOP and request scope amendment)."
