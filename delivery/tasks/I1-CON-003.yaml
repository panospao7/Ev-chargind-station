    - "contracts/registries/messages-v1.yaml"
    - "contracts/schemas/events/**"
    - "contracts/asyncapi/**"
    - "contracts/examples/**"
    - "delivery/handoffs/I1-CON-003/**"
    - "delivery/evidence/I1-CON-003/**"
    - "delivery/deviations/I1-CON-003/**"

