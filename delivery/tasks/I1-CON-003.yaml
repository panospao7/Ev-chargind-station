schemaVersion: "1.0"

task:
  id: "I1-CON-003"
  title: "Align executable message registry with ARC-020 W1 Station Operations event catalogue"
  initialState: "READY"
  iteration: "I1"
  epic: "EPIC-06"
  releaseWave: "W1"
  sliceApplicability: "W1-S1"
  impactLevel: "L2"
  owner: "Delivery / Contract Owner"
  createdAt: "2026-09-11"
  baselineCommit: null

objective: >
  Close the discovered gap between ARC-020's approved W1 catalogue and the
  executable message registry: add the missing W1 Station Operations event
  family (StationPublished, StationUpdated, StationStatusChanged,
  EVSEConfigurationChanged, EVSEAdministrativeStateChanged,
  ConnectorConfigurationChanged, TariffPublished, TariffRetired,
  BookingPolicyChanged, OperatorOrganizationCreated,
  OperatorOrganizationStatusChanged — ARC-020 §6 lines 160–172, all "Release
  applicability: W1") to contracts/registries/messages-v1.yaml, author each
  JSON Schema 2020-12 payload they reference, and declare the corresponding
  AsyncAPI channels — so the registry mirrors ARC-020 exactly (its own
  header rule) and the I1-MSG-001 messaging task can publish
  StationPublished from the S1-01 seed. No semantics may be invented beyond
  ARC-020/DOM-002: payload fields derive from the catalogue, the DOM-002
  lifecycle transitions and the seeded domain columns; genuine gaps stop
  with CLARIFICATION_REQUIRED.

origin: >
  OQ-I1-D1 (raised 2026-09-11 during I1-MSG-001 scoping): Discovery's
  reference-data source was undefined — no station-metadata event existed in
  the executable registry while cross-service reads are prohibited. Owner
  selected option (a) on 2026-09-11 ("i guess option a"); investigation then
  showed ARC-020 already defines the W1 Station Operations event family, so
  this is an executable-registry ALIGNMENT, not a catalogue amendment.

requirements:
  - "FR-OPS-02 / FR-SIM-01 (enabling context); GOV-007 §3 S1-01/S1-02
    (seeded stations become discoverable via published reference events)."

useCases:
  - "Enables UC-DR-001..002 (discovery) downstream; no use case changes."

authority:
  governance:
    - path: "docs/00_governance/01_decision_and_open_question_register_v1.0.md"
      section: "owner option-(a) decision 2026-09-11 recorded via this packet's approval (mirrors DEC-W1 series)"
  requirements:
    - path: "docs/01_scope_and_requirements/04_functional_requirements_and_traceability_v1.1.md"
      section: "W1 wave tags for FR-OPS-02/FR-SIM-01 context"
  domain:
    - path: "docs/03_domain/02_lifecycle_and_invariant_catalogue_v1.0.md"
      section: "STATION, EVSE_ADMINISTRATION, OPERATOR_ORGANIZATION transitions (event payloads reflect state changes)"
  architecture:
    - path: "docs/05_architecture/14_domain_events_and_async_contracts_v1.0.md"
      section: "§6 catalogue lines 160–172 (the eleven W1 events), §7 envelope rules, §8 payload table conventions, §9 service exchange/consumer matrix (line 319)"
    - path: "docs/05_architecture/16_w1_persistence_and_contract_finalization_v1.0.md"
      section: "§1 (no W1 message approved without owning service, persistence effect, verification test), registries header rules"
  contracts:
    - path: "contracts/registries/messages-v1.yaml"
      identifiers: ["mirrors ARC-020 exactly; header rule"]
    - path: "contracts/asyncapi/platform-messaging-v1.yaml"
      identifiers: ["channel declarations for added messages"]
    - path: "contracts/schemas/events/"
      identifiers: ["JSON Schema 2020-12 payloads for each added event"]

invariants:
  - "Registries mirror ARC-020/DOM-002 — they never invent events, types, or
    semantics (I0-CON-002 precedent, AGENTS.md §2)."
  - "Every message is registered once with a single HTTP/protocol meaning;
    namespaces stay com.evplatform (ARC-022 §19 items 10–12)."
  - "No account, driver, vehicle or subject identifiers in Discovery-routed
    payloads (AGENTS.md §4; ARC-020 §9 line 319)."
  - "CloudEvents 1.0 envelope per contracts/schemas/common/cloud-event.json."

ownership:
  owningService: "Delivery / Contract Tooling"
  dataOwner: "Not applicable"
  supportingServices:
    - "station-operations-service (producer of the added events)"
    - "discovery-insights-service (consumer)"
  prohibitedOwners:
    - "Browser runtime"

affectedArtifacts:
  services: []
  modules:
    - "contracts/registries"
    - "contracts/schemas/events"
    - "contracts/asyncapi"
  tables: []
  projections: []
  migrations: []
  apiOperations: []
  commands: []
  events:
    - "StationPublished, StationUpdated, StationStatusChanged, EVSEConfigurationChanged, EVSEAdministrativeStateChanged, ConnectorConfigurationChanged, TariffPublished, TariffRetired, BookingPolicyChanged, OperatorOrganizationCreated, OperatorOrganizationStatusChanged (all W1, producer station-operations-service, consumer discovery-insights-service unless ARC-020 §9 states otherwise)"
  schemas:
    - "One JSON Schema 2020-12 payload per added event under contracts/schemas/events/"
  registries:
    - "messages-v1.yaml"
  screens: []
  infrastructure: []

dependencies:
  tasks:
    - "I0-CON-002 (VERIFIED — registry/schema/asyncapi toolchain)"
    - "I1-STA-001 (VERIFIED — the seeded aggregates these events describe)"
  contracts: []
  infrastructure:
