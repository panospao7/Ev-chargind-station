    - "infra/**"
    - "scripts/**"
    - "AGENTS.md"
    - "package.json"
    - "package-lock.json"
    - "delivery/status.yaml"
    - "delivery/tasks/**"
    - "delivery/backlog.yaml"
    - "delivery/iterations/**"

  maximumExpectedDiff: >
    Eleven registry entries, ~11 event schemas, matching AsyncAPI channels,
    example payloads. Payload fields limited to ARC-020 catalogue data,
    DOM-002 transition facts and seeded STA columns (public_ref, display
    metadata, coordinates, connector summaries, lifecycle state). If a
    payload needs a field no authoritative document defines, stop with
    CLARIFICATION_REQUIRED.

  generatedFilesPolicy: >
    Hand-authored contract artifacts (authoritative); never edit generated
    output.

acceptanceCriteria:
  - id: "AC-01"
    statement: >
      messages-v1.yaml contains all eleven ARC-020 §6 W1 Station Operations
      events with producer station-operations-service, the approved
      exchange/routing conventions, correct consumers per ARC-020 §9, and a
      cross-check table (ARC-020 line → registry entry) recorded as evidence;
      no other registry content changes.
    authorityReferences:
      - "ARC-020 §6 lines 160–172, §9 line 319; registry header rules"
    evidenceRequired:
      - "cross-check table in evidence"
      - "contracts:registries output"
    testTypes: ["contract", "semantic-review"]

  - id: "AC-02"
    statement: >
      Every new schemaPath target exists as a JSON Schema 2020-12 document
      that compiles with contracts:schemas; envelopes validate against
      contracts/schemas/common/cloud-event.json; examples (one per event,
      derived from the S1-01 seed fixture) validate against their schemas.
    authorityReferences:
      - "ARC-022 §19 items 9, 15; ARC-018 §8"
    evidenceRequired:
      - "contracts:schemas output; example validation output"
    testTypes: ["contract", "schema"]

  - id: "AC-03"
    statement: >
      AsyncAPI declares channels/operations for the added messages consistent
      with the registry (exchange/routing key/message name); contracts:openapi,
      contracts:asyncapi and contracts:registries all green.
    authorityReferences:
      - "ARC-018 §8; ARC-022 §19 items 8–9, 11"
    evidenceRequired:
      - "contracts:asyncapi output"
    testTypes: ["contract"]

  - id: "AC-04"
    statement: >
      The full G3 gate is green from the candidate commit and on the PR
      (Required Aggregation included); docs and privacy scanners stay green
      (no subject identifiers in Discovery-routed payloads).
    authorityReferences:
      - "ARC-014 §13; ARC-022 §19 item 17"
    evidenceRequired:
      - "npm run contracts:verify output; GitHub Actions run reference"
    testTypes: ["ci", "contract"]

tests:
  focusedCommands:
