acceptanceCriteria:
  - id: "AC-01"
    statement: >
      StationPublished envelopes on the wire carry the ARC-014 §2 extensions:
      correlationid (from the outbox correlation_id), aggregateid (aggregate
      ref), aggregateversion (aggregate version), and dataschema (the
      executable schema $id); causationid/traceparent emitted when
      available (causation_id nullable — may be absent for seed-originated
      facts, which is acceptable and must be stated).
    authorityReferences:
      - "ARC-014 §2; I1-MSG-001 review finding"
    evidenceRequired:
      - "integration test asserting the wire envelope attributes"
    testTypes: ["integration", "contract"]

  - id: "AC-02"
    statement: >
      Envelopes still validate against contracts/schemas/common/cloud-event.json
      (extensions are additional properties) and payloads still validate
      against station-published-event.json; the existing ContractSchema
      ValidationTest extended to assert the new attributes and remains green.
    authorityReferences:
      - "ARC-022 §19 items 9, 15"
    evidenceRequired:
      - "schema-validation test output"
    testTypes: ["contract"]

  - id: "AC-03"
    statement: >
      The dispatcher sends the enriched envelope without behavior change:
      confirms, mandatory, UNROUTABLE handling, claim protocol, and all
      existing tests remain green (no regression in the 24-test suite).
    authorityReferences:
      - "I1-MSG-002 acceptance criteria (regression guard)"
    evidenceRequired:
      - "full focused suite output"
    testTypes: ["integration"]

  - id: "AC-04"
    statement: >
      Idempotency preserved: the §8.1 event-fact uniqueness still governs
      emission; re-seeding produces no duplicate facts and no duplicate wire
      messages beyond the at-least-once contract.
    authorityReferences:
      - "AGENTS.md §4; ARC-022 §8.1"
    evidenceRequired:
      - "existing dedup tests remain green"
    testTypes: ["integration"]

