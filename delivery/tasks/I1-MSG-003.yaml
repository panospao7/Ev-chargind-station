schemaVersion: "1.0"

task:
  id: "I1-MSG-003"
  title: "Wire envelope extensions — emit aggregateid/aggregateversion/correlationid/dataschema on the wire (S1-09 prerequisite)"
  initialState: "READY"
  iteration: "I1"
  epic: "EPIC-03"
  releaseWave: "W1"
  sliceApplicability: "W1-S1"
  impactLevel: "L2"
  owner: "Backend/Data Architect and Project Owner"
  createdAt: "2026-09-12"
  baselineCommit: null

objective: >
  Extend the StationPublished wire envelope emitted by the station-operations
  outbox with the CloudEvents extensions ARC-014 §2 adopts —
  `correlationid`, `causationid`, `traceparent`, `aggregateid`,
  `aggregateversion` — plus `dataschema` (pointing at the executable schema
  $id). S1-09 requires version/sequence validation in consumers (ARC-014 §5:
  event ID dedup, aggregate version ordering detection, last-applied version,
  gap detection); a consumer cannot implement that without these attributes
  on the wire. The outbox_message columns already carry workflow/correlation/
  causation and aggregate version (ARC-022 §8.1) — this task surfaces them on
  the wire. Backward-compatible: the executable cloud-event.json schema
  already permits these attributes (extension attributes are additional
  properties; no schema change, no registry change). Scope is the STA seed's
  StationPublished emission path only — the OutboxWriter API gains optional
  extension attributes; no other message family is emitted yet.

origin: >
  Contract reviewer finding (I1-MSG-001, post-merge review, finding 3):
  "envelope omits dataschema and the declared extensions; correlation/
  causation exist only as outbox columns and never reach the wire, so
  consumers cannot correlate or order-detect from the message itself (ARC-014
  §5 relies on aggregate version on the wire)". Recorded in
  delivery/handoffs/I1-MSG-001/05-orchestrator.md NOTEs and flagged as
  required before I1-DSC-001. Owner approved this task as a DSC-001
  prerequisite on 2026-09-12.

requirements:
  - "FR-PLT-02 — idempotent consumption (needs event ID + dedup support)."
  - "GOV-007 §3 S1-09 — version/sequence validation (needs aggregate version
    on the wire)."
  - "ARC-014 §2 — CloudEvents envelope with dataschema and the declared
    extensions (correlationid, causationid, traceparent, aggregateid,
    aggregateversion)."

