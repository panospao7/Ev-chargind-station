schemaVersion: "1.0"

task:
  id: "I1-DSC-002"
  title: "Discovery depth — EVSE/connector/tariff events, projections, and public API filters + richer details (completes FR-DIS-02 W1-S1 MUST)"
  initialState: "READY"
  iteration: "I1"
  epic: "EPIC-09"
  releaseWave: "W1"
  sliceApplicability: "W1-S1"
  impactLevel: "L2"
  owner: "Backend/Data Architect and Project Owner"
  createdAt: "2026-09-12"
  baselineCommit: null

objective: >
  Complete the W1-S1 MUST depth of FR-DIS-02: station, EVSE, connector,
  power, tariff and operational-freshness information visible through the
  public API. Producer side: the STA seed emits EVSEConfigurationChanged,
  ConnectorConfigurationChanged and TariffPublished facts (plus StationUpdated
  family wiring readiness) in the SAME transaction as the seed data and the
  existing StationPublished facts (AGENTS.md §4 atomicity invariant), using
  the existing transactional outbox and dispatcher unchanged. Consumer side:
  Discovery consumes the three new event families into
  evse_search_projection, connector_search_projection and a tariff
  projection (per ARC-022 §9's table list), with per-aggregate version
  gates, inbox dedup and the §7.1 SQL guard — extending the proven
  I1-DSC-001 consumer pattern. Public API side (owner-approved L2 contract
  extension): listStations gains connectorType + minPowerW filter params;
  StationDetails gains EVSE/connector/tariff/opening-hours/freshness
  content; StationSummary gains totalEvses (availableEvses stays omitted —
  advisory availability is a later slice per S1-03 separation).

origin: >
  Owner decision 2026-09-12 (interactive session): "Discovery depth" slice
  selected to complete FR-DIS-02's MUST with real prices and filters before
  the Angular app; L2 contract extension approved (same pattern as
  getStationDetails in I1-DSC-001).

requirements:
  - "FR-DIS-01 — public discovery browse/search (filters deepen this slice)."
  - "FR-DIS-02 — infrastructure details: EVSE, connector, power, tariff,
    opening-hours, operational freshness (this task completes the W1-S1
    MUST portion)."
  - "FR-PLT-02 — idempotent consumption (per-aggregate, per event family)."
  - "FR-PLT-06 — projection isolation (non-authoritative, non-blocking)."

useCases:
  - "UC-DR-001 (browse/search stations) — filters and details portions."

authority:
  governance:
    - path: "docs/00_governance/07_w1_baseline_and_first_vertical_slice_v1.0.md"
      section: "§3 S1-02 (station details, EVSE and connector details, tariff
        and opening-hours display, operational freshness display)"
  requirements:
    - path: "docs/01_scope_and_requirements/04_functional_requirements_and_traceability_v1.1.md"
      section: "FR-DIS-01, FR-DIS-02, FR-PLT-02, FR-PLT-06"
  domain: []
  architecture:
    - path: "docs/05_architecture/16_w1_persistence_and_contract_finalization_v1.0.md"
      section: "§9 Discovery tables (evse_search_projection,
        connector_search_projection), §8 consumer integration tables,
        §7.1 projection record fields, §10 constraint/index naming"
    - path: "docs/05_architecture/14_domain_events_and_async_contracts_v1.0.md"
      section: "§2 envelope, §4 delivery semantics, §5 ordering, §6 event
        catalogue (EVSEConfigurationChanged, ConnectorConfigurationChanged,
        TariffPublished, StationUpdated)"
  contracts:
    - path: "contracts/openapi/public-discovery-api-v1.yaml"
      identifiers: ["listStations (+connectorType, minPowerW params — NEW),
        getStationDetails (StationDetails schema extended — NEW fields)"]
    - path: "contracts/registries/messages-v1.yaml"
      identifiers: ["EVSEConfigurationChanged (station.evse-configuration-changed),
        ConnectorConfigurationChanged (station.connector-configuration-changed),
        TariffPublished (station.tariff-published) — all registry-declared,
        Discovery-consumer"]
    - path: "contracts/schemas/events/evse-configuration-changed-event.json"
      identifiers: ["payload validation target"]
    - path: "contracts/schemas/events/connector-configuration-changed-event.json"
      identifiers: ["payload validation target"]
    - path: "contracts/schemas/events/tariff-published-event.json"
      identifiers: ["payload validation target"]
    - path: "contracts/schemas/common/cloud-event.json"
      identifiers: ["envelope validation target"]

invariants:
  - "Business change and outbox record commit atomically (AGENTS.md §4)."
  - "Consumers are idempotent and assume at-least-once delivery (AGENTS.md §4)."
  - "Discovery projections contain no account, driver, or vehicle identifiers
    (AGENTS.md §4; ARC-022 §9)."
  - "Discovery availability is advisory; projections are non-authoritative
    (FR-PLT-06)."
  - "Each service owns its database and migrations; no cross-service reads."
  - "Applied migrations immutable; new forward migrations with unique
    numbering in both databases."
  - "Errors use the approved Problem Details and problem-code registry."

