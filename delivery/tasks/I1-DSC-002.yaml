assumptions:
  - "Tariff projection shape: one active version per tariff with components;
    TariffRetired handling is registered but out of this slice's emission
    scope (seed emits only the active version)."
  - "Opening hours are read from the StationPublished/StationUpdated payload
    family OR — if the payload lacks hours — the details response derives
    them from a new station-hours projection fed by StationUpdated; the
    planner decides the minimal honest path (the seed's hours are 24/7 for
    all days)."
  - "availableEvses stays omitted (advisory availability is S1-03, Booking-
    owned capacity events — separate slice)."
  - "StationUpdated emission is NOT required this slice (no station field
    changes in the seed); its wiring-readiness is noted but the family is
    consumed only if needed for hours."

openQuestions: []

recordedDecisions:
  - "Tariff projection named tariff_public_projection (owner-approved 2026-09-12): ARC-022 s9 Discovery table list names no tariff table (confirmed gap); s7.1 tariff_version_projection is Booking-owned for snapshots; the packet mandates a tariff projection — new distinct table recorded via deviation note."
  - "Opening hours deferred with disclosure (owner-approved 2026-09-12): no allowed path carries hours to Discovery (wire payloads lack hours; schemas/registry prohibited this task; hours live only in station_operations_db). Details response omits openingHours this slice; fix path = future schema/registry task adding hours to a station event family."
  - "Dataschema map becomes fail-fast (closes the I1-MSG-003 tracked finding): unmapped message types are quarantined with category DATASCHEMA_UNMAPPED instead of silently shipping schema-less facts; map extended with the three new family $ids."
  - "Owner selected the Discovery-depth slice over the Angular app (2026-09-12)."
  - "Owner approved the L2 public-discovery-api extension (filters + richer
    details) (2026-09-12)."
