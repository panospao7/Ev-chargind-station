acceptanceCriteria:
  - id: "AC-01"
    statement: >
      The STA seed emits EVSEConfigurationChanged (2 facts: EVSE_A1, EVSE_A2,
      EVSE_B1, EVSE_B2 — one per EVSE), ConnectorConfigurationChanged (8
      facts: 2 connectors per EVSE, CCS 150000W + TYPE2 22000W) and
      TariffPublished (1 fact: Seed Standard Tariff v1, EUR, ENERGY_PER_KWH
      480 minor + OCCUPANCY_PER_MINUTE 10 minor) in the SAME transaction as
      the seed data and StationPublished facts; event-fact uniqueness makes
      re-seeds idempotent; wire envelopes carry the full ARC-020 §2/ARC-004
      §4 extension set with correct per-type dataschema values.
    authorityReferences:
      - "AGENTS.md §4; ARC-022 §8.1; ARC-020 §6"
    evidenceRequired:
      - "integration test asserting fact counts + atomicity + dataschema map"
    testTypes: ["integration", "contract"]

  - id: "AC-02"
    statement: >
      Discovery consumes all three new families with per-aggregate version
      gates (EVSE keyed by evseRef, connector by connectorRef, tariff by
      tariffVersionRef), inbox dedup, and the §7.1 SQL guard; forced
      duplicate delivery of each family produces a single effect; out-of-
      order versions follow the approved gap strategy (DEV-I1-DSC-001-01
      semantics extended to the new families).
    authorityReferences:
      - "FR-PLT-02; ARC-014 §5; DEV-I1-DSC-001-01"
    evidenceRequired:
      - "integration tests (duplicate + out-of-order per family)"
    testTypes: ["integration", "negative"]

  - id: "AC-03"
    statement: >
      evse_search_projection and connector_search_projection contain the
      seeded EVSEs (4 rows) and connectors (8 rows) with public fields only
      (no subject identifiers); the tariff projection contains the active
      version with its components; no account/driver/vehicle identifiers in
      any new column (test-asserted + G3 privacy scan).
    authorityReferences:
      - "ARC-022 §9; AGENTS.md §4"
    evidenceRequired:
      - "integration test; G3 privacy checks green"
    testTypes: ["integration", "contract"]

  - id: "AC-04"
    statement: >
      listStations supports connectorType and minPowerW filters: a station
      matching the filter appears only if it has an EVSE with a connector of
      the requested type and power >= minPowerW (via the projections);
      filtering works combined with geo params; responses remain
      StationSummary-shaped (plus totalEvses).
    authorityReferences:
      - "public-discovery-api-v1.yaml (owner-approved extension); FR-DIS-01"
    evidenceRequired:
      - "API integration tests (filter positive/negative/combined)"
    testTypes: ["integration", "contract"]

  - id: "AC-05"
    statement: >
      getStationDetails returns the extended StationDetails: EVSEs with
      their connectors (type + maxPowerW), the active tariff with its
      components (display-ready), opening hours, and the operational
      freshness timestamp (projection updated_at); unknown stationRef → 404
      unchanged; the shape is honest (no invented availability data).
    authorityReferences:
      - "FR-DIS-02; GOV-007 §3 S1-02; public-discovery-api-v1.yaml"
    evidenceRequired:
      - "API integration test (full details shape for SEEDSTA0001)"
    testTypes: ["integration", "contract"]

  - id: "AC-06"
    statement: >
      Producer isolation holds: the new emission paths keep Station
      Operations green with no consumer running (FR-PLT-06), and the
      existing suites (STA 24, Discovery 11) remain green without
      weakening.
    authorityReferences:
      - "FR-PLT-06; AGENTS.md §11"
    evidenceRequired:
      - "both full suites green; CI workflow runs"
    testTypes: ["integration"]

  - id: "AC-07"
    statement: >
      Contracts stay executable and green: G3 passes with the extended
      OpenAPI (additive, NON_BREAKING, examples validate); traceability rows
      updated only for implemented portions with CI evidence at closeout.
    authorityReferences:
      - "ARC-022 §19; AGENTS.md §10"
    evidenceRequired:
      - "G3 output exit 0; traceability diff"
    testTypes: ["contract", "ci"]

tests:
  focusedCommands:
    - "./mvnw -pl services/station-operations-service -am test"
    - "./mvnw -pl services/discovery-insights-service -am test"
  requiredSuites:
    - "./mvnw test"
    - "npm run contracts:verify"
    - "node scripts/delivery/validate.mjs"
    - "npm run contracts:secrets"
    - "git diff --check"
  positiveCases:
    - "Seed → 11 facts total (2 published + 4 evse + 8 connector + 1 tariff —
      note: 2+4+8+1 = 15; adjust count in test design) → projections → API
      filters + details."
  negativeCases:
    - "Duplicate delivery per family → single effect; out-of-order → gap
      strategy; malformed payload per family → DLQ; unknown type on the
      binding → DLQ."
  boundaryCases:
    - "minPowerW boundary (22000 vs 150000); combined geo+connector filters."
  concurrencyCases:
    - "Inbox dedup under redelivery (per family)."
  securityCases:
    - "No subject identifiers in new projections/responses; secret scan green."
  contractCases:
    - "G3 green with extended OpenAPI; emitted payloads validate against the
      executable schemas."
  migrationCases:
    - "Discovery V3 fresh install + role separation on real PostgreSQL 18."
  accessibilityCases: []

