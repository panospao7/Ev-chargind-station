  maximumExpectedDiff: >
    Moderate: nine V1 baseline migrations (small), role/init SQL for the
    local topology, migration test fixtures, scripts, one new CI workflow.
    Any pressure to include business tables (booking, guard, claim,
    session, outbox/inbox) is out of scope and must be refused — those are
    owning-service tasks against approved ARC-022 physical models.

  generatedFilesPolicy: >
    All SQL and configuration hand-authored. Flyway metadata tables are
    tool-managed at runtime and never hand-edited.

acceptanceCriteria:
  - id: "AC-01"
    statement: >
      The local topology provisions the nine databases with the exact names
      of ARC-022 §4 / ENG-001 §6.3, each with owner, migrator and runtime
      roles; no database or role is shared between services.
    authorityReferences:
      - "ARC-022 §4; ENG-001 doc §6.3"
    evidenceRequired:
      - "psql catalogue listing (databases, roles, grants)"
    testTypes: ["integration"]

  - id: "AC-02"
    statement: >
      An automated test proves the runtime role cannot execute DDL (CREATE/
      ALTER/DROP) and cannot read or write another service's database, while
      the migrator role can run migrations and the runtime role can perform
      DML on its own database.
    authorityReferences:
      - "ARC-015 EPIC-05 acceptance (runtime roles cannot execute DDL); ARC-022 §19 items 2, 5"
    evidenceRequired:
      - "role-separation test output"
    testTypes: ["integration", "security"]

  - id: "AC-03"
    statement: >
      Per-service Flyway structures exist with SQL-first migrations; V1
      baselines apply cleanly to empty databases; a second migration fixture
      proves the upgrade path from V1 works; checksum verification is active.
    authorityReferences:
      - "ARC-022 §13 (empty and upgrade migrations succeed; checksums verified in CI); §19 items 3–4"
    evidenceRequired:
      - "fresh and upgrade migration test runs"
    testTypes: ["migration", "integration"]

  - id: "AC-04"
    statement: >
      Migration tests run against real PostgreSQL 18 via Testcontainers (no
      H2/embedded substitute); a deliberately corrupted migration checksum or
      duplicate version number fails the pipeline with a non-zero exit.
    authorityReferences:
      - "AGENTS.md §10 (real PostgreSQL testing); ARC-022 §13"
    evidenceRequired:
      - "negative-fixture test output"
    testTypes: ["migration", "negative"]

  - id: "AC-05"
    statement: >
      A retention-job framework skeleton exists (job registration, execution
      contract) without any data-deletion behavior; no destructive job is
      scheduled (retention enforcement is W3).
    authorityReferences:
      - "ARC-015 EPIC-05 deliverables; GOV-007 §5 (retention enforcement W3)"
    evidenceRequired:
      - "skeleton test output"
    testTypes: ["unit"]

  - id: "AC-06"
    statement: >
      The G3 gate and delivery control plane remain green from the candidate
      commit; the new db-migrations workflow passes on the PR.
    authorityReferences:
      - "ARC-022 §13 (CI green from clean checkout)"
    evidenceRequired:
      - "npm run contracts:verify output; GitHub Actions run reference"
    testTypes: ["ci", "contract"]

tests:
  focusedCommands:
    - "./mvnw -pl libraries/test-support test"
  requiredSuites:
    - "./mvnw test"
    - "npm run contracts:verify"
    - "node scripts/delivery/validate.mjs"
    - "npm run contracts:secrets"
    - "git diff --check"
  positiveCases:
    - "Fresh empty database → V1 baseline applies; upgrade fixture applies."
  negativeCases:
    - "Runtime role DDL attempt rejected."
    - "Cross-service database access rejected."
    - "Tampered checksum and duplicate migration version both fail the run."
  boundaryCases: []
  concurrencyCases: []
  securityCases:
    - "Role separation negative tests; no credentials beyond documented dev-only values."
  contractCases: []
  migrationCases:
    - "Fresh install, upgrade path, checksum integrity, unique numbering."
  accessibilityCases: []

