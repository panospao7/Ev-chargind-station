schemaVersion: "1.0"

task:
  id: "I1-DAT-001"
  title: "Persistence and migration foundation — service-owned databases, roles and Flyway structure"
  initialState: "BACKLOG"
  iteration: "I1"
  epic: "EPIC-05"
  releaseWave: "W1"
  sliceApplicability: "W1-S1"
  impactLevel: "L3"
  owner: "Backend/Data Architect and Project Owner"
  createdAt: "2026-09-10"
  baselineCommit: null

objective: >
  Establish service-owned PostgreSQL persistence per ARC-022 §4 and ENG-001
  §6.3: the nine logical databases; per-database owner/migrator/runtime role
  separation with automated proof that the runtime role cannot execute DDL or
  reach another service's database; per-service SQL-first Flyway structures
  with a V1 baseline migration per service (schema/catalogue setup only — no
  business tables); the migration pipeline and developer commands; a
  retention-job framework skeleton; backup-compatible local configuration;
  and migration test fixtures proving fresh-install success, upgrade-path
  success, checksum integrity, unique numbering and immutability — all
  against real PostgreSQL 18 via Testcontainers, never an embedded substitute.

origin: >
  Owner direction 2026-09-10 to begin W1-S1. Wave-1 foundation packet;
  business-table migrations (ARC-022 §5–§9, work packages DATA-002/003)
  arrive with the owning services' later tasks.

requirements:
  - "None implemented directly — foundation enabling all W1 FRs; persistence
    behaviour FRs are delivered by the owning services' later tasks."

useCases:
  - "None directly."

authority:
  governance:
    - path: "docs/00_governance/07_w1_baseline_and_first_vertical_slice_v1.0.md"
      section: "§2 (no new ownership model), §3 S1-01 (repeatable reset without cross-service writes), §6 status ledger (PostgreSQL/Flyway APPROVED)"
  requirements: []
  domain: []
  architecture:
    - path: "docs/05_architecture/16_w1_persistence_and_contract_finalization_v1.0.md"
      section: "§4 W1 persistence ownership (database list), §8 common integration persistence (conventions only here), §12/§13 migration rules (independent per-service Flyway; applied migrations immutable; corrections via new migrations; no automatic production down; real-PostgreSQL tests; empty and upgrade paths; checksum verification), §19 definition of done items 2–6"
    - path: "docs/08_delivery_and_ai_agents/04_local_engineering_foundation_v1.0.md"
      section: "§3 baseline decisions (PostgreSQL 18, Flyway SQL-first), §6.3 PostgreSQL local topology, §8.2 database commands"
    - path: "docs/08_delivery_and_ai_agents/02_implementation_epics_dependency_roadmap_v1.0.md"
      section: "§4 M2 exit criteria (migrations work), EPIC-05 deliverables and acceptance"
  contracts: []

invariants:
  - "Each service owns its database and migrations; cross-service database
    reads, writes, joins and foreign keys are prohibited (AGENTS.md §4)."
  - "Applied migrations are immutable; numbering is unique; every new schema
    change takes a forward migration (AGENTS.md §10)."
  - "SQL correctness involving locks, ranges, exclusions or indexes must be
    tested against real PostgreSQL (AGENTS.md §10)."
  - "The local PostgreSQL container is shared infrastructure, not shared
    ownership; initialization must not insert business aggregates into
    another service's database (ENG-001 doc §6.3)."

ownership:
  owningService: "Delivery / Engineering Foundation (cross-service persistence topology); per-service schemas become property of the owning service"
  dataOwner: "Per-service data owners per ARC-022 §4"
  supportingServices:
    - "All seven canonical services (database provisioning only)"
  prohibitedOwners:
    - "Browser runtime"

