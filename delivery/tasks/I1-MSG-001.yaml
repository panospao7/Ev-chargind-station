  createdAt: "2026-09-12"
  baselineCommit: null

objective: >
  Deliver the W1-S1 messaging foundation for station-operations-service per
  ARC-022 §8 and GOV-007 §3 S1-09: the four common integration tables
  (outbox_message, inbox_message, idempotency_record, audit_event) as a
  forward V3 migration in station_operations_db; a transactional outbox
  writer; a polling dispatcher with publisher confirms, mandatory publishing,
  bounded retry and QUARANTINED terminal state; RabbitMQ topology per ENG-001
  doc §6.4 (durable topic exchanges from the registry anchors, quorum queues,
  dead-letter handling, manual acknowledgements) via approved Spring AMQP;
  and the POC-04 behaviour proofs on Testcontainers RabbitMQ — at-least-once
  delivery with duplicate consumption deduplicated by the inbox, per-aggregate
  ordering, publish-failure retry then quarantine, and append-only audit. The
  seed emits one StationPublished outbox message per published station,
  committed atomically with the seed data (business change and outbox record
  commit together). No Discovery consumption, no Booking capacity events, no
  other services' copies — those are their own tasks.

origin: >
  Continuation of the I1 critical path after I1-CON-003 (registry alignment,
  VERIFIED) and the owner's standing "continue" direction 2026-09-11. The
  messaging foundation is the prerequisite for Discovery projections (S1-02)
  and Booking (EPIC-10), and formally executes POC-04 (ARC-015 §10).

requirements:
  - "FR-PLT-01 — authoritative changes propagate asynchronously via the
    transactional outbox (this task implements the STA-side machinery and
    proves it; first real business payload: StationPublished from the seed)."
  - "FR-PLT-02 — consumers handle at-least-once delivery safely (inbox
    deduplication proven)."
  - "FR-PLT-03 — bounded retries with backoff and controlled dead-letter/quarantine."
  - "GOV-007 §3 S1-09 — transactional outbox, at-least-once, version/sequence
    validation foundations (full Discovery projections are I1-DSC-001)."

