acceptanceCriteria:
  - id: "AC-01"
    statement: >
      The four ARC-022 §8 tables exist in station_operations_db via V3 with
      the specified fields, states (PENDING/PUBLISHED/QUARANTINED),
      uniqueness constraints ((aggregate_type, aggregate_ref,
      aggregate_version, message_type) for outbox facts;
      (consumer_name, message_id) for inbox), and an append-only audit_event
      (runtime role cannot update/delete).
    authorityReferences:
      - "ARC-022 §8.1–8.4"
    evidenceRequired:
      - "migration test output; catalogue listing"
    testTypes: ["migration", "integration"]

  - id: "AC-02"
    statement: >
      Seeding emits one StationPublished outbox message per published station
      in the SAME transaction as the seed data; the unique event-fact
      constraint makes re-seeding produce no duplicate facts; the dispatcher
      publishes with publisher confirms and mandatory flagging, marking rows
      PUBLISHED only on confirm.
    authorityReferences:
      - "AGENTS.md §4 (atomic commit); ARC-022 §8.1; ENG doc §6.4"
    evidenceRequired:
      - "integration test output (atomicity + confirm path)"
    testTypes: ["integration"]

  - id: "AC-03"
    statement: >
      POC-04 behaviour proofs pass on Testcontainers RabbitMQ: message
      delivered at-least-once (forced duplicate consumption deduplicated by
      inbox (consumer_name, message_id)); per-aggregate ordering preserved;
      a failing publish retries with attempt count then transitions to
      QUARANTINED; consumer uses manual acknowledgements with DLQ routing.
    authorityReferences:
      - "ARC-015 §10 POC-04; FR-PLT-01..03; ENG doc §6.4"
    evidenceRequired:
      - "behaviour suite output"
    testTypes: ["integration", "negative"]

  - id: "AC-04"
    statement: >
      audit_event is append-only (insert allowed, update/delete rejected) and
      the idempotency_record carries the ARC-022 §8.3 scope and retention
      fields (no deletion behavior — retention enforcement stays W3).
    authorityReferences:
      - "ARC-022 §8.3–8.4"
    evidenceRequired:
      - "negative-fixture test output"
    testTypes: ["integration", "negative"]

  - id: "AC-05"
    statement: >
      StationPublished payloads validate against
      contracts/schemas/events/station-published-event.json and the
      CloudEvents envelope schema; G3, delivery validators, secret scan and
      the existing CI workflows remain green (service-tests and
      db-migrations workflows cover this task's paths).
    authorityReferences:
      - "ARC-022 §19 items 9, 15; AGENTS.md §10"
    evidenceRequired:
      - "test output; GitHub Actions run references on the PR"
    testTypes: ["ci", "contract"]

