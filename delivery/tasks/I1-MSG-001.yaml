schemaVersion: "1.0"

task:
  id: "I1-MSG-001"
  title: "Messaging foundation — ARC-022 §8 integration tables, outbox dispatcher, RabbitMQ topology (POC-04)"
  initialState: "READY"
  iteration: "I1"
  epic: "EPIC-03"
  releaseWave: "W1"
  sliceApplicability: "W1-S1"
  impactLevel: "L3"
