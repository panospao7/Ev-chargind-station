schemaVersion: "1.0"

task:
  id: "I1-ENG-003"
  title: "CI coverage — extend Service Tests workflow to Discovery; verify STA listener retry config for the Boot 4.1.1 MANUAL-ack pattern"
  initialState: "READY"
  iteration: "I1"
  epic: "EPIC-01"
  releaseWave: "W1"
  sliceApplicability: "W1-S1"
  impactLevel: "L2"
  owner: "Delivery Engineering and Project Owner"
  createdAt: "2026-09-12"
  baselineCommit: null

objective: >
  Close the CI coverage gap exposed by I1-DSC-001: the Service Tests
  workflow's path filter covers only services/station-operations-service/**,
  so Discovery's 27-test suite never runs in CI (disclosed NOT_RUN in the
  I1-DSC-001 closeout, owner-approved disposition). Extend the path triggers
  to include services/discovery-insights-service/** and prove Discovery's
  suite green in CI (JDK 25). Additionally verify the station-operations
  listener/outbox configuration against the Boot 4.1.1 findings from the
  I1-DSC-001 fix round (deprecated max-attempts key; MANUAL-ack retry chain
  behavior) and apply the same honest-config corrections if the pattern is
  shared. Also restore the disclosed-but-inert bounded container retry for
  Discovery's transient DB failures OR record the immediate-DLQ behavior as
  the approved design — one or the other, no silent third state.

origin: >
  I1-DSC-001 closeout (delivery/handoffs/I1-DSC-001/02-orchestrator.md):
  Service Tests NOT_RUN at the merge commit because service-tests.yml has no
  path trigger for discovery-insights-service; owner chose "close + follow-up
  task". The listener-retry item comes from the I1-DSC-001 fix-round coder's
  bytecode-verified findings (Boot 4.1.1 renamed the retry key;
  spring-retry is not used by spring-amqp 4.1.1; MANUAL-ack listeners park
  silently without an active advice chain).

