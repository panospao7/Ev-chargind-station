acceptanceCriteria:
  - id: "AC-01"
    statement: >
      The Service Tests workflow triggers on changes to
      services/discovery-insights-service/** and executes Discovery's full
      suite green on JDK 25 (proven by the workflow run on this PR).
    authorityReferences:
      - "I1-DSC-001 closeout; delivery foundation doc"
    evidenceRequired:
      - "workflow run reference (green) on this PR"
    testTypes: ["ci"]

  - id: "AC-02"
    statement: >
      The Service Tests workflow continues to trigger and pass for
      station-operations-service (no regression in the existing trigger).
    authorityReferences:
      - "Existing workflow behavior"
    evidenceRequired:
      - "workflow run reference (green) on this PR"
    testTypes: ["ci"]

  - id: "AC-03"
    statement: >
      STA's listener/outbox configuration is verified against the Boot 4.1.1
      findings: any deprecated retry keys or inert MANUAL-ack retry chains
      are corrected to honest configuration, or the current behavior is
      explicitly documented as the approved design. Discovery's transient
      DB-failure path is either wired to the bounded container retry (restored
      advice chain) or recorded as immediate-DLQ-by-design in the consumer
      javadoc and the evidence file — no silent divergence between disclosed
      and actual behavior.
    authorityReferences:
      - "I1-DSC-001 fix-round findings; AGENTS.md §11 (no silent weakening)"
    evidenceRequired:
      - "config diff + verification note in the evidence file"
    testTypes: ["configuration", "review"]

  - id: "AC-04"
    statement: >
      No workflow permissions, secrets, runners, or other CI security
      surfaces are changed; the diff is limited to path triggers and
      application configuration.
    authorityReferences:
      - "ARC-016 §8 (CI/CD workflow permissions require human confirmation)"
    evidenceRequired:
      - "diff review in the evidence file"
    testTypes: ["review"]

