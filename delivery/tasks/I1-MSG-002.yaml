objective: >
  Close the unresolved MAJOR findings from the independent post-merge reviews
  of I1-MSG-001 (merge f9de0f4c, PR #24), and fold in the bounded MINOR
  findings: (M1) returned-message handling in the dispatcher so an unroutable
  mandatory publish is treated as a failure (attempt/backoff → QUARANTINED
  with an UNROUTABLE-class failure category) instead of being confirmed and
  marked PUBLISHED; (M2) a real forced-duplicate-consumption test proving
  inbox dedup (second delivery of the same message → first=false, single
  effect); (M3) dispatcher claim protection for multi-instance dispatch
  (FOR UPDATE SKIP LOCKED or CAS claim) plus the packet-required two-instance
  concurrency test — or an owner-approved recorded deviation; (M4) a test
  validating the emitted StationPublished envelope+payload against the
  executable JSON Schemas. MINOR folds: explicit constraint names via a new
  additive V4 migration (RENAME CONSTRAINT + idempotency expiry index),
  conflict-target on the outbox ON CONFLICT, fix the spring.outbox.* /
  outbox.* config-key mismatch, correct the seed-reset documented invocation,
  failure-injection proof of seed atomicity, and evidence run references.

origin: >
