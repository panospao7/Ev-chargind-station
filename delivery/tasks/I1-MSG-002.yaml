acceptanceCriteria:
  - id: "AC-01"
    statement: >
      An unroutable mandatory publish (no bound queue) is treated as a
      dispatch failure: the outbox row is NOT marked PUBLISHED; attempts
      increment with an UNROUTABLE-class failure category; after max attempts
      the row is QUARANTINED. Proven by a negative test that publishes with
      no queue bound and asserts the row never reaches PUBLISHED.
    authorityReferences:
      - "ARC-014 §4; FR-PLT-03; review finding M1"
    evidenceRequired:
      - "negative integration test output"
    testTypes: ["integration", "negative"]

  - id: "AC-02"
    statement: >
      A forced duplicate delivery (same message_id delivered twice to the
      consumer) is deduplicated by the inbox: the second insert yields
      first=false, the effect is applied exactly once, and the test asserts
      the dedup path was actually exercised.
    authorityReferences:
      - "FR-PLT-02; AGENTS.md §4; review finding M2"
    evidenceRequired:
      - "integration test output showing the duplicate delivery"
    testTypes: ["integration", "negative"]

  - id: "AC-03"
    statement: >
      Two concurrent dispatcher passes cannot double-mark or reorder
      per-aggregate facts: dispatch claims rows via FOR UPDATE SKIP LOCKED
      (or CAS claim) so only one instance sends a given row; a two-instance
      test proves a single PUBLISHED outcome per fact. If the owner instead
      approves the deviation path, a recorded deviation plus a documented
      single-instance operational constraint replaces this criterion.
    authorityReferences:
      - "Task packet I1-MSG-001 tests.concurrencyCases; review finding M3"
    evidenceRequired:
      - "two-instance concurrency test output (or recorded deviation)"
    testTypes: ["integration", "concurrency"]

  - id: "AC-04"
    statement: >
      The emitted StationPublished envelope and payload validate against
      contracts/schemas/common/cloud-event.json and
      contracts/schemas/events/station-published-event.json inside the test
      suite (executable-schema validation, not shape assertion).
    authorityReferences:
      - "I1-MSG-001 AC-05; review finding M4"
    evidenceRequired:
      - "schema-validation test output"
    testTypes: ["contract"]

  - id: "AC-05"
    statement: >
      V4 migration applies cleanly on fresh install and after V3 (upgrade
      path); constraints carry explicit stable names (RENAME CONSTRAINT);
      idempotency_record.expires_at is indexed; no V1–V3 migration is
      modified; all existing suites remain green.
    authorityReferences:
      - "ARC-022 §10, §12–13; review findings m1, m5"
    evidenceRequired:
      - "migration test output; catalogue listing"
    testTypes: ["migration", "integration"]

  - id: "AC-06"
    statement: >
      OutboxWriter's ON CONFLICT targets the event-fact uniqueness constraint
      explicitly; the outbox.* configuration keys bind (an override test or
      startup assertion proves OUTBOX_MAX_ATTEMPTS reaches the dispatcher);
      the seed-reset documented invocation works as written or the javadoc is
      corrected to the working invocation; a failure injected after the
      outbox append rolls back both seed data and outbox rows.
    authorityReferences:
      - "Review findings m2, m4, m6, m7"
    evidenceRequired:
      - "unit/integration test output; corrected docs"
    testTypes: ["unit", "integration"]

