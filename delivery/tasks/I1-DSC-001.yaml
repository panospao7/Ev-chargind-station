schemaVersion: "1.0"

task:
  id: "I1-DSC-001"
  title: "Discovery first slice — StationPublished consumer, station_search_projection, public stations list + details API"
  initialState: "READY"
  iteration: "I1"
  epic: "EPIC-09"
  releaseWave: "W1"
  sliceApplicability: "W1-S1"
  impactLevel: "L2"
  owner: "Backend/Data Architect and Project Owner"
  createdAt: "2026-09-12"
  baselineCommit: null

objective: >
  Deliver the first user-visible slice of the S1 journey (GOV-007 §3 S1-02
  minimal core): discovery-insights-service consumes the real StationPublished
  events from station-operations-service (at-least-once, inbox-deduplicated,
  version/sequence-validated per S1-09) into the service-owned
  station_search_projection (ARC-022 §9) with a projection_checkpoint for
  rebuild/resume, and exposes the public, unauthenticated read API:
  GET /api/v1/stations (geo-bounded list per the existing
  public-discovery-api-v1.yaml listStations operation) and the
  owner-approved NEW operation GET /api/v1/stations/{stationRef} (station
  details per FR-DIS-02 — station fields from the projection; EVSE/connector/
  tariff/freshness content limited to what this slice's data provides, with
  the honest shape the existing StationSummary schema supports plus the
  approved details extension). Advisory availability, EVSE/connector
  projections, map tiles, filters beyond the contract's existing parameters,
  and Booking capacity events are OUT OF SCOPE (later slices). Search remains
  non-authoritative (FR-PLT-06): projection unavailability never blocks core
  operations. Projections contain no account, driver, or vehicle identifiers
  (ARC-022 §9 invariant).

origin: >
  GOV-007 §3 S1 journey step 2; the S1 critical path after the messaging
  foundation (I1-MSG-001/002 VERIFIED) and its prerequisites approved by the
  owner on 2026-09-12: I1-MSG-003 (wire envelope extensions enabling
  S1-09 version/sequence validation) and I1-CON-004 (AsyncAPI alignment
  closing the exchange drift before consumer binding).

requirements:
  - "FR-DIS-01 — public discovery browse/search (list view this slice)."
  - "FR-DIS-02 — station details (approved contract extension)."
  - "FR-PLT-02 — idempotent consumption (inbox dedup)."
  - "FR-PLT-06 — projection isolation (non-authoritative, non-blocking)."
  - "GOV-007 §3 S1-02 (minimal: list + details) and S1-09 (version/sequence
    validation, bounded retry, quarantine, rebuild/reset procedure)."

useCases:
  - "UC-DR-001 (browse/search stations) — list + details portions."

