      identifiers: ["listStations (existing); getStationDetails (NEW — owner
        approved L2 extension, added by this task)"]
    - path: "contracts/registries/messages-v1.yaml"
      identifiers: ["StationPublished (producer station-operations-service,
        consumer discovery-insights-service, exchange ev.domain.v1, routing
        key station.published)"]
    - path: "contracts/schemas/events/station-published-event.json"
      identifiers: ["payload validation target"]
    - path: "contracts/schemas/common/cloud-event.json"
      identifiers: ["envelope validation target"]

invariants:
  - "Discovery projections contain no account, driver, or vehicle identifiers
    (AGENTS.md §4; ARC-022 §9)."
  - "Discovery availability is advisory; projections are non-authoritative
    (AGENTS.md §4; FR-PLT-06)."
  - "Consumers are idempotent and assume at-least-once delivery (AGENTS.md
    §4) — Discovery owns its own inbox_message copy (ARC-022 §8: every
    consuming service owns its own copies)."
  - "Each service owns its database and migrations; no cross-service reads
    (AGENTS.md §4)."
  - "Applied migrations immutable; new forward migrations with unique
    numbering in discovery_insights_db."
  - "Errors use the approved Problem Details and problem-code registry
    (AGENTS.md §10)."

