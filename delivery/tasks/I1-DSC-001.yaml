acceptanceCriteria:
  - id: "AC-01"
    statement: >
      Discovery consumes StationPublished from ev.domain.v1/station.published
      with inbox deduplication ((consumer_name, message_id) PK on
      Discovery's own inbox copy): forced duplicate delivery produces a
      single projection effect; processing is idempotent.
    authorityReferences:
      - "FR-PLT-02; ARC-022 §8.2; AGENTS.md §4"
    evidenceRequired:
      - "integration test with forced duplicate delivery"
    testTypes: ["integration", "negative"]

  - id: "AC-02"
    statement: >
      Version/sequence validation per S1-09/ARC-014 §5: the consumer reads
      aggregateid/aggregateversion from the wire envelope (delivered by
      I1-MSG-003), stores last-applied version in the projection/checkpoint,
      detects out-of-order arrival, and applies the documented strategy
      (hold/retry or request snapshot; for this slice: hold-and-retry with
      bounded attempts then skip-with-recorded-gap, honestly disclosed) —
      critical correctness never depends on arrival order.
    authorityReferences:
      - "GOV-007 §3 S1-09; ARC-014 §5"
    evidenceRequired:
      - "integration test with out-of-order delivery"
    testTypes: ["integration", "negative"]

  - id: "AC-03"
    statement: >
      station_search_projection rows exist for every published station with
      exactly the public fields (stationRef, publicRef, displayName, address,
      city, postalCode, countryCode, latitude, longitude) and a source
      version; NO account/driver/vehicle identifiers in any projection
      column (asserted by test and by the G3 privacy scan).
    authorityReferences:
      - "ARC-022 §9; AGENTS.md §4"
    evidenceRequired:
      - "integration test; G3 privacy checks green"
    testTypes: ["integration", "contract"]

  - id: "AC-04"
    statement: >
      GET /api/v1/stations implements the existing listStations contract
      (lat/long/radius/limit) returning StationSummary shapes from the
      projection; GET /api/v1/stations/{stationRef} returns the approved
      details shape; unknown stationRef → 404 Problem Details per the
      approved problem-code registry; responses are unauthenticated (public
      API security scheme per the contract).
    authorityReferences:
      - "public-discovery-api-v1.yaml; FR-DIS-01/02; AGENTS.md §10"
    evidenceRequired:
      - "API integration tests (positive + 404 + contract conformance)"
    testTypes: ["integration", "contract"]

  - id: "AC-05"
    statement: >
      Projection rebuild/reset procedure exists (S1-09): the checkpoint
      records the last-applied source version; a documented rebuild path
      re-derives the projection (from re-emitted events or the deterministic
      seed) idempotently; test proves rebuild produces the same projection
      state.
    authorityReferences:
      - "GOV-007 §3 S1-09; ARC-014 §5 (idempotent projection rebuilds)"
    evidenceRequired:
      - "integration test (rebuild idempotency)"
    testTypes: ["integration"]

  - id: "AC-06"
    statement: >
      Consumer failure handling: transient consumption failure uses bounded
      retry then dead-letter/quarantine per the approved topology (quorum
      queue + DLQ); a poison message does not block the stream; projection
      unavailability does not affect Station Operations (FR-PLT-06
      demonstrated by the producer's tests remaining green with no consumer
      running).
    authorityReferences:
      - "FR-PLT-06; GOV-007 §3 S1-09; ENG doc §6.4"
    evidenceRequired:
      - "integration test (poison message → DLQ); existing producer suite"
    testTypes: ["integration", "negative"]

  - id: "AC-07"
    statement: >
      Contracts stay executable and green: G3 validation passes with the
      extended public-discovery-api-v1.yaml (examples validate; compatibility
      NON_BREAKING — additive operation); traceability rows updated only for
      implemented portions.
    authorityReferences:
      - "ARC-022 §19; AGENTS.md §10"
    evidenceRequired:
      - "G3 output exit 0; traceability diff"
    testTypes: ["contract", "ci"]

tests:
  focusedCommands:
    - "./mvnw -pl services/discovery-insights-service -am test"
  requiredSuites:
    - "./mvnw test"
    - "npm run contracts:verify"
    - "node scripts/delivery/validate.mjs"
    - "npm run contracts:secrets"
    - "git diff --check"
  positiveCases:
    - "Seed → StationPublished → projection row → list + details API responses correct."
  negativeCases:
    - "Duplicate delivery → single effect; out-of-order version → held/retried not misapplied; unknown stationRef → 404 Problem Details; poison message → DLQ."
  boundaryCases:
    - "Geo search at radius boundary; limit bounds per contract."
  concurrencyCases:
    - "Consumer idempotency under redelivery; checkpoint update is single-writer safe (single consumer instance W1-S1)."
  securityCases:
    - "No auth on public reads per contract; no subject identifiers in projections or responses; secret scan green."
  contractCases:
    - "API responses validate against the OpenAPI schemas; G3 green."
  migrationCases:
    - "Discovery migration fresh install + role separation (runtime DML-only) on real PostgreSQL 18."
  accessibilityCases: []

