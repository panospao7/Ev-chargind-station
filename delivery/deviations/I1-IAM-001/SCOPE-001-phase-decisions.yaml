title: "Bounded implementation deviations during phases 1-3"
description: >
  Six bounded deviations were taken during implementation. All are
  disclosed here for owner/reviewer visibility; none weakens a test,
  validator, or invariant. Items (b)-(c) changed committed code and are
  the most material for review.

items:
  - id: "a"
    title: "Smoke-test context repair (test-only)"
    description: >
      BffApplicationTests context failed under Boot 4.1 eager OIDC
      discovery at context startup. Repaired with documented test
      excludes (DataSourceAutoConfiguration +
      OAuth2ClientAutoConfiguration) and test keys via
      @DynamicPropertySource; security chain included in MockMvc;
      layered firewall/controller assertions. Test-only; main code
      unaffected.
    disposition: "APPROVED — test-only, disclosed in phase 1 handoff."

  - id: "b"
    title: "rotateRef defect fix in committed phase-2 code"
    description: >
      D1 tests found rotateRef copying the old session_ref into the new
      row (PK violation — rotation could never succeed). Fixed in
      3da3d71e. A second rotateRef aspect surfaced in D3: the new row
      inherited security_event_metadata verbatim, so the CSRF token
      survived rotation (SEC-P02 §6.1 violation); fixed in 0d1e9e02
      (new row receives '{}'). Both fixes are within the packet's
      allowed files (session package) and were found by required tests.
    disposition: "DISCLOSED — defect repair inside approved scope; reviewer confirmation requested."

  - id: "c"
    title: "D3 item-10 CORS assertion adjustment"
    description: >
      SEC-P02 §6.4 item 10 (wildcard CORS with credentials) is asserted
      at the configuration level instead of a live preflight round-trip:
      mvcHandlerMappingIntrospector framework bean + null-CORS-config
      check + preflight status in {401, 403}. The assertion strength is
      equivalent (no wildcard origin with credentials is constructible
      in the emitted configuration); documented in the test source.
    disposition: "DISCLOSED — reviewer confirmation requested."

  - id: "d"
    title: "x-release-wave / x-slice-applicability not added"
    description: >
      AC-05 lists x-release-wave W1 and x-slice-applicability W1-S1 on
      the new operations. No x- convention exists in any contract yet
      (grep-verified across contracts/openapi/**); adding vendor
      extensions would establish a new convention, which is ARC-016 §14
      normalization territory and a follow-up. Operations are otherwise
      complete and unique operationIds hold.
    disposition: "DISCLOSED — follow-up normalization task proposed."

  - id: "e"
    title: "Inline examples instead of examples/ directory"
    description: >
      Session-operation examples were embedded inline in
      driver-bff-api-v1.yaml rather than under
      contracts/openapi/examples/. The packet lists examples/** as
      allowed but does not mandate the directory; inline keeps the
      problem examples adjacent to their responses and validates via the
      same spectral/ajv gates. Two new cosmetic
      oas3-valid-media-example warnings arise from external
      problem-details.json ref resolution; the error-severity gate stays
      clean.
    disposition: "DISCLOSED — reviewer confirmation requested."

  - id: "f"
    title: "PROBLEM_BASE aligned to established convention"
    description: >
      Problem-code registry PROBLEM_BASE aligned to
      https://api.evplatform.example/problems/ (the convention
      established by prior tasks). Registry-only alignment; codes and
      semantics unchanged.
    disposition: "DISCLOSED — reviewer confirmation requested."

