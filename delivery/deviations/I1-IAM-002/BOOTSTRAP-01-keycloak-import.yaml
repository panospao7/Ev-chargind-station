date: "2026-09-15"
status: "OPEN_REQUIRES_OWNER_DECISION"
title: "Keycloak 26.6 realm import cannot deterministically express the svc-* client finalization"
description: >
  Phase 2 (AC-06) assumed the realm import expresses the full svc-* client
  configuration (attributes incl. Standard Token Exchange V2 toggle,
  audience protocol mappers). Empirical probing on Keycloak 26.6
  (quay.io/keycloak/keycloak:26.6, feature token-exchange-standard) found:
  (1) the directory import (--import-realm) succeeds but SILENTLY strips
  client attributes and protocolMappers while importing the rest; (2) the
  Admin-REST full-realm import returns 201 but the same stripping occurs on
  read-back; (3) after such an import, any client PUT returns 409 Duplicate
  resource error even for a minimal attribute change; (4) protocolMappers
  CAN be added via the protocol-mappers/add-models endpoint (verified:
  aud-svc-station-operations created, 204). Non-UUID pinned client ids in
  the realm file make the REST full import 409 outright (removing them lets
  the import pass). The probe test (apps/bff RealmImportProbeTest) asserts
  the current failing state and will encode the final recipe.
options:
  - id: A
    label: "Admin-REST bootstrap component (code)"
    detail: >
      Approve a small service-owned bootstrap (KeycloakAdminRestBootstrap:
      import realm, then per-client PUT/mappers/permission calls via Admin
      REST, executed at dev-stack startup or as a test fixture). The
      attribute-stripped import becomes a known first step; finalization is
      code against the Admin API. Proven workable (mappers created via REST
      in this probe). Requires: scope amendment adding an infra/bootstrap
      code location to allowedFiles.
  - id: B
    label: "Different Keycloak version"
    detail: >
      Probe Keycloak 25.x or 26.x patch variants for an import path that
      preserves attributes/mappers; re-run the same probe test against the
      chosen version. Risk: STX-v2 availability and support matrix change.
  - id: C
    label: "Documented manual console configuration (dev-only)"
    detail: >
      Keep import as-is (clients/roles/users) and document a one-time manual
      Admin-console checklist per developer for attributes/mappers/STX.
      Weakest determinism; CI proofs (Testcontainers) would still need
      option A's code.
recommendation: "Option A (with the phase-3 Testcontainers suite as the proof harness)."
empiricalFindings (2026-09-15, Option A probe on clean KC 26.6):
  - bare-realm Admin-REST import (users included): 201, users import with
    emailVerified honored (ROPC then resolves past verifyEmail only after
    user-level re-check — see remaining quirk below)
  - client-level POST with FULL representation: 201 x9, zero failures
  - GET read-back immediately after creation hides custom attributes and
    protocolMappers (representation stale until a subsequent write)
  - protocol-mappers/add-models (array body): 204, mappers created and
    then visible on read-back (aud-svc-* x7 verified)
  - client PUT with attributes: 204 on master realm; 409 Duplicate
    resource on the probe realm even for minimal payloads — under
    investigation (suspected polluted-state artifact of the double
    import in the probe; clean-container re-run required)
  - ROPC on security-test-client: still invalid_grant "Account is not
    fully set up" despite users[].emailVerified=true in the import and
    empty requiredActions on read-back — user-representation import
    quirk; workaround candidates: Admin-REST user PUT (set emailVerified
    post-import) or a set-single-attribute UPDATE, to be re-run on a
    clean container
  - consequence: Option A (Admin-REST bootstrap) is viable; the exact
    finalization sequence must run against a CLEAN container in one pass
    (realm-bare import → client POSTs → attributes PUT → add-models →
    STX permission wiring), encoded as the phase-3 test fixture

confirmedRootCause (2026-09-15, minimal repro):
  Keycloak 26.6.4 with feature token-exchange-standard enabled: ANY client
  PUT containing an attributes map returns 409 Duplicate resource error —
  even {"x-foo":"bar"} on a pristine master realm, on freshly POSTed
  clients, independent of attribute content. Mechanism: with the feature
  on, every client update re-registers the Standard-Token-Exchange
  permission resource → duplicate → 409. This is an upstream Keycloak
  defect (interplay of the token-exchange-standard feature and client
  updates), NOT a repository defect. Creation (POST) with attributes
  works (they persist); UPDATE is the broken path. Consequence: the
  realm import alone cannot finalize clients (import strips), and the
  import-then-update recipe hits the 409. Phase status: phase 1 done
  (registry); phase 2 finalization blocked on this upstream defect.
  Disposition options unchanged (A needs a workaround for the 409 —
  e.g. PATCH-free attribute updates via the client registration API, or
  B version probe: verify whether 26.6.x patch releases or 26.7 fix it).

crossVersionConfirmation (2026-09-15):
  Probed 26.5.0, 26.6.4, 26.7.0 (all with and without the
  token-exchange-standard feature): custom client attributes are dropped
  on client creation via the Admin API, and attribute-bearing client PUTs
  return 409 Duplicate resource error — CONSISTENTLY, independent of the
  STX feature. Master realm (pristine) reproduces identically. The Admin
  API does process the attributes map (computed defaults like
  post.logout.redirect.uris=+ are materialized), so the payload parsing
  works; the custom-key persistence/update path is what fails. This is an
  upstream/environment-level Keycloak defect requiring owner disposition
  (upstream issue, image digest pinning to a known-good build, or an
  approved alternative finalization workflow). Phase 2 remains BLOCKED;
  the Option-A fixture and probe test are complete and will pass against
  a Keycloak build where this defect is absent.

stopRuleApplied: >
  Packet assumption: "if import cannot express the required exchange
  permission model deterministically, STOP and report (same rule as
  I1-IAM-001)."
