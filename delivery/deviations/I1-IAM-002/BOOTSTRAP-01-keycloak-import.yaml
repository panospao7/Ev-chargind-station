status: "OPEN_REQUIRES_OWNER_DECISION"
title: "Keycloak 26.6 realm import cannot deterministically express the svc-* client finalization"
description: >
  Phase 2 (AC-06) assumed the realm import expresses the full svc-* client
  configuration (attributes incl. Standard Token Exchange V2 toggle,
  audience protocol mappers). Empirical probing on Keycloak 26.6
  (quay.io/keycloak/keycloak:26.6, feature token-exchange-standard) found:
  (1) the directory import (--import-realm) succeeds but SILENTLY strips
  client attributes and protocolMappers while importing the rest; (2) the
  Admin-REST full-realm import returns 201 but the same stripping occurs on
  read-back; (3) after such an import, any client PUT returns 409 Duplicate
  resource error even for a minimal attribute change; (4) protocolMappers
  CAN be added via the protocol-mappers/add-models endpoint (verified:
  aud-svc-station-operations created, 204). Non-UUID pinned client ids in
  the realm file make the REST full import 409 outright (removing them lets
  the import pass). The probe test (apps/bff RealmImportProbeTest) asserts
  the current failing state and will encode the final recipe.
options:
  - id: A
    label: "Admin-REST bootstrap component (code)"
    detail: >
      Approve a small service-owned bootstrap (KeycloakAdminRestBootstrap:
      import realm, then per-client PUT/mappers/permission calls via Admin
      REST, executed at dev-stack startup or as a test fixture). The
      attribute-stripped import becomes a known first step; finalization is
      code against the Admin API. Proven workable (mappers created via REST
      in this probe). Requires: scope amendment adding an infra/bootstrap
      code location to allowedFiles.
  - id: B
    label: "Different Keycloak version"
    detail: >
      Probe Keycloak 25.x or 26.x patch variants for an import path that
      preserves attributes/mappers; re-run the same probe test against the
      chosen version. Risk: STX-v2 availability and support matrix change.
  - id: C
    label: "Documented manual console configuration (dev-only)"
    detail: >
      Keep import as-is (clients/roles/users) and document a one-time manual
      Admin-console checklist per developer for attributes/mappers/STX.
      Weakest determinism; CI proofs (Testcontainers) would still need
      option A's code.
recommendation: "Option A (with the phase-3 Testcontainers suite as the proof harness)."
empiricalFindings (2026-09-15, Option A probe on clean KC 26.6):
  - bare-realm Admin-REST import (users included): 201, users import with
    emailVerified honored (ROPC then resolves past verifyEmail only after
    user-level re-check — see remaining quirk below)
  - client-level POST with FULL representation: 201 x9, zero failures
  - GET read-back immediately after creation hides custom attributes and
    protocolMappers (representation stale until a subsequent write)
  - protocol-mappers/add-models (array body): 204, mappers created and
    then visible on read-back (aud-svc-* x7 verified)
  - client PUT with attributes: 204 on master realm; 409 Duplicate
    resource on the probe realm even for minimal payloads — under
    investigation (suspected polluted-state artifact of the double
    import in the probe; clean-container re-run required)
  - ROPC on security-test-client: still invalid_grant "Account is not
    fully set up" despite users[].emailVerified=true in the import and
    empty requiredActions on read-back — user-representation import
    quirk; workaround candidates: Admin-REST user PUT (set emailVerified
    post-import) or a set-single-attribute UPDATE, to be re-run on a
    clean container
  - consequence: Option A (Admin-REST bootstrap) is viable; the exact
    finalization sequence must run against a CLEAN container in one pass
    (realm-bare import → client POSTs → attributes PUT → add-models →
    STX permission wiring), encoded as the phase-3 test fixture

correctedRootCause (2026-09-20 — supersedes the upstream-defect hypothesis):
  The 409/attribute-loss was NOT an upstream Keycloak defect. Root cause:
  per-client Admin-REST lookups (GET /clients?client_id=X) returned
  unstable/wrong results in this environment, so finalization PUTs and
  add-models calls landed on wrong client UUIDs (the all-7-mappers-
  on-every-client read-back was cross-contamination from the same bug).
  Fix: fetch the client list ONCE, index locally by clientId. With that,
  the full Option-A recipe works on KC 26.6.4: bare-realm import (users),
  bare client POSTs, attributes-only PUT finalization (clientId MUST be
  omitted from PUT payloads — including it triggers rename-duplicate 409),
  add-models mappers. Probe test: 2/2 PASS (config survival + semantic
  STX grant). Earlier claims of upstream defect are retracted.

phase3ClientKeysFinding (2026-09-20, DEBUG-level evidence):
  With the realm/client/required-action bootstrap fully working (ROPC token
  acquisition OK; sessions; the negative exchange case passing), the STX-v2
  exchange itself fails client authentication: KC 26.6 client-jwt key
  loading returns ZERO keys for ev-bff regardless of configuration path:
  - jwks.string attribute (verified persisted; kid and no-kid variants;
    minimal {kty,n,e} JWK)
  - jwks.url attribute (fixture-served JWKS over host.testcontainers.internal)
  - with/without serviceAccountsEnabled, with/without signing.alg attribute
  KC DEBUG: InfinispanPublicKeyStorageProvider 'Public keys retrieved
  successfully ... New kids: []' → 'PublicKey wasn't found ... Available
  kids: []' → client-jwt FAILED → TOKEN_EXCHANGE_ERROR
  error="client_credentials_setup_required".
  The assertion itself is correctly formed (kid header, iss/sub=ev-bff,
  aud=issuer, 60s, unique jti) and the identical key signs fine in node.
  Suspected KC 26.6 client-keys storage behavior (console-vs-API attribute
  handling or an additional required credential setup step); needs a fresh
  focused investigation (KC source for client_credentials_setup_required /
  console-generated-JWKS comparison / newer KC).
  Phase-3 state: exchange client + session cache + service implemented and
  compiling; §7.3 negative case (unsupported audience) PASSES; positive
  cases blocked on this finding.

phase3RecipeLadder (2026-09-20, final state of this round):
  Advances beyond the client-keys finding — the recipe now progresses to
  the STX permission layer on KC 26.6 via the REGISTRATION API path:
  1. bare-realm Admin-REST import (users) + required-actions disable → OK
  2. client creation via /realms/{r}/clients-registrations/default with an
     initial access token (POST /admin/realms/{r}/clients-initial-access)
     — clientAuthenticatorType and directAccess SURVIVE creation on this
     path (admin-POST strips them)
  3. attributes-only PUT finalization (STX attr, jwks.string, mappers) →
     attributes persist
  4. ROPC on the public probe client → subject token OK
  5. exchange: client authentication PASSES (private_key_jwt via jwks.string
     attribute set by PUT — the earlier zero-kids failure was an artifact of
     admin-POST-created clients where authType/jwks state diverged), and the
     flow now reaches the STX permission layer:
     403 access_denied "Client is not within the token audience"
  Remaining: KC 26.6 STX authorization requires either (a) the subject
  token to carry the target audience (probe: audience mapper on the probe
  client persisted but did not reach the ROPC token aud — mapper-vs-ROPC
  quirk, unresolved) or (b) a token-exchange permission granting ev-bff —
  the v1 /management/permissions endpoint returns 501 Feature not enabled
  even with admin-fine-grained-authz(:v2) enabled, and the v2 permissions
  REST surface was not locatable within this round. NEXT: locate the KC
  26.6 STX permission configuration surface (console-captured request,
  KC source for StandardTokenExchangePolicyProvider, or KC 26.7+ probe).
  Phase-3 code (client/cache/service/tests) is complete and compiles; the
  6 positive tests await this last configuration step.

audienceMapperFindings (2026-09-21, closing this round):
  The STX audience check requires the REQUESTING client (ev-bff) inside the
  subject token audience — matching the real BFF flow (subject token issued
  FOR ev-bff). Probe attempts to add an audience to the probe client token:
  - included.client.audience mapper via PUT protocolMappers: persists on the
    client, does NOT reach the ROPC token aud
  - included.custom.audience (ev-bff) same result
  - mapper inline in the registration POST: registration 403s (registration
    policy rejects mappers)
  Working hypothesis for the next session: the probe client needs the
  audience via a REALM/CLIENT-SCOPE mapper (default client scopes apply to
  ROPC tokens where client-level PUT mappers may not), OR the ROPC token
  subject should come from the authorization-code flow with ev-bff itself
  as the client (the true production shape — subject token aud=ev-bff
  natively), possibly using the fixture to drive a headless code+PKCE
  login for driver-local. The latter is the semantically exact simulation
  of the SEC-001 §7.1 flow and is the recommended next step.

headlessLoginRound (2026-10-01):
  BREAKTHROUGH: the headless code+PKCE login as ev-bff WORKS end to end
  (auth request → login form POST with manual Cookie header → code →
  private_key_jwt code exchange → session created with the production-exact
  subject token aud=ev-bff/azp=ev-bff). The exchange audience check now
  PASSES (no more not-within-token-audience) and the flow reaches the last
  gate: "Requested audience not available: svc-station-operations".
  Disproven hypotheses (recorded so they are not retried):
  - audience mapper on the requesting client (add-models, persisted): does
    NOT satisfy the availability check
  - custom-vs-client audience mapper variants: no difference
  - KC-side cache/re-PUT: no difference
  Also fixed this round: STX toggle must be true on the REQUESTING client
  as well (KC checks both sides); login POST needs credentialId+login
  fields; CookieHandler does not reliably attach KC cookies — manual
  Set-Cookie → Cookie header is deterministic.
  NEXT (single remaining gate): determine how KC 26.6 decides the AVAILABLE
  audiences for an STX-v2 request. Best leads: (1) drive the admin console
  STX flow once and capture what it configures (browser devtools), (2) read
  KC 26.6 source StandardTokenExchangeV2Provider.getRequestedAudiences /
  validateAudience, (3) probe KC 26.7/27 where the model may differ. Once
  the audience set is configured correctly, the 6 positive tests run
  unchanged (client, cache, service, session flow all proven).

stopRuleApplied: >
  Packet assumption: "if import cannot express the required exchange
  permission model deterministically, STOP and report (same rule as
