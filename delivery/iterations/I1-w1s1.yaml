schemaVersion: "1.0"
iterationId: "I1"
title: "W1-S1 first vertical slice"
goal: >
  Deliver the GOV-007 §3 first vertical slice end to end with local
  reproducibility: repeatable infrastructure seed, public station discovery,
  interval availability, driver authentication, EVSE hold, booking
  confirm/view/cancel, check-in, simulated charging with monitoring and stop,
  and a reproducible session summary — on the approved seven-service topology.
owner: "Project Owner / Delivery Lead"
releaseWave: "W1"
sliceApplicability: "W1-S1"
nonGoals:
  - "All W1-S2 completion scope (GOV-007 §4): rescheduling, operator
    station/EVSE/connector/tariff/policy management, maintenance and fault
    workflows, operator booking intervention, analytics, administrator
    suspension controls, rich notification templates, full retry/quarantine/
    replay operations, privileged-action audit, backup/restore drills."
  - "W2 and W3 deferrals (GOV-007 §5): operator application approval, staff
    invitations, support cases, notification preferences, device reservation
    mirror, privacy export/deletion/retention coordination."
  - "Payments, real charger hardware, OCPP compliance claims, native mobile
    applications, routing, direct browser-to-simulator communication,
    multi-region production HA."
  - "New service boundaries, database ownership models, or consistency models
    (GOV-007 §2)."
  - "Production deployment or production credentials; the cloud demonstrator
    is provisional and later in the slice."
entryCriteria:
  - "I0 exit criteria met: G3 contract validation reproducibly green on main
    (first fully green run 0be0cfde, 2026-09-10); delivery control plane
    executable; I0 tasks VERIFIED."
  - "GOV-007 W1-S1 scope approved; REQ-001 wave tags present."
  - "W1 persistence and executable contract baseline (ARC-022 §19) approved
    by the Project Owner — the persistence/API contract gate."
  - "No unresolved W1-critical OPEN decision per GOV-007 §7."
exitCriteria:
  - "The S1 journey (GOV-007 §3) runs end to end from a clean local checkout:
    docker compose up, seed/reset, discovery, authentication, hold, booking,
    cancellation, check-in, simulated charging, session summary."
  - "ARC-015 §4 milestone exit criteria met for M1 (engineering runway),
    M2 (secure platform core), M3 (discovery slice), M4 (booking correctness
    slice incl. the allocation race suite), M5 (charging fulfilment slice)."
  - "S1-01 through S1-11 capabilities demonstrable per GOV-007 §3, including
    the mandatory failure demonstrations of S1-08 and the messaging
    guarantees of S1-09."
  - "Traceability registry rows for implemented W1-S1 requirements move from
    PLANNED only with CI verification evidence; no requirement is marked
    VERIFIED without a green run."
risks:
  - "EPIC-10 allocation correctness is the project critical path; the
    PostgreSQL exclusion-constraint race suite must pass before booking UX
    expansion (ARC-015 §7)."
  - "Keycloak/BFF token exchange (POC-01) must be proven before protected
    frontend workflows."
  - "Provisional decisions (polling, local mail catcher, device credential
    profile, map provider) must stay replaceable and must not harden into
    architecture by accident."
